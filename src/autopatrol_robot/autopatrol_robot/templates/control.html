        /* ============================================================
           暖色皮肤覆盖层
           ------------------------------------------------------------
           上面的骨架样式沿用了旧的冷色配色（蓝/冷灰）。这里用同优先级
           但位置更靠后的规则整批改成暖色，避免逐个回去改动 1000 行旧
           CSS（容易漏、也不方便日后统一调色）。
           ============================================================ */

        /* ---- 摇杆 ---- */
        .joystick-base {
            background: linear-gradient(145deg, #fff3e3, #f5dcc0);
            box-shadow:
                0 10px 20px rgba(160, 112, 60, 0.20),
                inset 0 2px 4px rgba(255, 255, 255, 0.92),
                inset 0 -4px 10px rgba(214, 168, 116, 0.28);
        }

        .joystick-thumb {
            background: radial-gradient(circle at 32% 28%, #fffdf8, #ffd9a8);
            box-shadow:
                0 4px 12px rgba(160, 112, 60, 0.28),
                inset 0 -2px 5px rgba(210, 158, 100, 0.35);
            color: var(--w-brand);
        }

        .direction-indicator {
            color: #b06a24;
            background: var(--w-brand-soft);
            border-radius: 999px;
        }

        .speed-value { color: var(--w-brand); }

        .speed-item label { color: var(--w-sub); }

        input[type="range"] { background: #f0e0cc; }

        input[type="range"]::-webkit-slider-thumb {
            background: var(--w-brand);
            box-shadow: 0 1px 4px rgba(160, 112, 60, 0.35);
        }

        /* ---- 顶栏胶囊 ---- */
        .topbar {
            background: rgba(255, 250, 243, 0.82);
            border-bottom: 1px solid var(--w-line);
        }

        .topbar .brand { color: var(--w-brand); }

        #log-container.topbar-log {
            background: #fff6ea;
            border-color: var(--w-line);
            color: var(--w-sub);
        }

        .conn-pill {
            background: #fff6ea;
            border-color: var(--w-line);
            color: var(--w-sub);
        }

        .status-dot { background: #d8c6b2; }

        .status-dot.connected {
            background: var(--w-ok);
            box-shadow: 0 0 7px var(--w-ok);
        }

        /* ---- 浮层卡片 ---- */
        .widget {
            background: var(--w-card);
            border-color: var(--w-line);
        }

        .widget-head {
            background: linear-gradient(#fff8ee, #fff2e2);
            border-bottom-color: var(--w-line);
        }

        .widget-title { color: #7a5232; }

        .widget-badge {
            background: #f7ece0;
            color: #a4826a;
        }

        .widget-badge.live {
            background: #e8f5e4;
            color: #4f8c46;
        }

        .widget-badge.busy {
            background: #fff2d4;
            color: #a97708;
        }

        .widget-close {
            background: #f8eddf;
            color: #b08a6a;
        }

        .widget-close:hover {
            background: #ffe0d9;
            color: var(--w-err);
        }

        /* ---- 地图视口：保留深色底（地图本身是灰度的，
                深暖棕比纯黑更融进页面） ---- */
        .map-viewport,
        #mapCanvas {
            background: #2b2118;
        }

        /* ---- 摄像头占位 ---- */
        .camera-placeholder {
            background: #3a2c20;
            color: #d7bfa6;
        }

        .camera-container { background: #2b2118; }

        /* ---- 按钮 ---- */
        .tool-btn { border-color: var(--w-line); color: #7a5232; }

        .tool-btn:hover:not(:disabled) {
            border-color: var(--w-brand);
            color: var(--w-brand);
            background: #fffaf2;
        }

        .tool-btn.go {
            background: var(--w-brand);
            border-color: var(--w-brand);
            color: #fff;
            box-shadow: 0 3px 0 #cd7128;
        }

        .tool-btn.go:hover:not(:disabled) {
            background: #e07d2c;
            color: #fff;
        }

        .tool-btn.stop {
            background: #ffeee9;
            border-color: #f6c3b8;
            color: #c1503c;
        }

        .tool-btn.stop:hover:not(:disabled) {
            background: #ffe0d7;
            color: #c1503c;
        }

        /* ---- 保存面板 ---- */
        .save-panel {
            background: #fff7ec;
            border-color: #f2ddc4;
        }

        .save-panel input[type="text"] {
            border-color: #eddbc4;
            background: #fffdf9;
            color: var(--w-ink);
        }

        .save-panel input[type="text"]:focus { border-color: var(--w-brand); }

        .save-hint { color: #bda890; }

        .save-hint code {
            background: #f7ead9;
            padding: 1px 5px;
            border-radius: 5px;
            font-size: 10px;
            color: #96693a;
        }

        /* ---- 状态行 ---- */
        .map-status-line { background: #fbf2e6; color: var(--w-sub); }
        .map-status-line.ok { background: #eaf6e6; color: #4f8c46; }
        .map-status-line.warn { background: #fff3d9; color: #a97708; }
        .map-status-line.err { background: #ffe9e4; color: #bf4a35; }

        /* ---- 输入框 / 气泡 ---- */
        .composer {
            background: var(--w-card);
            border-color: var(--w-line);
        }

        .composer:focus-within {
            border-color: var(--w-brand);
            box-shadow: 0 8px 30px rgba(240, 140, 60, 0.18);
        }

        #chat-input { color: var(--w-ink); }
        #chat-input::placeholder { color: #cbb49a; }

        .send-btn {
            background: var(--w-brand);
            box-shadow: 0 3px 0 #cd7128;
        }

        .send-btn:active { transform: translateY(3px); box-shadow: none; }

        .send-btn:disabled { background: #e5d5c2; box-shadow: none; }

        .msg-row.user .msg-bubble {
            background: var(--w-brand);
            box-shadow: 0 3px 0 #dc7c2e;
        }

        .msg-row.bot .msg-bubble {
            background: var(--w-card);
            border-color: var(--w-line);
            box-shadow: 0 2px 10px rgba(150, 110, 70, 0.08);
        }

        .msg-meta { color: #c0a68c; }

        .chat-scroll::-webkit-scrollbar-thumb { background: #e8d5bd; }

        /* ---- Toast ---- */
        .toast { background: rgba(91, 58, 34, 0.94); }
        .toast.ok { background: rgba(79, 140, 70, 0.96); }
        .toast.err { background: rgba(191, 74, 53, 0.96); }
        .toast.warn { background: rgba(169, 119, 8, 0.96); }

        /* ============================================================
           3D 家庭场景（分层视差）
           ------------------------------------------------------------
           做法说明：没有用真 3D 变换（rotateX/rotateY 拼房间），而是
           把整个房间画成一张透视正确的 SVG，再按景深把它切成 4 层，
           鼠标移动时给不同层不同的位移量。
           好处：绝对不会穿模、手机端也不掉帧，观感上是同一个「镜头
           轻微移动」的效果。
           ============================================================ */
        .room-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #fdf4e8;
        }

        .room-svg {
            position: absolute;
            inset: -3.5%;           /* 留出位移余量，避免视差时露边 */
            width: 107%;
            height: 107%;
            display: block;
        }

        /* 每个景深层是一张独立的 <svg>。
           ------------------------------------------------------------
           为什么不用「一个 svg + 多个 <g>」：实测 Chrome 会忽略
           SVG <g> 上的 CSS transform（写入 style 能读回，但
           computed transform 恒为 matrix(1,0,0,1,0,0)，画面纹丝不动）。
           换成多个 <svg> 根元素后走的是普通 HTML 元素的 CSS transform，
           一定生效，而且视差需要的位移/过渡都能正常工作。 */
        .room-layer {
            position: absolute;
            inset: -3.5%;
            width: 107%;
            height: 107%;
            display: block;
            pointer-events: none;
        }

        .room-layer[data-depth] {
            will-change: transform;
            /* 过渡给一点点惯性：完全无过渡会显得机械，太长又跟不上手。
               0.18s 是实测手感最接近「镜头有阻尼」的值。 */
            transition: transform 0.18s ease-out;
        }

        /* 暗角：让中间的对话区更突出 */
        .room-vignette {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(120% 90% at 50% 40%,
                    rgba(253, 244, 232, 0.10) 0%,
                    rgba(253, 244, 232, 0.42) 62%,
                    rgba(246, 232, 214, 0.72) 100%);
            pointer-events: none;
        }

        /* ============================================================
           视图切换（主页 / 操作页）
           ============================================================ */
        .view {
            position: fixed;
            inset: 0;
            z-index: 10;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .view.is-gone {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.985);
            /* 隐藏后必须彻底不可见，否则屏幕阅读器和 Tab 键仍会
               走到另一个页面里的按钮上。visibility 的延迟只加在
               「隐藏」这一侧，淡出动画才不会被立刻截断。 */
            visibility: hidden;
            transition: opacity 0.5s ease, transform 0.5s ease,
                        visibility 0s linear 0.5s;
        }

        .view-home { z-index: 30; }

        /* ============================================================
           主页
           ============================================================ */
        .home-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(28px, 6vh, 64px);
            padding: 20px;
        }

        /* 标题 + 机器人的定位容器 */
        .home-hero {
            position: relative;
            /* 机器人宽度与它和标题之间的间隙统一用变量管理，
               下面的 padding-left 与动画位移都基于它，保证三者永远对齐 */
            --butler-w: clamp(74px, 14vw, 168px);
            --butler-gap: clamp(6px, 1.4vw, 22px);
            display: flex;
            align-items: center;
            justify-content: center;
            /* 左侧留出「机器人 + 间隙」的空间，机器人最终就停在这里 */
            padding-left: calc(var(--butler-w) + var(--butler-gap));
        }

        .home-title {
            position: relative;
            z-index: 3;                   /* 盖在机器人上面 */
            font-size: clamp(34px, 8.2vw, 104px);
            font-weight: 800;
            letter-spacing: clamp(1px, 0.5vw, 5px);
            color: #7a4d28;
            line-height: 1.08;
            padding: 0.13em 0.42em 0.2em;
            border-radius: clamp(14px, 2vw, 30px);
            /* 不透明胶囊底：机器人藏在它后面才看不见 */
            background: linear-gradient(180deg, #fffaf3 0%, #fdf0dd 100%);
            /* 立体字：多层下投影模拟厚度 */
            text-shadow:
                0 1px 0 #f3dcc0,
                0 2px 0 #eed3b2,
                0 3px 0 #e8caa5,
                0 4px 0 #e2c198,
                0 5px 0 #dcb88b,
                0 9px 20px rgba(122, 77, 40, 0.26);
            box-shadow: 0 18px 44px rgba(150, 105, 62, 0.20);
            animation: titleIn 1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.2s both;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.92);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: none;
                filter: blur(0);
            }
        }

        /* 管家机器人
           ----------------------------------------------------------
           起点：向右平移「自身宽度 + 间隙」，正好整个落进标题的胶囊
                 背景里，被标题完全遮住。
           终点：translateX(0)，停在 padding-left 留出的那块空位上。
           这样动画就是「从标题后面向左滑出来」。 */
        .butler {
            position: absolute;
            z-index: 2;                   /* 在标题之下 */
            left: 0;
            top: 50%;
            width: var(--butler-w);
            transform: translateY(-50%)
                       translateX(calc(100% + var(--butler-gap)));
            opacity: 0;
            animation: butlerOut 1.15s cubic-bezier(0.34, 1.28, 0.42, 1) 1.05s both;
            filter: drop-shadow(0 16px 26px rgba(150, 105, 62, 0.26));
        }

        @keyframes butlerOut {
            0% {
                opacity: 0;
                transform: translateY(-50%)
                           translateX(calc(100% + var(--butler-gap)))
                           scale(0.82);
            }
            30% { opacity: 1; }
            100% {
                opacity: 1;
                transform: translateY(-50%) translateX(0) scale(1);
            }
        }

        /* 连接以开始 */
        .home-start {
            position: relative;
            z-index: 5;
            padding: clamp(13px, 1.6vh, 18px) clamp(30px, 4vw, 48px);
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: clamp(15px, 1.5vw, 19px);
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(180deg, #ffa75e 0%, #f08c3c 100%);
            box-shadow:
                0 6px 0 #cd7128,
                0 16px 30px rgba(200, 125, 50, 0.34),
                inset 0 2px 3px rgba(255, 255, 255, 0.55);
            animation: startIn 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) 2.05s both;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        @keyframes startIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        .home-start:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #cd7128, 0 6px 14px rgba(200, 125, 50, 0.28);
        }

        .home-start:disabled {
            cursor: default;
            opacity: 0.85;
        }

        /* 连接中的进度提示 */
        .home-status {
            position: relative;
            z-index: 5;
            font-size: 13px;
            color: #a4826a;
            min-height: 20px;
            text-align: center;
            animation: startIn 0.6s ease 2.3s both;
        }

        .home-status .dots::after {
            content: '';
            animation: dots 1.4s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        /* ============================================================
           左右两个圆形按钮（手柄 / 箭头）
           ============================================================ */
        .composer-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orb {
            position: relative;
            flex-shrink: 0;
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 33% 26%,
                #fff6ea 0%, #ffd39a 48%, #eaa055 100%);
            box-shadow:
                0 6px 0 #cd7f36,
                0 12px 22px rgba(170, 110, 50, 0.34),
                inset 0 2px 4px rgba(255, 255, 255, 0.92),
                inset 0 -4px 8px rgba(196, 130, 62, 0.32);
            transition: transform 0.11s ease, box-shadow 0.11s ease,
                        background 0.18s ease;
            touch-action: none;
        }

        .orb:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 #cd7f36,
                0 5px 12px rgba(170, 110, 50, 0.30),
                inset 0 2px 4px rgba(255, 255, 255, 0.92);
        }

        /* 选中态：淡黄高亮 */
        .orb.is-selected {
            background: radial-gradient(circle at 33% 26%,
                #fffdf0 0%, var(--w-sel) 52%, #f3d071 100%);
            box-shadow:
                0 6px 0 #d3a63e,
                0 14px 26px rgba(200, 160, 50, 0.42),
                inset 0 2px 4px rgba(255, 255, 255, 0.95),
                inset 0 -4px 8px rgba(204, 168, 62, 0.34);
        }

        .orb.is-open {
            background: radial-gradient(circle at 33% 26%,
                #fffdf0 0%, var(--w-sel) 52%, #f3d071 100%);
        }

        /* 选中时外圈光环 */
        .orb.is-selected::after,
        .orb.is-open::after {
            content: '';
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            border: 2.5px solid rgba(240, 200, 80, 0.75);
            animation: orbHalo 1.8s ease-out infinite;
            pointer-events: none;
        }

        @keyframes orbHalo {
            0% { transform: scale(0.94); opacity: 0.85; }
            70% { transform: scale(1.12); opacity: 0; }
            100% { transform: scale(1.12); opacity: 0; }
        }

        .orb-art {
            width: 60%;
            height: 60%;
            display: block;
            pointer-events: none;
        }

        @media (max-width: 640px) {
            .orb { width: 48px; height: 48px; }
            .composer-row { gap: 7px; }
        }

        /* 主页窄屏适配
           ------------------------------------------------------------
           标题 + 机器人的宽度之和在 390px 屏上会差 1px 溢出（实测），
           所以这里把三者的尺寸一起收敛：机器人、字号、内外边距。
           高度方向也放开滚动，横屏手机（高 390px）不至于把按钮挤出屏。 */
        @media (max-width: 520px) {
            .home-stage {
                gap: clamp(18px, 4.5vh, 40px);
                padding: 14px 12px;
                overflow-y: auto;
            }
            .home-hero {
                --butler-w: clamp(52px, 17vw, 74px);
                --butler-gap: 5px;
                max-width: 100%;
            }
            .home-title {
                font-size: clamp(22px, 7.4vw, 34px);
                letter-spacing: 1px;
                padding: 0.1em 0.1em 0.16em;
                border-radius: 14px;
            }
            .home-start {
                padding: 12px 26px;
                font-size: 15px;
            }
        }

        /* 极窄兜底：真机不会这么窄，但窗口被压小时不能撑破布局 */
        @media (max-width: 300px) {
            .home-hero {
                --butler-w: 44px;
                --butler-gap: 4px;
            }
            .home-title {
                font-size: 19px;
                letter-spacing: 0;
            }
        }

        /* ============================================================
           轮盘（手柄按钮展开）
           ------------------------------------------------------------
           4 个均分扇区，用 conic-gradient 铺底色；每个扇区一个
           rotate 定位的文字标签。高亮通过切换 --s1..--s4 实现。
           ============================================================ */
        .radial {
            position: fixed;
            width: 264px;
            height: 264px;
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            /* --rs 由 JS 按可用空间设置：小窗口下整体缩小，
               否则 264px 的轮盘会盖住按钮甚至溢出屏幕 */
            --rs: 1;
            transform: scale(calc(0.62 * var(--rs))) translateY(18px);
            transform-origin: 50% 100%;
            transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.34, 1.4, 0.44, 1);
        }

        .radial.is-open {
            opacity: 1;
            pointer-events: auto;
            transform: scale(var(--rs)) translateY(0);
        }

        .radial-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            --s1: #ffe3bd;   /* 扇区1：右   */
            --s2: #ffd9ac;   /* 扇区2：下   */
            --s3: #ffe3bd;   /* 扇区3：左   */
            --s4: #ffd9ac;   /* 扇区4：上   */
            background: conic-gradient(from -45deg,
                var(--s1) 0deg 90deg,
                var(--s2) 90deg 180deg,
                var(--s3) 180deg 270deg,
                var(--s4) 270deg 360deg);
            box-shadow:
                0 16px 44px rgba(150, 105, 62, 0.32),
                inset 0 0 0 2px rgba(255, 255, 255, 0.7);
            transition: background 0.12s linear;
        }

        /* 四个扇区各自高亮 */
        .radial-ring.hl-0 { --s1: #ffd45e; }
        .radial-ring.hl-1 { --s2: #ffd45e; }
        .radial-ring.hl-2 { --s3: #ffd45e; }
        .radial-ring.hl-3 { --s4: #ffd45e; }

        /* 中心装饰圆 */
        .radial-hub {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 74px;
            height: 74px;
            margin: -37px 0 0 -37px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fffdf7, #ffe9d2);
            box-shadow:
                0 4px 14px rgba(150, 105, 62, 0.24),
                inset 0 0 0 2px rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            pointer-events: none;
        }

        .radial-label {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 92px;
            height: 92px;
            margin: -46px 0 0 -46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            pointer-events: none;
            font-size: 11.5px;
            font-weight: 700;
            color: #8a5a2f;
            text-align: center;
            line-height: 1.2;
            transition: color 0.12s ease, transform 0.12s ease;
        }

        .radial-label .ico { font-size: 19px; line-height: 1; }

        /* 四个方向：上 / 右 / 下 / 左 */
        .radial-label.pos-up    { transform: translateY(-88px); }
        .radial-label.pos-right { transform: translateX(88px); }
        .radial-label.pos-down  { transform: translateY(88px); }
        .radial-label.pos-left  { transform: translateX(-88px); }

        .radial-label.is-hl { color: #a05a00; }
        .radial-label.pos-up.is-hl    { transform: translateY(-88px) scale(1.16); }
        .radial-label.pos-right.is-hl { transform: translateX(88px) scale(1.16); }
        .radial-label.pos-down.is-hl  { transform: translateY(88px) scale(1.16); }
        .radial-label.pos-left.is-hl  { transform: translateX(-88px) scale(1.16); }

        .radial-tip {
            position: absolute;
            left: 50%;
            bottom: -26px;
            transform: translateX(-50%);
            font-size: 10.5px;
            color: #b08a6a;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ============================================================
           常用指令列表（箭头按钮展开）
           ============================================================ */
        .cmd-list {
            position: fixed;
            width: 210px;
            max-height: min(58vh, 430px);
            overflow-y: auto;
            z-index: 45;
            padding: 9px;
            border-radius: 18px;
            background: var(--w-card);
            border: 1px solid var(--w-line);
            box-shadow: var(--w-shadow-lg);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9) translateY(14px);
            transform-origin: 50% 100%;
            transition: opacity 0.18s ease, transform 0.24s cubic-bezier(0.34, 1.4, 0.44, 1);
            scrollbar-width: thin;
        }

        .cmd-list.is-open {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
        }

        .cmd-list::-webkit-scrollbar { width: 6px; }
        .cmd-list::-webkit-scrollbar-thumb {
            background: #ecd9c0;
            border-radius: 6px;
        }

        .cmd-list-head {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #c0a68c;
            padding: 4px 8px 7px;
            text-transform: uppercase;
        }

        .cmd-item {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 9px 11px;
            border: none;
            border-radius: 11px;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #7a5232;
            text-align: left;
            cursor: pointer;
            transition: background 0.13s ease, transform 0.1s ease;
        }

        .cmd-item .ico { font-size: 15px; }

        .cmd-item:active,
        .cmd-item.is-hl {
            background: var(--w-sel);
            transform: scale(0.98);
        }

        .cmd-item.danger { color: #bf4a35; }

        /* ============================================================
           浮层缩放手柄
           ============================================================ */
        .widget-resize {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 26px;
            height: 26px;
            cursor: nwse-resize;
            touch-action: none;
            z-index: 3;
        }

        .widget-resize::before {
            content: '';
            position: absolute;
            right: 5px;
            bottom: 5px;
            width: 11px;
            height: 11px;
            border-right: 2.5px solid #d9c2a4;
            border-bottom: 2.5px solid #d9c2a4;
            border-radius: 0 0 4px 0;
        }

        .widget:hover .widget-resize::before {
            border-color: var(--w-brand);
        }

        .widget.has-custom-size .widget-body {
            /* 用户手动缩放后，内容区跟着撑满 */
            flex: 1;
            min-height: 0;
        }

        /* ============================================================
           右下角设置抽屉
           ============================================================ */
        .settings-dock {
            position: fixed;
            /* 放左上角：原来在右下角会和「常用指令」箭头按钮重叠
               （手机上实测两者差不到 10px）。左上角只有主页才用得到，
               操作页那里一直是空的。 */
            left: 14px;
            top: 12px;
            right: auto;
            bottom: auto;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            /* 容器本身不接收事件：收起状态下菜单仍有高度（只是透明），
               会把齿轮按钮的点击吃掉。 */
            pointer-events: none;
        }

        .settings-fab { pointer-events: auto; }

        .settings-menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 9px;
            border-radius: 16px;
            background: var(--w-card);
            border: 1px solid var(--w-line);
            box-shadow: var(--w-shadow-lg);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) scale(0.92);
            /* 从左上角往下展开 */
            transform-origin: 0 0;
            transition: opacity 0.16s ease, transform 0.22s cubic-bezier(0.34, 1.4, 0.44, 1);
            min-width: 148px;
            /* 窄屏兜底：菜单不能再把屏幕撑宽 */
            max-width: calc(100vw - 28px);
        }

        .settings-log {
            max-height: 108px;
            overflow-y: auto;
            margin-top: 3px;
            padding: 8px 10px;
            border-radius: 10px;
            background: #fdf5e9;
            font-size: 10.5px;
            line-height: 1.5;
            color: #a4826a;
            scrollbar-width: thin;
            word-break: break-all;
        }

        .settings-menu.is-open {
            opacity: 1;
            pointer-events: auto;
            transform: none;
        }

        .settings-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 13px;
            border: none;
            border-radius: 10px;
            background: transparent;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: #7a5232;
            cursor: pointer;
            white-space: nowrap;
            text-align: left;
        }

        .settings-item:active { background: var(--w-sel); }

        .settings-item.danger { color: #bf4a35; }

        .settings-fab {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 33% 26%, #fff8ee, #f7dfc2);
            box-shadow:
                0 4px 0 #e0c4a4,
                0 8px 18px rgba(150, 105, 62, 0.26),
                inset 0 2px 3px rgba(255, 255, 255, 0.9);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            touch-action: none;
        }

        .settings-fab:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #e0c4a4, 0 4px 10px rgba(150, 105, 62, 0.22);
        }

        .settings-fab.is-open { background: radial-gradient(circle at 33% 26%, #fffdf0, var(--w-sel)); }

        /* 设置面板里的迷你日志 */
        .settings-log {
            max-height: 108px;
            overflow-y: auto;
            margin-top: 3px;
            padding: 8px 10px;
            border-radius: 10px;
            background: #fdf5e9;
            font-size: 10.5px;
            line-height: 1.5;
            color: #a4826a;
            scrollbar-width: thin;
        }

        /* ============================================================
           顶部迷你状态胶囊（操作页）
           ============================================================ */
        .status-float {
            position: fixed;
            top: 12px;
            right: 14px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(255, 250, 243, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--w-line);
            box-shadow: 0 4px 14px rgba(150, 105, 62, 0.12);
            font-size: 11.5px;
            color: var(--w-sub);
            white-space: nowrap;
        }

        .status-float .status-dot { width: 8px; height: 8px; }

        /* ============================================================
           定位状态条（2026-11-01）
           ------------------------------------------------------------
           解决的核心痛点：「小车位姿看起来收敛了，实际却没有」——
           用户只能一遍遍问"好了没"。
           现在把 auto_localizer 算出来的激光-地图匹配率、σ、位姿稳定性
           和进度实时摊开给人看，还直接告诉用户"该怎么帮着收敛"。
           ============================================================ */
        .loc-bar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
            z-index: 60;
            width: min(430px, calc(100vw - 190px));
            padding: 7px 13px 8px;
            border-radius: 14px;
            background: rgba(255, 250, 243, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid var(--w-line);
            box-shadow: 0 6px 18px rgba(150, 105, 62, 0.14);
            font-size: 11.5px;
            color: var(--w-sub);
            /* 收起状态：只留一条细边，不挡视线 */
            transition: opacity .25s ease, transform .25s ease;
        }
        .loc-bar.is-hidden { opacity: 0; pointer-events: none; }
        .loc-bar.is-ready  { border-color: #b7d9a8; }
        .loc-bar.is-bad    { border-color: #e0a99b; }

        .loc-head {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .loc-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex: 0 0 auto;
            background: #d9c8b3;
            box-shadow: 0 0 0 3px rgba(217, 200, 179, .22);
            transition: background .25s ease, box-shadow .25s ease;
        }
        .loc-dot.is-ready { background: #5fa845; box-shadow: 0 0 0 3px rgba(95,168,69,.18); }
        .loc-dot.is-bad   { background: #d0664f; box-shadow: 0 0 0 3px rgba(208,102,79,.18); }
        .loc-dot.is-busy  { background: #e0a33c; box-shadow: 0 0 0 3px rgba(224,163,60,.18); }

        .loc-title { color: var(--w-ink); font-weight: 600; }
        .loc-meta  { margin-left: auto; font-variant-numeric: tabular-nums; }

        .loc-track {
            margin-top: 5px;
            height: 4px;
            border-radius: 999px;
            background: #f1e5d5;
            overflow: hidden;
        }
        .loc-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #e0a33c, #5fa845);
            transition: width .3s ease;
        }
        .loc-bar.is-ready .loc-fill { background: #5fa845; }

        /* 原因/建议：只在没就绪时出现，就绪后自动收起省地方 */
        .loc-reason {
            margin-top: 4px;
            line-height: 1.45;
            color: var(--w-sub);
            display: none;
        }
        .loc-reason.is-on { display: block; }
        .loc-reason b { color: var(--w-ink); font-weight: 600; }

        @media (max-width: 640px) {
            .loc-bar {
                width: calc(100vw - 120px);
                padding: 6px 10px 7px;
                font-size: 10.5px;
            }
            .loc-reason { font-size: 10.5px; }
        }

        /* 操作页里 chat-shell 要给顶部胶囊留位置 */
        .view-app .chat-shell { inset: 0; }

        /* 顶部留白要同时让开左上角的齿轮和右上角的状态胶囊 */
        .view-app .chat-column { padding-top: 56px; }

        @media (max-width: 640px) {
            .view-app .chat-column { padding-top: 54px; }
            .radial { width: 232px; height: 232px; }
            .radial-label { width: 80px; height: 80px; margin: -40px 0 0 -40px; font-size: 10.5px; }
            .radial-label.pos-up    { transform: translateY(-74px); }
            .radial-label.pos-right { transform: translateX(74px); }
            .radial-label.pos-down  { transform: translateY(74px); }
            .radial-label.pos-left  { transform: translateX(-74px); }
            .radial-label.pos-up.is-hl    { transform: translateY(-74px) scale(1.14); }
            .radial-label.pos-right.is-hl { transform: translateX(74px) scale(1.14); }
            .radial-label.pos-down.is-hl  { transform: translateY(74px) scale(1.14); }
            .radial-label.pos-left.is-hl  { transform: translateX(-74px) scale(1.14); }
            .settings-dock { right: 11px; bottom: 11px; }
            .settings-fab { width: 42px; height: 42px; font-size: 18px; }
        }
        /* ============================================================
           操作页里的管家机器人（纯 CSS 绘制 + 动作系统）
           ------------------------------------------------------------
           为什么不用 SVG：本项目实测发现 Chrome 会忽略 SVG <g> 上的
           CSS transform（computed 恒为 identity），而机器人需要大量
           分部件动画（点头、抬手、眨眼）。改用 div 堆叠后每个部件都是
           普通 HTML 元素，CSS transform 一定生效。
           ============================================================ */
        .butler-stage {
            position: fixed;
            left: 0;
            /* 站在地板上：地板带带大约从 70% 高度开始，这里取 13vh
               再加最小/最大夹逼，兼顾竖屏手机和桌面 */
            bottom: clamp(92px, 13vh, 138px);
            z-index: 20;               /* 浮在对话之上，才能被点到 */
            pointer-events: none;      /* 只有机器人本体可点，空白处穿透 */
            will-change: transform;
            transition: transform 4.2s cubic-bezier(0.42, 0, 0.58, 1);
        }

        /* 缩放包装层：媒体查询在此层改 scale，不影响内部动画 */
        .butler-scale {
            transform-origin: 50% 100%;
        }

        .butler-unit {
            position: relative;
            /* 基准坐标系 120x172：所有部件的 top/left 都按这个尺寸写死，
               再用 --bt-scale 整体缩放适配手机。
               改尺寸时只需改这两个值 + 下面的百分比定位，不要用 zoom
               （zoom 会让内部的 px 度量失真，上一版就是因此错位）。 */
            width: 120px;
            height: 172px;
            transform-origin: 50% 100%;
            /* 可以被点击（“打机器人”交互） */
            pointer-events: auto;
            cursor: pointer;
            animation: btBreathe 3.6s ease-in-out infinite;
            -webkit-touch-callout: none;
            user-select: none;
        }

        @keyframes btBreathe {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-3px) scaleY(1.015); }
        }

        /* 走路：轮子转动靠 .is-walking，身体只轻微颠，不再大幅左右晃 */
        .butler-unit.is-walking {
            animation: btStep 0.42s ease-in-out infinite;
        }

        @keyframes btStep {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2.5px); }
        }

        /* ---- 地面投影 ---- */
        .bt-shadow {
            position: absolute;
            left: 50%;
            bottom: 2px;
            width: 74px;
            height: 14px;
            margin-left: -37px;
            border-radius: 50%;
            background: rgba(122, 77, 40, 0.20);
            filter: blur(3px);
            z-index: 0;
        }

        /* ---- 身体（燕尾服） ----
           旧的几何踩过两个坑：
             1) 领结放在身体 top:0，但头部底边压下来了 10px，领结全被盖住
                → 现在头下移空出脖子，领结下移到脖子下方
             2) 手臂和身体同色且完全重叠在身体内部 → 看不见，还像粘连
                → 现在手臂挂在身体两侧边缘，颜色加深，再加袖口亮边 */
        .bt-body {
            position: absolute;
            left: 50%;
            top: 84px;
            width: 68px;
            height: 60px;
            margin-left: -34px;
            border-radius: 24px 24px 16px 16px;
            background: linear-gradient(180deg, #9a7551 0%, #7b5638 100%);
            box-shadow: inset 0 -7px 12px rgba(0, 0, 0, 0.16);
            z-index: 2;
        }

        /* 脖子：填住头与身体之间的缝 */
        .bt-neck {
            position: absolute;
            left: 50%;
            top: 68px;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            border-radius: 7px;
            background: linear-gradient(180deg, #e2cdb2 0%, #cdb497 100%);
            z-index: 1;
        }

        /* 白衬衫 */
        .bt-shirt {
            position: absolute;
            left: 50%;
            top: 0;
            width: 26px;
            height: 32px;
            margin-left: -13px;
            border-radius: 0 0 13px 13px;
            background: #fffaf3;
            z-index: 3;
        }

        /* 领结：压在衬衫上，位于脖子下方 */
        .bt-bowtie {
            position: absolute;
            left: 50%;
            top: 78px;
            width: 34px;
            height: 14px;
            margin-left: -17px;
            z-index: 4;
        }

        .bt-bowtie::before,
        .bt-bowtie::after {
            content: '';
            position: absolute;
            top: 0;
            width: 15px;
            height: 14px;
            background: var(--w-err);
        }

        .bt-bowtie::before {
            left: 0;
            border-radius: 4px 9px 9px 4px;
            transform: skewY(10deg);
        }

        .bt-bowtie::after {
            right: 0;
            border-radius: 9px 4px 4px 9px;
            transform: skewY(-10deg);
        }

        /* 领结中间的结 */
        .bt-bowtie-knot {
            position: absolute;
            left: 50%;
            top: 81px;
            width: 11px;
            height: 11px;
            margin-left: -5.5px;
            border-radius: 3px;
            background: #d1564a;
            z-index: 5;
        }

        /* ---- 轮子（带辐条，转动时看得见） ---- */
        .bt-wheel {
            position: absolute;
            bottom: 14px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #7d5a41, #5a3e2c);
            box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.35);
            z-index: 1;
            transform-origin: 50% 50%;
        }

        .bt-wheel.l { left: 33px; }
        .bt-wheel.r { right: 33px; }

        /* 辐条：没有它轮子转动完全看不出来 */
        .bt-wheel::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 2.5px;
            width: 2.5px;
            height: 12px;
            margin-left: -1.25px;
            border-radius: 2px;
            background: rgba(255, 245, 230, 0.62);
        }

        .butler-unit.is-walking .bt-wheel {
            animation: btWheelSpin 0.42s linear infinite;
        }

        /* 方向不同：车往前走，轮子必然同向 */
        @keyframes btWheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ---- 头 ---- */
        .bt-head {
            position: absolute;
            left: 50%;
            top: 14px;
            width: 68px;
            height: 60px;
            margin-left: -34px;
            border-radius: 30px;
            background: linear-gradient(180deg, #fffdf8 0%, #f7ead9 100%);
            box-shadow:
                0 3px 10px rgba(150, 105, 62, 0.16),
                inset 0 -3px 6px rgba(230, 210, 185, 0.5);
            transform-origin: 50% 88%;
            transition: transform 0.34s cubic-bezier(0.34, 1.4, 0.44, 1);
            z-index: 5;
        }

        /* 面罩 */
        .bt-visor {
            position: absolute;
            left: 50%;
            top: 16px;
            width: 50px;
            height: 34px;
            margin-left: -25px;
            border-radius: 15px;
            background: linear-gradient(180deg, #54422f 0%, #3a2c20 100%);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.42);
        }

        /* 眼睛 */
        .bt-eye {
            position: absolute;
            top: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffd97a;
            box-shadow: 0 0 6px rgba(255, 217, 122, 0.75);
            transition: all 0.2s ease;
        }

        .bt-eye.l { left: 9px; }
        .bt-eye.r { right: 9px; }

        /* 眼睛高光 */
        .bt-eye::after {
            content: '';
            position: absolute;
            left: 2.5px;
            top: 2.5px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            transition: opacity 0.15s ease;
        }

        /* 嘴 */
        .bt-mouth {
            position: absolute;
            left: 50%;
            bottom: 5px;
            width: 11px;
            height: 3px;
            margin-left: -5.5px;
            border-radius: 0 0 6px 6px;
            background: #ffd97a;
            opacity: 0.85;
            transition: all 0.2s ease;
        }

        /* ---- 天线 ---- */
        .bt-antenna {
            position: absolute;
            left: 50%;
            top: 4px;
            width: 3px;
            height: 13px;
            margin-left: -1.5px;
            background: #d9b48f;
            border-radius: 2px;
            z-index: 6;
        }

        .bt-antenna::after {
            content: '';
            position: absolute;
            left: -3.5px;
            top: -8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--w-brand);
            box-shadow: 0 0 8px rgba(240, 140, 60, 0.8);
            animation: btAntenna 2.2s ease-in-out infinite;
        }

        @keyframes btAntenna {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.86); }
        }

        /* ---- 手臂：挂在身体两侧，脱离身体轮廓才看得出来 ---- */
        .bt-arm {
            position: absolute;
            top: 96px;
            width: 14px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(180deg, #8d6749 0%, #6b4a30 100%);
            transform-origin: 50% 7px;
            transition: transform 0.32s cubic-bezier(0.34, 1.4, 0.44, 1);
            z-index: 2;
        }

        /* 袖口高光，让它和同色的身体区分开 */
        .bt-arm::after {
            content: '';
            position: absolute;
            left: 2px;
            right: 2px;
            top: 2px;
            height: 9px;
            border-radius: 6px;
            background: #b08965;
            opacity: 0.85;
        }

        .bt-arm.l { left: 14px; }
        .bt-arm.r { right: 14px; }

        /* ============================================================
           动作（在 .butler-unit 上切换 is-xxx 类）
           ============================================================ */
        /* 微笑：眼睛变月牙，嘴变大笑弧 */
        .butler-unit.is-happy .bt-eye,
        .butler-unit.is-approve .bt-eye {
            height: 6px;
            border-radius: 9px 9px 0 0;
            background: #ffd97a;
        }

        .butler-unit.is-happy .bt-eye::after,
        .butler-unit.is-approve .bt-eye::after {
            opacity: 0;
        }

        .butler-unit.is-happy .bt-mouth,
        .butler-unit.is-approve .bt-mouth {
            width: 16px;
            height: 8px;
            margin-left: -8px;
            border-radius: 0 0 10px 10px;
            bottom: 3px;
        }

        /* 微笑时的蹦跳见文件后面的 btHappyJump（合并到一处，
           避免同一选择器重复声明 animation 造成的覆盖混乱） */

        /* 认可：点头两下 */
        .butler-unit.is-approve .bt-head {
            animation: btNod 0.6s ease-in-out 2;
        }

        @keyframes btNod {
            0%, 100% { transform: rotate(0) translateY(0); }
            45% { transform: rotate(0) translateY(5px); }
        }

        /* 否认：摇头 + X 眼 + 一字嘴 */
        .butler-unit.is-deny .bt-head {
            animation: btShake 0.5s ease-in-out 2;
        }

        @keyframes btShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-5px) rotate(-4deg); }
            75% { transform: translateX(5px) rotate(4deg); }
        }

        .butler-unit.is-deny .bt-eye {
            background: transparent;
            box-shadow: none;
        }

        .butler-unit.is-deny .bt-eye::after {
            /* 用一条竖线 + 旋转拼出 X 的一半 */
            left: 4px;
            top: -1px;
            width: 2px;
            height: 11px;
            border-radius: 1px;
            background: var(--w-err);
            box-shadow: none;
            transform: rotate(45deg);
            opacity: 1;
        }

        .butler-unit.is-deny .bt-eye::before {
            content: '';
            position: absolute;
            left: 4px;
            top: -1px;
            width: 2px;
            height: 11px;
            border-radius: 1px;
            background: var(--w-err);
            transform: rotate(-45deg);
        }

        .butler-unit.is-deny .bt-mouth {
            width: 14px;
            height: 2.5px;
            margin-left: -7px;
            border-radius: 2px;
        }

        /* 思考：头歪向一侧 + 眼睛看向右上 + 举手托腮 + 嘟嘴 */
        .butler-unit.is-think .bt-head {
            transform: rotate(-7deg) translateY(1px);
        }

        .butler-unit.is-think .bt-eye {
            transform: translate(2px, -2px);
            height: 7px;
        }

        .butler-unit.is-think .bt-eye.r {
            height: 5px;
        }

        .butler-unit.is-think .bt-mouth {
            width: 7px;
            height: 7px;
            margin-left: -3.5px;
            border-radius: 50%;
            bottom: 3px;
        }

        .butler-unit.is-think .bt-arm.r {
            transform: rotate(-104deg) translateY(-6px);
        }

        /* 挠头：左手上举 + 头微摇 */
        .butler-unit.is-scratch .bt-arm.l {
            transform: rotate(118deg) translateY(-8px);
        }

        .butler-unit.is-scratch .bt-head {
            animation: btShake 0.42s ease-in-out 3;
        }

        .butler-unit.is-scratch .bt-eye.r {
            height: 6px;
        }

        .butler-unit.is-scratch .bt-mouth {
            width: 7px;
            height: 7px;
            margin-left: -3.5px;
            border-radius: 50%;
        }

        /* 打招呼：右手挥动 */
        .butler-unit.is-wave .bt-arm.r {
            animation: btWave 0.5s ease-in-out 4;
        }

        @keyframes btWave {
            0%, 100% { transform: rotate(-16deg); }
            50% { transform: rotate(-52deg); }
        }

        .butler-unit.is-wave .bt-eye {
            height: 6px;
            border-radius: 9px 9px 0 0;
        }

        .butler-unit.is-wave .bt-eye::after { opacity: 0; }

        /* 倾听：头轻轻歪着，眼睛略放大 */
        .butler-unit.is-listen .bt-head {
            transform: rotate(5deg);
        }

        .butler-unit.is-listen .bt-eye {
            width: 10px;
            height: 10px;
        }

        /* ============================================================
           对话气泡
           ============================================================ */
        /* 气泡位置按 172px 基准高度推（旧值 158 是按 152 算的） */
        .bt-bubble {
            position: absolute;
            left: 50%;
            bottom: 178px;
            transform: translate(-50%, 8px) scale(0.86);
            max-width: 190px;
            min-width: 60px;
            padding: 8px 13px;
            border-radius: 14px;
            border-bottom-left-radius: 5px;
            background: #fffdf8;
            border: 1px solid var(--w-line);
            box-shadow: 0 8px 22px rgba(150, 105, 62, 0.18);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.45;
            color: #7a5232;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease, transform 0.28s cubic-bezier(0.34, 1.5, 0.44, 1);
            white-space: pre-wrap;
        }

        .bt-bubble::after {
            content: '';
            position: absolute;
            left: 16px;
            bottom: -7px;
            width: 12px;
            height: 12px;
            background: #fffdf8;
            border-right: 1px solid var(--w-line);
            border-bottom: 1px solid var(--w-line);
            transform: rotate(45deg);
            border-radius: 0 0 3px 0;
        }

        .bt-bubble.is-show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        /* 手机端缩小一号：用 --bt-scale 整体缩放。
           不要用 zoom —— 它会让内部 px 度量失真，上一版就是因此错位；
           也不要改内部尺寸，否则所有部件的 top/left 都要重算。 */
        @media (max-width: 640px) {
            .butler-stage {
                /* 手机端提到输入框上方，否则会被输入框盖住、点不到 */
                bottom: 150px;
            }
            .butler-unit {
                transform-origin: 50% 100%;
            }
            /* 缩放必须放在独立包装层上：.butler-unit 自己要用 transform
               跑呼吸/走路/被打等动画，两边同时写会互相覆盖。 */
            .butler-scale { transform: scale(0.74); }
            .bt-bubble { font-size: 11px; max-width: 150px; }
            .bt-ouch { font-size: 12px; bottom: 150px; }
        }

        /* 尊重系统的「减少动态效果」设置：
           关掉走路/呼吸这类持续动画，动作仍保留但更短。 */
        @media (prefers-reduced-motion: reduce) {
            .butler-unit,
            .butler-unit.is-walking,
            .bt-antenna::after { animation: none !important; }
            .butler-stage { transition-duration: 0.3s; }
        }

        /* ============================================================
           移动速度线
           ------------------------------------------------------------
           轮式机器人平移时如果不给动感提示，看着像「瞬移」。这里在
           机器人后方拖 3 条半透明横线，走动时淡入、停下淡出，
           方向跟着移动方向镜像（向左走时线在右边）。
           ============================================================ */
        /* 速度线默认挂在**右侧**：机器人向左移动时拖尾朝右。
           向右移动时（.walk-right）镜像到左侧并翻转发光线方向。
           —— 上一版把两侧写反了，线会跑到运动方向的前方。 */
        .bt-speed {
            position: absolute;
            top: 100px;
            left: calc(100% - 3px);
            width: 56px;
            height: 44px;
            opacity: 0;
            transition: opacity 0.18s ease;
            pointer-events: none;
        }

        .bt-speed i {
            position: absolute;
            height: 4px;
            border-radius: 4px;
            /* 贴身体一端浓、远端透明 —— 这才是「拖尾」的读法 */
            background: linear-gradient(90deg,
                rgba(240, 140, 60, 0.95) 0%,
                rgba(240, 140, 60, 0.55) 45%,
                rgba(240, 140, 60, 0) 100%);
        }

        .bt-speed i:nth-child(1) { top: 2px;  width: 30px; left: 0; }
        .bt-speed i:nth-child(2) { top: 18px; width: 48px; left: 0; }
        .bt-speed i:nth-child(3) { top: 34px; width: 22px; left: 0; }

        .butler-unit.is-walking .bt-speed {
            opacity: 1;
        }

        /* 动画挂在 i 上，不能挂 .bt-speed：
           keyframes 里写了 transform，会覆盖 .walk-right 的 scaleX(-1)，
           导致向右走时方向不翻转。 */
        .butler-unit.is-walking .bt-speed i {
            animation: btSpeedFlow 0.48s linear infinite;
        }

        .butler-unit.is-walking .bt-speed i:nth-child(2) { animation-delay: 0.16s; }
        .butler-unit.is-walking .bt-speed i:nth-child(3) { animation-delay: 0.32s; }

        /* 从贴身处向外流出去再淡掉，方向感一眼可辨 */
        @keyframes btSpeedFlow {
            0%   { transform: translateX(0);    opacity: 0; }
            22%  { opacity: 1; }
            100% { transform: translateX(18px); opacity: 0; }
        }

        /* 向右走：整组翻到左边并镜像，流动方向跟着反向 */
        .butler-unit.walk-right .bt-speed {
            left: auto;
            right: calc(100% - 3px);
            transform: scaleX(-1);
        }

        /* ============================================================
           被点击「被打」反馈 —— 刻意做夸张，带点喜剧感
           ------------------------------------------------------------
           组成：
             1) 整体震动 + 挤压拉伸（卡通 squash & stretch）
             2) 头绕圈发晕
             3) 眼睛变 X / 冒金星
             4) 头顶 3 颗星星打转
             5) 小气泡冒「哎哟！」
           ============================================================ */
        .butler-unit.is-hit {
            animation: btHitShake 0.95s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes btHitShake {
            0%   { transform: translate(0, 0) rotate(0) scale(1, 1); }
            10%  { transform: translate(-11px, -4px) rotate(-12deg) scale(1.14, 0.84); }
            22%  { transform: translate(10px, 2px) rotate(10deg) scale(0.86, 1.16); }
            36%  { transform: translate(-8px, -3px) rotate(-7deg) scale(1.08, 0.94); }
            50%  { transform: translate(6px, 1px) rotate(5deg) scale(0.95, 1.05); }
            64%  { transform: translate(-4px, -1px) rotate(-3deg); }
            80%  { transform: translate(2px, 0) rotate(1.5deg); }
            100% { transform: translate(0, 0) rotate(0) scale(1, 1); }
        }

        .butler-unit.is-hit .bt-head {
            animation: btHeadDizzy 0.95s ease-in-out;
        }

        @keyframes btHeadDizzy {
            0%   { transform: rotate(0) translateY(0); }
            18%  { transform: rotate(-20deg) translateY(5px); }
            40%  { transform: rotate(16deg) translateY(2px); }
            62%  { transform: rotate(-11deg) translateY(3px); }
            82%  { transform: rotate(7deg); }
            100% { transform: rotate(0); }
        }

        /* X 眼 */
        .butler-unit.is-hit .bt-eye {
            background: transparent;
            box-shadow: none;
        }

        .butler-unit.is-hit .bt-eye::after {
            left: 4.5px;
            top: -2px;
            width: 2.5px;
            height: 14px;
            border-radius: 2px;
            background: var(--w-err);
            box-shadow: none;
            transform: rotate(45deg);
            opacity: 1;
        }

        .butler-unit.is-hit .bt-eye::before {
            content: '';
            position: absolute;
            left: 4.5px;
            top: -2px;
            width: 2.5px;
            height: 14px;
            border-radius: 2px;
            background: var(--w-err);
            transform: rotate(-45deg);
        }

        /* 嘴变成「哎哟」的波浪 */
        .butler-unit.is-hit .bt-mouth {
            width: 16px;
            height: 11px;
            margin-left: -8px;
            bottom: 3px;
            border-radius: 50% 50% 40% 40%;
            background: #ffd97a;
        }

        /* 双手弹起 */
        .butler-unit.is-hit .bt-arm.l {
            transform: rotate(58deg) translateY(-8px);
        }

        .butler-unit.is-hit .bt-arm.r {
            transform: rotate(-58deg) translateY(-8px);
        }

        /* 天线被弹歪 */
        .butler-unit.is-hit .bt-antenna {
            animation: btAntennaBend 0.95s ease-in-out;
        }

        @keyframes btAntennaBend {
            0%   { transform: rotate(0); }
            25%  { transform: rotate(26deg); }
            55%  { transform: rotate(-18deg); }
            100% { transform: rotate(0); }
        }

        /* ---- 头顶转圈的小星星 ---- */
        .bt-stars {
            position: absolute;
            left: 50%;
            top: -6px;
            width: 96px;
            height: 40px;
            margin-left: -48px;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }

        .butler-unit.is-hit .bt-stars {
            opacity: 1;
            animation: btStarsOrbit 0.95s linear;
        }

        @keyframes btStarsOrbit {
            from { transform: rotate(0); }
            to   { transform: rotate(360deg); }
        }

        .bt-stars span {
            position: absolute;
            font-size: 15px;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(150, 105, 62, 0.45));
        }

        .bt-stars span:nth-child(1) { left: 0;    top: 18px; }
        .bt-stars span:nth-child(2) { left: 40px; top: 0; }
        .bt-stars span:nth-child(3) { right: 0;   top: 20px; }

        /* ---- 挨打的吐槽气泡（单独一层，避免和对话气泡抢位置） ---- */
        .bt-ouch {
            position: absolute;
            left: 50%;
            bottom: 186px;
            transform: translate(-50%, 10px) scale(0.6);
            padding: 7px 13px;
            border-radius: 14px;
            border: 2px solid #f5b942;
            background: #fffdf0;
            color: #b0700a;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(150, 105, 62, 0.22);
            opacity: 0;
            pointer-events: none;
            z-index: 9;
            transition: opacity 0.16s ease, transform 0.22s cubic-bezier(0.34, 1.7, 0.44, 1);
        }

        .bt-ouch.is-show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        /* 开心时整只机器人上下蹦 */
        .butler-unit.is-happy {
            animation: btHappyJump 0.62s cubic-bezier(0.34, 1.5, 0.44, 1);
        }

        @keyframes btHappyJump {
            0%   { transform: translateY(0) scale(1, 1); }
            35%  { transform: translateY(-18px) scale(0.94, 1.08); }
            62%  { transform: translateY(0) scale(1.08, 0.92); }
            82%  { transform: translateY(-6px) scale(0.98, 1.02); }
            100% { transform: translateY(0) scale(1, 1); }
        }

        /* ============================================================
           遥控面板：内部尺寸整体减半
           ------------------------------------------------------------
           改造前在 390px 宽的手机上量的实际尺寸：
             面板宽 365px、高 486px（占屏幕 58%），
             摇杆底座 220px、摇杆头 80px
           底座比屏幕窄边的一半还宽，把地图挤得只剩一条缝。

           这里把面板及其内部几何按 1/2 缩放。

           ★ 为什么全部加 .widget[data-widget="joystick"] 前缀
             .widget-head / .widget-title / .widget-badge /
             .widget-close / .widget-body 是三个浮层共用的类，
             不限定就会把摄像头和地图面板一起缩小。

           ★ 为什么放在样式表最后
             靠源码顺序压过上面那些通用规则和 @media(max-width:900px)
             里的 ".widget[data-widget=joystick]{width:100vw-20px}"，
             这样不用回头改上千行旧 CSS，日后想调也只改这一块。

           ★ 字号没有严格减半
             13.5px 的一半是 6.75px，根本看不清。所以：
             几何尺寸（摇杆、间距、内边距）严格 1/2，
             字号按 ~80% 收并保留可读下限（正文不老于 11px）。
           ============================================================ */

        /* ---- 面板容器 ---- */
        .widget[data-widget="joystick"] {
            width: 200px;
        }

        /* 手机竖屏：不再撑满宽度，留给地图看 ---- */
        @media (max-width: 900px) {
            .widget[data-widget="joystick"] {
                width: min(200px, calc(100vw - 20px));
            }
        }

        /* ---- 标题栏 ---- */
        .widget[data-widget="joystick"] .widget-head {
            gap: 5px;
            padding: 6px 7px 6px 8px;
        }

        .widget[data-widget="joystick"] .widget-title {
            gap: 4px;
            font-size: 11px;
        }

        .widget[data-widget="joystick"] .widget-badge {
            font-size: 9px;
            padding: 1px 5px;
        }

        .widget[data-widget="joystick"] .widget-close {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            font-size: 12px;
        }

        /* ---- 内容区 ---- */
        .widget[data-widget="joystick"] .widget-body {
            padding: 8px;
        }

        /* ---- 摇杆：220 → 110 ---- */
        .widget[data-widget="joystick"] .joystick-base {
            width: 110px;
            height: 110px;
            /* 投影跟着缩，否则小圆盘拖着一团大阴影显得脏 */
            box-shadow:
                0 5px 10px rgba(160, 112, 60, 0.20),
                inset 0 1px 2px rgba(255, 255, 255, 0.92),
                inset 0 -2px 5px rgba(214, 168, 116, 0.28);
        }

        /* ---- 摇杆头：80 → 40 ---- */
        .widget[data-widget="joystick"] .joystick-thumb {
            width: 40px;
            height: 40px;
            font-size: 14px;
            box-shadow:
                0 2px 6px rgba(160, 112, 60, 0.28),
                inset 0 -1px 3px rgba(210, 158, 100, 0.35);
        }

        /* ---- 方向提示 ---- */
        .widget[data-widget="joystick"] .direction-indicator {
            margin-top: 6px;
            padding: 3px 8px;
            font-size: 11px;
        }

        /* ---- 速度滑块 ---- */
        .widget[data-widget="joystick"] .speed-item {
            margin-bottom: 10px;
        }

        .widget[data-widget="joystick"] .speed-item label {
            margin-bottom: 4px;
            font-size: 11px;
        }

        /* 轨道比原来略高（5 → 4 太细手指不好描）
           滑块的拖动性比视觉等比重要，这里只缩到 4px */
        .widget[data-widget="joystick"] input[type="range"] {
            height: 4px;
            border-radius: 4px;
        }

        .widget[data-widget="joystick"] input[type="range"]::-webkit-slider-thumb {
            width: 12px;
            height: 12px;
        }

        .widget[data-widget="joystick"] input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
        }
    </style>
    <!-- ==================== Socket.IO 客户端 ====================
         原来直连 cdn.socket.io。问题：手机开热点时如果蜂窝信号差/被墙，
         这个 44KB 的公网请求一旦失败，整个控制台直接白屏 ——
         而机器人本身就在局域网里，根本不需要联网。

         改为「本地优先 + CDN 兜底」：
           1. 先从本机 Flask 取 static/vendor/socket.io.min.js（局域网，快且稳）
           2. 只有在本地文件缺失时才回退到公网 CDN
         两份都是 4.5.4，与原有版本一致，不影响与服务端
         flask-socketio 的协议兼容性。 -->
    <script src="/static/vendor/socket.io.min.js"></script>
    <script>
        if (!window.io) {
            document.write(
                '<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"><\/script>'
            );
        }
    </script>
    <!-- PWA 增强层：SW 注册 / 屏幕常亮 / 独立模式侦测。
         全部静默降级，加载失败也不影响主逻辑（defer 保证在 DOM 后执行）。 -->
    <script defer src="/static/pwa.js"></script>
</head>

<script>
    // ==================== 全局变量 ====================
    let isConnected = false;
    let cameraActive = false;
    const cameraUrl = "http://<CAMERA_IP>:81/stream";
    let mapImage = null;
    let mapResolution = 0.05;
    let mapOriginX = 0, mapOriginY = 0;
    let mapWidth = 0, mapHeight = 0;
    let robotX = 0, robotY = 0, robotTheta = 0;
    let scale = 1.0, offsetX = 0, offsetY = 0;
    let isDragging = false, dragStartX = 0, dragStartY = 0;
    let currentMoveInterval = null;
    
    // 摇杆相关
    let joystickActive = false;
    let joystickBaseRect = null;
    let joystickMaxRadius = 0;
    let currentAngle = 0;
    let currentDistance = 0;
    
    // 防抖标志，防止重复发送消息
    let sendingMessage = false;
    
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const socket = io();
    
    const joystickBase = document.getElementById('joystickBase');
    const joystickThumb = document.getElementById('joystickThumb');
    const directionText = document.getElementById('directionText');
    const linearSpeedSlider = document.getElementById('linear-speed');
    const linearValue = document.getElementById('linear-value');
    const angularSpeedSlider = document.getElementById('angular-speed');
    const angularValue = document.getElementById('angular-value');
    
    let maxLinearSpeed = 0.30;
    
    // ==================== 辅助函数 ====================
    function addLog(msg, type = 'info') {
        const logDiv = document.getElementById('log-container');
        const time = new Date().toLocaleTimeString();
        const colors = { info: '#1a73e8', error: '#ea4335', warning: '#f9ab00', success: '#34a853' };
        const icons = { info: '📡', error: '❌', warning: '⚠️', success: '✅' };
        const logEntry = document.createElement('div');
        logEntry.style.fontSize = '11px';
        logEntry.style.padding = '2px 0';
        logEntry.style.color = '#555';
        logEntry.innerHTML = `<span style="color:#aaa;">[${time}]</span> <span style="color:${colors[type]}">${icons[type]}</span> ${msg}`;
        logDiv.appendChild(logEntry);
        logDiv.scrollTop = logDiv.scrollHeight;
        while (logDiv.children.length > 10) logDiv.removeChild(logDiv.firstChild);
    }
    
    async function sendManualCommand(cmd, linear = null, angular = null) {
        if (!isConnected) return;
        try {
            let data = { cmd: cmd };
            if (cmd === 'custom' && linear !== null) data = { cmd: 'custom', linear, angular };
            const res = await fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
        } catch(e) { console.error(e); }
    }
    
    function stopRobot() {
        if (currentMoveInterval) {
            clearInterval(currentMoveInterval);
            currentMoveInterval = null;
        }
        sendManualCommand('stop');
    }
    
    function updateJoystick(clientX, clientY) {
        if (!joystickActive || !joystickBaseRect) return;
        let dx = clientX - joystickBaseRect.centerX;
        let dy = clientY - joystickBaseRect.centerY;
        let distance = Math.min(Math.sqrt(dx*dx + dy*dy), joystickMaxRadius);
        let angle = Math.atan2(dy, dx);
        currentAngle = angle;
        currentDistance = distance / joystickMaxRadius;
        
        let thumbX = Math.cos(angle) * distance;
        let thumbY = Math.sin(angle) * distance;
        joystickThumb.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
        
        let dirText = '';
        if (currentDistance < 0.05) {
            dirText = '⚪ 摇杆回中';
        } else {
            let directionAngle = angle * 180 / Math.PI;
            if (directionAngle >= -135 && directionAngle < -45) dirText = '⬆️ 前进';
            else if (directionAngle >= -45 && directionAngle < 45) dirText = '➡️ 右转';
            else if (directionAngle >= 45 && directionAngle < 135) dirText = '⬇️ 后退';
            else dirText = '⬅️ 左转';
            if (currentDistance > 0.7) dirText += ' (快速)';
            else if (currentDistance > 0.3) dirText += ' (中速)';
            else dirText += ' (慢速)';
        }
        directionText.textContent = dirText;
        
        if (currentDistance > 0.05) {
            let forwardAmount = Math.cos(angle + Math.PI/2);
            let rightAmount = Math.sin(angle + Math.PI/2);
            let linear = forwardAmount * currentDistance * maxLinearSpeed;
            let angular = -rightAmount * currentDistance * parseFloat(angularSpeedSlider.value);
            linear = Math.min(Math.max(linear, -maxLinearSpeed), maxLinearSpeed);
            angular = Math.min(Math.max(angular, -1.5), 1.5);
            if (currentMoveInterval) clearInterval(currentMoveInterval);
            sendManualCommand('custom', linear, angular);
            currentMoveInterval = setInterval(() => {
                if (isConnected && joystickActive && currentDistance > 0.05) {
                    sendManualCommand('custom', linear, angular);
                }
            }, 50);
        } else {
            stopRobot();
        }
    }
    
    function resetJoystick() {
        joystickActive = false;
        joystickThumb.style.transform = 'translate(-50%, -50%)';
        directionText.textContent = '⚪ 摇杆回中';
        currentDistance = 0;
        stopRobot();
    }
    
    function updateJoystickGeometry() {
        const rect = joystickBase.getBoundingClientRect();
        joystickBaseRect = {
            centerX: rect.left + rect.width / 2,
            centerY: rect.top + rect.height / 2,
            radius: rect.width / 2
        };
        /* ★ 活动半径 = 底座半径 - 摇杆头半径。
           原来写死成 `radius - 10`，那是在底座 220px / 摇杆头 80px
           的前提下凑出来的：110 - 10 = 100，而摇杆头半径是 40，
           所以满舵时头的边缘能跑到离圆心 140px 处，早就滑出底座了
           （只是平时摇杆回中，没人注意到）。
           底座缩到 110px 后这个偏差会一眼看出来，所以改成按实际
           尺寸算，顺带把历史遗留的越界也修掉。
           现在无论 CSS 怎么改尺寸，摇杆头都会正好贴着底座边缘。 */
        const thumbRect = joystickThumb.getBoundingClientRect();
        joystickMaxRadius = joystickBaseRect.radius - thumbRect.width / 2;
    }
    
    function initJoystick() {
        updateJoystickGeometry();
        window.addEventListener('resize', updateJoystickGeometry);
        
        const onPointerStart = (e) => {
            // 只处理摇杆区域内的触摸
            if (!joystickBase.contains(e.target)) return;
            e.preventDefault();
            joystickActive = true;
            updateJoystickGeometry();
            const point = e.touches ? e.touches[0] : e;
            updateJoystick(point.clientX, point.clientY);
        };
        
        const onPointerMove = (e) => {
            if (!joystickActive) return;
            e.preventDefault();
            const point = e.touches ? e.touches[0] : e;
            updateJoystick(point.clientX, point.clientY);
        };
        
        const onPointerEnd = (e) => {
            if (!joystickActive) return;
            e.preventDefault();
            resetJoystick();
        };
        
        joystickBase.addEventListener('mousedown', onPointerStart);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerEnd);
        joystickBase.addEventListener('touchstart', onPointerStart, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerEnd);
        window.addEventListener('touchcancel', onPointerEnd);
    }
    
    // ==================== 地图功能 ====================
    function worldToPixel(worldX, worldY) {
        let px = (worldX - mapOriginX) / mapResolution;
        let py = (worldY - mapOriginY) / mapResolution;
        return { x: px, y: py };
    }
    
    function drawMap() {
        if (!mapImage) {
            ctx.fillStyle = '#0a0e1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#aaa';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('等待地图数据...', canvas.width/2, canvas.height/2);
            return;
        }
        ctx.fillStyle = '#0a0e1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);
        ctx.drawImage(mapImage, 0, 0, mapWidth, mapHeight);
        if (robotX !== 0 || robotY !== 0) {
            let pixel = worldToPixel(robotX, robotY);
            let robotRadius = Math.max(5, 8 / scale);
            ctx.beginPath();
            ctx.arc(pixel.x, pixel.y, robotRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#00ffff';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2 / scale;
            ctx.stroke();
            let endX = robotX + 0.3 * Math.cos(robotTheta);
            let endY = robotY + 0.3 * Math.sin(robotTheta);
            let endPixel = worldToPixel(endX, endY);
            ctx.beginPath();
            ctx.moveTo(pixel.x, pixel.y);
            ctx.lineTo(endPixel.x, endPixel.y);
            ctx.stroke();
        }
        ctx.restore();
    }
    
    function resetView() {
        if (!mapImage) return;
        // 地图组件可能处于收起状态（display:none），此时父容器尺寸是 0。
        // 直接套用会把 canvas 压成 0x0，之后再打开也画不出来 ——
        // 所以这里必须提前退出，留到 afterWidgetOpen 里再算。
        let w = canvas.parentElement.clientWidth;
        let h = canvas.parentElement.clientHeight;
        if (!w || !h) return;
        canvas.width = w;
        canvas.height = h;
        let sx = w / mapWidth, sy = h / mapHeight;
        scale = Math.min(sx, sy, 2.0);
        scale = Math.max(scale, 0.1);
        offsetX = (w - mapWidth * scale) / 2;
        offsetY = (h - mapHeight * scale) / 2;
        drawMap();
    }
    
    // ==================== API 调用 ====================
    // ============================================================
    // 视图切换（主页 ↔ 操作页）
    // ============================================================
    function switchView(which) {
        const home = document.getElementById('viewHome');
        const app = document.getElementById('viewApp');
        if (!home || !app) return;
        if (which === 'app') {
            home.classList.add('is-gone');
            app.classList.remove('is-gone');
            // 切页后 canvas / 摇杆才量得到真实尺寸（之前父级是 opacity/scale
            // 变化，但仍在布局里，所以这里再算一次确保准确）
            requestAnimationFrame(function () {
                if (mapImage) resetView();
                updateJoystickGeometry();
            });
        } else {
            app.classList.add('is-gone');
            home.classList.remove('is-gone');
        }
    }

    function enterApp() {
        switchView('app');
        addLog('已进入工作台', 'success');
        // 管家登场并开始自主巡游
        Butler.start();
        setTimeout(function () {
            if (!widgetIsOpen('joystick') && !widgetIsOpen('map')
                    && !widgetIsOpen('camera')) {
                toast('点左手柄或右箭头，唤出需要的面板', 'ok');
            }
        }, 700);
    }

    async function connectRobot() {
        const btn = document.getElementById('btnStart');
        const status = document.getElementById('homeStatus');
        if (!btn || btn.disabled) return;

        btn.disabled = true;
        btn.textContent = '正在唤醒小车';

        // 连接实测要 15~25 秒（雷达驱动 + micro-ROS agent + EKF 全部就绪）。
        // 只转圈不给文案会让人以为卡死，所以按时间推进换提示。
        const tips = [
            [0, '正在唤醒小车'],
            [4, '启动雷达与底盘'],
            [10, '等待 /odom 与 /scan 就绪'],
            [17, '校对传感器'],
            [24, '马上就好'],
        ];
        const t0 = Date.now();
        function paintTip() {
            const el = (Date.now() - t0) / 1000;
            let msg = tips[0][1];
            for (let i = 0; i < tips.length; i++) {
                if (el >= tips[i][0]) msg = tips[i][1];
            }
            status.innerHTML = '<span class="dots">' + msg + '</span>';
        }
        paintTip();
        const timer = setInterval(paintTip, 700);

        try {
            const res = await fetch('/connect_robot', { method: 'POST' });
            const result = await res.json();
            if (result.status === 'success' && result.connected) {
                const dot = document.getElementById('conn-status-dot');
                const txt = document.getElementById('conn-status-text');
                if (dot) dot.classList.add('connected');
                if (txt) txt.textContent = '已连接';
                isConnected = true;
                clearInterval(timer);
                status.textContent = '连接成功，正在进入工作台…';
                btn.textContent = '已连接';
                addLog('机器人连接成功', 'success');
                syncPhraseActive();
                // 停一下让人看到「成功」，再切页，避免瞬间跳转
                setTimeout(enterApp, 850);
                return;
            }
            clearInterval(timer);
            const msg = result.message || '未知错误';
            status.textContent = '连接失败：' + msg;
            addLog('连接失败: ' + msg, 'error');
            toast('连接失败：' + msg, 'err');
            btn.disabled = false;
            btn.textContent = '连接以开始';
        } catch (err) {
            clearInterval(timer);
            status.textContent = '网络错误，请检查手机与服务端连通性';
            addLog('连接网络错误: ' + err.message, 'error');
            toast('网络错误', 'err');
            btn.disabled = false;
            btn.textContent = '连接以开始';
        }
    }
    
    async function forceCleanup() {
        if (!confirm('强制清理将终止所有进程，确认？')) return;
        const btn = document.getElementById('force-cleanup');
        btn.disabled = true;
        btn.textContent = '⏳ 清理中...';
        await fetch('/force_cleanup', { method: 'POST' });
        location.reload();
    }
    
    async function softReboot() {
        if (!confirm('确认要软重启机器人（ESP32）？')) return;
        const btn = document.getElementById('soft-reboot');
        btn.disabled = true;
        btn.textContent = '⏳ 重启中...';
        addLog('正在发送软重启指令...', 'warning');
        try {
            const res = await fetch('/soft_reboot', { method: 'POST' });
            const result = await res.json();
            if (result.status === 'success') {
                addLog('软重启命令已发送成功', 'success');
            } else {
                addLog('软重启失败: ' + (result.message || '未知错误'), 'error');
                alert('软重启失败: ' + (result.message || '未知错误'));
            }
        } catch(err) {
            addLog('软重启网络错误: ' + err.message, 'error');
            alert('软重启网络错误，请检查连接');
        } finally {
            btn.disabled = false;
            btn.textContent = '软重启';
        }
    }
    
    async function loadMap() {
        addLog('正在载入地图 room1...', 'info');
        document.getElementById('map-state-text').textContent = '加载中';
        const badge = document.getElementById('map-badge');
