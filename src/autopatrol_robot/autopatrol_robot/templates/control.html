            dirText = '⚪ 摇杆回中';
        } else {
            let directionAngle = angle * 180 / Math.PI;
            if (directionAngle >= -135 && directionAngle < -45) dirText = '⬆️ 前进';
            else if (directionAngle >= -45 && directionAngle < 45) dirText = '➡️ 右转';
            else if (directionAngle >= 45 && directionAngle < 135) dirText = '⬇️ 后退';
            else dirText = '⬅️ 左转';
            if (currentDistance > 0.7) dirText += ' (快速)';
            else if (currentDistance > 0.3) dirText += ' (中速)';
            else dirText += ' (慢速)';
        }
        directionText.textContent = dirText;
        
        if (currentDistance > 0.05) {
            let forwardAmount = Math.cos(angle + Math.PI/2);
            let rightAmount = Math.sin(angle + Math.PI/2);
            let linear = forwardAmount * currentDistance * maxLinearSpeed;
            let angular = -rightAmount * currentDistance * parseFloat(angularSpeedSlider.value);
            linear = Math.min(Math.max(linear, -maxLinearSpeed), maxLinearSpeed);
            angular = Math.min(Math.max(angular, -1.5), 1.5);
            if (currentMoveInterval) clearInterval(currentMoveInterval);
            sendManualCommand('custom', linear, angular);
            currentMoveInterval = setInterval(() => {
                if (isConnected && joystickActive && currentDistance > 0.05) {
                    sendManualCommand('custom', linear, angular);
                }
            }, 50);
        } else {
            stopRobot();
        }
    }
    
    function resetJoystick() {
        joystickActive = false;
        joystickThumb.style.transform = 'translate(-50%, -50%)';
        directionText.textContent = '⚪ 摇杆回中';
        currentDistance = 0;
        stopRobot();
    }
    
    function updateJoystickGeometry() {
        const rect = joystickBase.getBoundingClientRect();
        joystickBaseRect = {
            centerX: rect.left + rect.width / 2,
            centerY: rect.top + rect.height / 2,
            radius: rect.width / 2
        };
        /* ★ 活动半径 = 底座半径 - 摇杆头半径。
           原来写死成 `radius - 10`，那是在底座 220px / 摇杆头 80px
           的前提下凑出来的：110 - 10 = 100，而摇杆头半径是 40，
           所以满舵时头的边缘能跑到离圆心 140px 处，早就滑出底座了
           （只是平时摇杆回中，没人注意到）。
           底座缩到 110px 后这个偏差会一眼看出来，所以改成按实际
           尺寸算，顺带把历史遗留的越界也修掉。
           现在无论 CSS 怎么改尺寸，摇杆头都会正好贴着底座边缘。 */
        const thumbRect = joystickThumb.getBoundingClientRect();
        joystickMaxRadius = joystickBaseRect.radius - thumbRect.width / 2;
    }
    
    function initJoystick() {
        updateJoystickGeometry();
        window.addEventListener('resize', updateJoystickGeometry);
        
        const onPointerStart = (e) => {
            // 只处理摇杆区域内的触摸
            if (!joystickBase.contains(e.target)) return;
            e.preventDefault();
            joystickActive = true;
            updateJoystickGeometry();
            const point = e.touches ? e.touches[0] : e;
            updateJoystick(point.clientX, point.clientY);
        };
        
        const onPointerMove = (e) => {
            if (!joystickActive) return;
            e.preventDefault();
            const point = e.touches ? e.touches[0] : e;
            updateJoystick(point.clientX, point.clientY);
        };
        
        const onPointerEnd = (e) => {
            if (!joystickActive) return;
            e.preventDefault();
            resetJoystick();
        };
        
        joystickBase.addEventListener('mousedown', onPointerStart);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerEnd);
        joystickBase.addEventListener('touchstart', onPointerStart, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerEnd);
        window.addEventListener('touchcancel', onPointerEnd);
    }
    
    // ==================== 地图功能 ====================
    function worldToPixel(worldX, worldY) {
        let px = (worldX - mapOriginX) / mapResolution;
        let py = (worldY - mapOriginY) / mapResolution;
        return { x: px, y: py };
    }
    
    function drawMap() {
        if (!mapImage) {
            ctx.fillStyle = '#0a0e1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#aaa';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('等待地图数据...', canvas.width/2, canvas.height/2);
            return;
        }
        ctx.fillStyle = '#0a0e1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);
        ctx.drawImage(mapImage, 0, 0, mapWidth, mapHeight);
        if (robotX !== 0 || robotY !== 0) {
            let pixel = worldToPixel(robotX, robotY);
            let robotRadius = Math.max(5, 8 / scale);
            ctx.beginPath();
            ctx.arc(pixel.x, pixel.y, robotRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#00ffff';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2 / scale;
            ctx.stroke();
            let endX = robotX + 0.3 * Math.cos(robotTheta);
            let endY = robotY + 0.3 * Math.sin(robotTheta);
            let endPixel = worldToPixel(endX, endY);
            ctx.beginPath();
            ctx.moveTo(pixel.x, pixel.y);
            ctx.lineTo(endPixel.x, endPixel.y);
            ctx.stroke();
        }
        ctx.restore();
    }
    
    function resetView() {
        if (!mapImage) return;
        // 地图组件可能处于收起状态（display:none），此时父容器尺寸是 0。
        // 直接套用会把 canvas 压成 0x0，之后再打开也画不出来 ——
        // 所以这里必须提前退出，留到 afterWidgetOpen 里再算。
        let w = canvas.parentElement.clientWidth;
        let h = canvas.parentElement.clientHeight;
        if (!w || !h) return;
        canvas.width = w;
        canvas.height = h;
        let sx = w / mapWidth, sy = h / mapHeight;
        scale = Math.min(sx, sy, 2.0);
        scale = Math.max(scale, 0.1);
        offsetX = (w - mapWidth * scale) / 2;
        offsetY = (h - mapHeight * scale) / 2;
        drawMap();
    }
    
    // ==================== API 调用 ====================
    // ============================================================
    // 视图切换（主页 ↔ 操作页）
    // ============================================================
    function switchView(which) {
        const home = document.getElementById('viewHome');
        const app = document.getElementById('viewApp');
        if (!home || !app) return;
        // 背景虚化：连接页虚化，进工作台后取消（详见 .room-scene.is-blur）
        const scene = document.getElementById('roomScene');
        if (scene) scene.classList.toggle('is-blur', which !== 'app');
        if (which === 'app') {
            home.classList.add('is-gone');
            app.classList.remove('is-gone');
            // 切页后 canvas / 摇杆才量得到真实尺寸（之前父级是 opacity/scale
            // 变化，但仍在布局里，所以这里再算一次确保准确）
            requestAnimationFrame(function () {
                if (mapImage) resetView();
                updateJoystickGeometry();
            });
        } else {
            app.classList.add('is-gone');
            home.classList.remove('is-gone');
        }
    }

    function enterApp() {
        switchView('app');
        addLog('已进入工作台', 'success');
        // 管家登场并开始自主巡游
        Butler.start();
        setTimeout(function () {
            if (!widgetIsOpen('joystick') && !widgetIsOpen('map')
                    && !widgetIsOpen('camera')) {
                toast('点左手柄或右箭头，唤出需要的面板', 'ok');
            }
        }, 700);
    }

    async function connectRobot() {
        const btn = document.getElementById('btnStart');
        const status = document.getElementById('homeStatus');
        if (!btn || btn.disabled) return;

        btn.disabled = true;
        btn.textContent = '正在唤醒小车';

        // 连接实测要 15~25 秒（雷达驱动 + micro-ROS agent + EKF 全部就绪）。
        // 只转圈不给文案会让人以为卡死，所以按时间推进换提示。
        const tips = [
            [0, '正在唤醒小车'],
            [4, '启动雷达与底盘'],
            [10, '等待 /odom 与 /scan 就绪'],
            [17, '校对传感器'],
            [24, '马上就好'],
        ];
        const t0 = Date.now();
        function paintTip() {
            const el = (Date.now() - t0) / 1000;
            let msg = tips[0][1];
            for (let i = 0; i < tips.length; i++) {
                if (el >= tips[i][0]) msg = tips[i][1];
            }
            status.innerHTML = '<span class="dots">' + msg + '</span>';
        }
        paintTip();
        const timer = setInterval(paintTip, 700);

        try {
            const res = await fetch('/connect_robot', { method: 'POST' });
            const result = await res.json();
            if (result.status === 'success' && result.connected) {
                const dot = document.getElementById('conn-status-dot');
                const txt = document.getElementById('conn-status-text');
                if (dot) dot.classList.add('connected');
                if (txt) txt.textContent = '已连接';
                isConnected = true;
                clearInterval(timer);
                status.textContent = '连接成功，正在进入工作台…';
                btn.textContent = '已连接';
                addLog('机器人连接成功', 'success');
                syncPhraseActive();
                // 停一下让人看到「成功」，再切页，避免瞬间跳转
                setTimeout(enterApp, 850);
                return;
            }
            clearInterval(timer);
            const msg = result.message || '未知错误';
            status.textContent = '连接失败：' + msg;
            addLog('连接失败: ' + msg, 'error');
            toast('连接失败：' + msg, 'err');
            btn.disabled = false;
            btn.textContent = '连接以开始';
        } catch (err) {
            clearInterval(timer);
            status.textContent = '网络错误，请检查手机与服务端连通性';
            addLog('连接网络错误: ' + err.message, 'error');
            toast('网络错误', 'err');
            btn.disabled = false;
            btn.textContent = '连接以开始';
        }
    }
    
    async function forceCleanup() {
        if (!confirm('强制清理将终止所有进程，确认？')) return;
        const btn = document.getElementById('force-cleanup');
        btn.disabled = true;
        btn.textContent = '⏳ 清理中...';
        await fetch('/force_cleanup', { method: 'POST' });
        location.reload();
    }
    
    async function softReboot() {
        if (!confirm('确认要软重启机器人（ESP32）？')) return;
        const btn = document.getElementById('soft-reboot');
        btn.disabled = true;
        btn.textContent = '⏳ 重启中...';
        addLog('正在发送软重启指令...', 'warning');
        try {
            const res = await fetch('/soft_reboot', { method: 'POST' });
            const result = await res.json();
            if (result.status === 'success') {
                addLog('软重启命令已发送成功', 'success');
            } else {
                addLog('软重启失败: ' + (result.message || '未知错误'), 'error');
                alert('软重启失败: ' + (result.message || '未知错误'));
            }
        } catch(err) {
            addLog('软重启网络错误: ' + err.message, 'error');
            alert('软重启网络错误，请检查连接');
        } finally {
            btn.disabled = false;
            btn.textContent = '软重启';
        }
    }
    
    async function loadMap() {
        addLog('正在载入地图 room1...', 'info');
        document.getElementById('map-state-text').textContent = '加载中';
        const badge = document.getElementById('map-badge');
        if (badge && !badge.classList.contains('live')) badge.textContent = '加载中';
        try {
            const res = await fetch('/load_map', { method: 'POST' });
            const result = await res.json();
            if (result.status === 'success') {
                addLog('地图加载请求已发送: ' + (result.message || 'room1'), 'success');
                // 真实状态由后端轮询 /map 后通过 socket 回推；
                // 这里只做超时提醒，不再假定成功。
                setTimeout(() => {
                    if (document.getElementById('map-state-text').textContent === '加载中') {
                        addLog('地图仍在加载，请查看下方日志排查', 'warning');
                        document.getElementById('close-map').disabled = false;
                    }
                }, 65000);
            } else {
                addLog('地图加载失败: ' + result.message, 'error');
                document.getElementById('map-state-text').textContent = '加载失败';
            }
        } catch (err) {
            addLog('地图加载请求异常: ' + err.message, 'error');
            document.getElementById('map-state-text').textContent = '加载失败';
        }
    }
    
    async function closeMap() {
        addLog('正在关闭地图...', 'info');
        try {
            const res = await fetch('/close_map', { method: 'POST' });
            const result = await res.json();
            if (result.status === 'success') {
                addLog('地图已关闭', 'success');
                document.getElementById('map-state-text').textContent = '未加载';
                document.getElementById('close-map').disabled = true;
                const b2 = document.getElementById('map-badge');
                if (b2 && !b2.classList.contains('live')) b2.textContent = '未加载';
                mapImage = null;
                drawMap();
            } else {
                addLog('关闭地图失败: ' + result.message, 'error');
                alert('关闭地图失败: ' + result.message);
            }
        } catch(error) {
            addLog('关闭地图网络错误: ' + error.message, 'error');
            alert('关闭地图失败，请检查网络');
        }
    }
    
    function startCamera() {
        const img = document.getElementById('cameraStream');
        const placeholder = document.getElementById('cameraPlaceholder');
        img.src = cameraUrl + '?_=' + Date.now();
        img.style.display = 'block';
        placeholder.style.display = 'none';
        document.getElementById('toggleCameraBtn').textContent = '停止摄像头';
        const badge = document.getElementById('camera-badge');
        if (badge) { badge.textContent = '直播中'; badge.className = 'widget-badge live'; }
        cameraActive = true;
    }
    function stopCamera() {
        const img = document.getElementById('cameraStream');
        const placeholder = document.getElementById('cameraPlaceholder');
        img.src = '';
        img.style.display = 'none';
        placeholder.style.display = 'flex';
        document.getElementById('toggleCameraBtn').textContent = '启动摄像头';
        const badge = document.getElementById('camera-badge');
        if (badge) { badge.textContent = '未启动'; badge.className = 'widget-badge'; }
        cameraActive = false;
    }
    
    // AI 聊天（防重复）
    function sendChatMessage() {
        if (sendingMessage) return;
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        sendingMessage = true;
        addChatMessage('user', message);
        input.value = '';
        addChatMessage('bot', '🤔 思考中...', true);
        // 管家：先认可（点头），再思考（歪头托腮）——就是用户说的
        // 「先认可、后思考」的反馈节奏
        Butler.onUserSpeak();
        fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        })
        .then(res => res.json())
        .then(data => {
            removeLastTempMessage();
            if (data.status === 'success') {
                addChatMessage('bot', data.reply);
                Butler.onBotReply(data.reply);
            } else {
                addChatMessage('bot', '❌ 错误: ' + data.message);
                Butler.onBotError();
            }
            sendingMessage = false;
        })
        .catch(err => {
            removeLastTempMessage();
            addChatMessage('bot', '❌ 网络错误');
            Butler.onBotError();
            sendingMessage = false;
        });
    }
    
    function addChatMessage(role, content, isTemp = false) {
        const container = document.getElementById('chat-messages');
        const time = new Date().toLocaleTimeString();
        const row = document.createElement('div');
        row.className = 'msg-row ' + (role === 'user' ? 'user' : 'bot');
        row.innerHTML =
            '<div>' +
                '<div class="msg-bubble"></div>' +
                '<div class="msg-meta">' +
                    (role === 'user' ? '👤 我' : '🤖 助手') + ' · ' + time +
                '</div>' +
            '</div>';
        // 用 textContent 而不是 innerHTML：AI 回复里可能带 < > &，
        // 直接插值会被当成标签吞掉甚至注入脚本。
        row.querySelector('.msg-bubble').textContent = content;
        if (isTemp) row.setAttribute('data-temp', 'true');
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
        return row;
    }
    function removeLastTempMessage() {
        const temp = document.querySelector('#chat-messages [data-temp="true"]');
        if (temp) temp.remove();
    }

    // 对话区初始为空：入口页已经有品牌与引导，这里不再重复一个问候卡片
    function clearChatMessages() {
        document.getElementById('chat-messages').innerHTML = '';
    }

    // ==================== 定位状态条（2026-11-01） ====================
    // 数据来自 auto_localizer 的 /localization_status。
    //
    // 为什么要这条 UI：
    //   以前用户只能靠"地图上的车头图标看起来不动了"来判断定位好不好，
    //   而这个判断经常是错的（σ 小不等于位置对，σ 略大也不等于位置错）。
    //   现在把真实依据摊开：激光-地图匹配率（物理证据）、σ（参考项）、
    //   位姿是否稳定，并直接告诉用户"该怎么帮着收敛"。
    let locStatusTimer = null;

    function renderLocStatus(s) {
        const bar    = document.getElementById('locBar');
        const dot    = document.getElementById('locDot');
        const title  = document.getElementById('locTitle');
        const meta   = document.getElementById('locMeta');
        const fill   = document.getElementById('locFill');
        const reason = document.getElementById('locReason');
        if (!bar) return;

        // ★ 2026-11-01：没数据时不再隐藏，而是显示「定位未启动」。
        //   原来的 is-hidden 让用户在还没载入地图时完全看不到这根条子，
        //   以为功能丢了 —— 实际上是「还没开始」，应该明确说出来。
        bar.classList.remove('is-hidden');

        if (!s || !s.state) {
            bar.classList.remove('is-ready', 'is-bad', 'is-min', 'is-open');
            dot.classList.remove('is-ready', 'is-bad', 'is-busy');
            title.textContent = '定位未启动';
            meta.textContent = '';
            fill.style.width = '0%';
            reason.textContent = '先在下方点「载入地图」，系统会自动开始定位';
            reason.classList.add('is-on');
            return;
        }

        const ready = !!s.ready;
        const bad   = !!s.veto;
        const pct   = Math.round((s.progress || 0) * 100);

        bar.classList.remove('is-ready', 'is-bad');
        dot.classList.remove('is-ready', 'is-bad', 'is-busy');
        // 就绪 → 收缩成一个点；未就绪 → 展开显示进度和原因
        bar.classList.toggle('is-min', ready);
        if (ready) {
            bar.classList.add('is-ready');
            dot.classList.add('is-ready');
            title.textContent = '定位已就绪';
        } else if (bad) {
            bar.classList.add('is-bad');
            dot.classList.add('is-bad');
            title.textContent = '定位可能错了';
        } else {
            dot.classList.add('is-busy');
            title.textContent = '定位中';
        }

        fill.style.width = pct + '%';

        // 第二行小字：匹配率 / σ / 稳定性，都是用户能看懂的量
        const bits = [];
        if (s.match_rate !== null && s.match_rate !== undefined) {
            bits.push('匹配 ' + Math.round(s.match_rate * 100) + '%');
        }
        if (s.std_xy !== null && s.std_xy !== undefined) {
            bits.push('σ ' + s.std_xy.toFixed(2) + 'm');
        }
        if (ready) {
            bits.push('✓');
        } else if (s.stable) {
            bits.push('稳定 ' + (s.stable_sec || 0).toFixed(1) + 's');
        } else {
            bits.push(pct + '%');
        }
        meta.textContent = bits.join(' · ');

        // 就绪后把长文案收起来，只留一行，不占地方
        if (ready) {
            reason.classList.remove('is-on');
            reason.textContent = '';
        } else {
            const txt = [s.reason, s.hint].filter(Boolean).join(' · ');
            if (txt) {
                reason.textContent = txt;
                reason.classList.add('is-on');
            } else {
                reason.classList.remove('is-on');
            }
        }
    }

    // 定位点：点一下展开成一行说明，再点收回。
    // 桌面端靠 :hover 也能展开，但触屏没有 hover，必须有这个开关。
    (function initLocTap() {
        const bar = document.getElementById('locBar');
        if (!bar) return;
        bar.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!bar.classList.contains('is-min')) return;   // 未就绪时本来就展开
            bar.classList.toggle('is-open');
        });
    })();

    socket.on('loc_status', (data) => {
        let s;
        try {
            s = JSON.parse(data.raw);
        } catch (e) {
            return;
        }
        renderLocStatus(s);
        // ★ 2026-11-01：原来是「5 秒没新数据就整条淡出」。现在改为常驻，
        //   数据断了也不消失，而是退回「定位未启动」——用户随时能看到
        //   定位到底在不在跑，不用猜。
        clearTimeout(locStatusTimer);
        locStatusTimer = setTimeout(() => {
            renderLocStatus(null);
        }, 6000);
    });

    // ============================================================
    // 电池电量（2026-11-01）
    // ------------------------------------------------------------
    // 数据链路：
    //   ESP32 → /battery_percent (std_msgs/Float32)
    //        → web_controller.battery_callback
    //        → socketio 'battery_status'
    //        → 这里
    //
    // 为什么要单独做成函数 + 先 fetch 一次：
    //   socketio 是事件推送，只在有新的 /battery_percent 时触发。
    //   页面刚打开、两次上报之间的空窗期里不会有任何事件 ——
    //   如果只依赖 socket.on，电量会一直显示 "--%"，看起来像坏了。
    //   所以 init 阶段先 GET /battery_status 拿最近一次的缓存值。
    //
    // 分级阈值统一放在这里，改一处即可，不要在 HTML/CSS 里硬编码。
    // ============================================================
    // Butler 与电量模块之间的解耦总线。
    // ------------------------------------------------------------
    // 为什么不直接调 Butler.setBattery()：
    //   renderBattery() 在首屏会立即执行一次，而 `const Butler` 在那之后
    //   才被求值 —— 直接引用会踩到 TDZ（ReferenceError）。
    //   用一个提前声明的总线，双方都只依赖它，谁也不依赖谁的初始化顺序。
    const BatteryBus = { pct: null, subs: [] };

    function publishBattery(pct) {
        BatteryBus.pct = pct;
        for (let i = 0; i < BatteryBus.subs.length; i++) {
            try { BatteryBus.subs[i](pct); } catch (e) { /* 单个订阅者出错不影响别人 */ }
        }
    }

    const BATTERY_LEVELS = { low: 20, mid: 50 };

    function renderBattery(percent) {
        const box  = document.getElementById('battery');
        const fill = document.getElementById('battery-fill');
        const text = document.getElementById('battery-text');
        if (!box || !fill || !text) return;

        const p = Number(percent);
        // null / undefined / '' / NaN 都会在这里被判为无效 →
        // 显示 "--%" 而不是 0%，避免把"没数据"误报成"电池没了"
        const valid = percent !== null && percent !== undefined &&
                      Number.isFinite(p) && p >= 0 && p <= 100;

        box.classList.remove('is-ok', 'is-mid', 'is-low', 'is-unknown');

        if (!valid) {
            box.classList.add('is-unknown');
            fill.style.width = '0%';
            text.textContent = '--%';
            box.title = '电池电量未知（尚未收到 /battery_percent）';
            publishBattery(null);
            return;
        }

        const pct = Math.max(0, Math.min(100, Math.round(p)));
        fill.style.width = pct + '%';
        text.textContent = pct + '%';

        let cls = 'is-ok';
        let hint = '电量充足';
        if (pct < BATTERY_LEVELS.low) {
            cls = 'is-low';
            hint = '电量极低，请尽快充电';
        } else if (pct < BATTERY_LEVELS.mid) {
            cls = 'is-mid';
            hint = '电量中等';
        }
        box.classList.add(cls);
        box.title = hint + '（' + pct + '%）';

        // 把电量同时也广播给管家机器人 —— 低于 10% 它会当场散架。
        // 用总线而不是直接调 Butler，避免首屏 fetch 时 Butler 还在 TDZ 里。
        publishBattery(pct);
    }

    socket.on('battery_status', (data) => {
        if (!data) return;
        renderBattery(data.percent);
    });

    // 首屏先取一次缓存值，不必等下一次 3 秒/10 秒上报
    (function initBattery() {
        renderBattery(null);           // 先画成未知态，避免闪现空白
        fetch('/battery_status')
            .then((r) => r.json())
            .then((d) => { if (d && d.status === 'success') renderBattery(d.percent); })
            .catch(() => { /* 服务端没起好时静默失败，socket 会补上 */ });
    })();
    
    // ==================== Socket.IO 事件 ====================
    socket.on('map_data', (data) => {
        const img = new Image();
        img.onload = () => {
            mapImage = img;
            mapResolution = data.resolution;
            mapOriginX = data.origin_x;
            mapOriginY = data.origin_y;
            mapWidth = data.width;
            mapHeight = data.height;
            resetView();
            document.getElementById('map-state-text').textContent = '已加载';
            document.getElementById('close-map').disabled = false;
            const badge = document.getElementById('map-badge');
            if (badge && !badge.classList.contains('live')) {
                badge.textContent = '已加载';
                badge.className = 'widget-badge';
            }
            const coords = document.getElementById('map-coords');
            if (coords) {
                coords.textContent = mapWidth + '×' + mapHeight +
                    ' @' + mapResolution.toFixed(2) + 'm';
            }
            addLog(`地图加载成功 ${mapWidth}x${mapHeight}`, 'success');
        };
        img.src = 'data:image/png;base64,' + data.image;
    });
    
    socket.on('robot_pose', (data) => {
        robotX = data.x;
        robotY = data.y;
        robotTheta = data.theta;
        drawMap();
    });

    // 后端主动推的日志（建图启停、保存结果等）
    socket.on('log', (data) => {
        if (data && data.message) addLog(data.message, data.type || 'info');
    });

    // AI 工具直控管家：后端调 butler_action 工具时会推这个事件。
    // 这样「AI 助手」就不只在聊天框里，而是真的能驱动页面上的角色。
    socket.on('butler_action', (data) => {
        if (!data) return;
        Butler.remote(data.action, data.text);
    });
    
    // ============================================================
    // 浮层组件管理
    // ------------------------------------------------------------
    // 主界面只留对话；遥控 / 监控 / 地图 都是按需唤出的浮层，每个都能
    // 单独关闭，也能整体唤出或收起（长按 / 双击输入框）。
    // ============================================================
    const WIDGET_KEYS = ['joystick', 'camera', 'map'];
    const widgetEls = {};
    WIDGET_KEYS.forEach(function (k) {
        widgetEls[k] = document.getElementById('widget-' + k);
    });
    let widgetZ = 41;

    // 记录用户拖拽后的位置、缩放后的尺寸，唤出时优先恢复
    const widgetSavedPos = {};
    const widgetSavedSize = {};

    function bringToFront(el) {
        widgetZ += 1;
        el.style.zIndex = widgetZ;
    }

    function widgetIsOpen(key) {
        const el = widgetEls[key];
        return !!el && el.classList.contains('open');
    }

    function openWidgetsWanted(keys) {
        const want = new Set(keys);
        // 先全部收起（含副作用），再按 want 打开
        WIDGET_KEYS.forEach(function (k) {
            if (!want.has(k) && widgetIsOpen(k)) closeWidget(k);
        });
        const opened = [];
        WIDGET_KEYS.forEach(function (k) {
            if (want.has(k) && !widgetIsOpen(k)) opened.push(k);
        });
        opened.forEach(function (k) {
            const el = widgetEls[k];
            el.classList.add('open');
            bringToFront(el);
            // 恢复/设置位置
            const saved = widgetSavedPos[k];
            if (saved) {
                el.style.left = saved.left + 'px';
                el.style.top = saved.top + 'px';
                el.style.right = 'auto';
            }
            // 恢复用户手动缩放过的尺寸（面板一多也不会互相挤）
            const size = widgetSavedSize[k];
            if (size && size.w && size.h) {
                el.style.width = size.w;
                el.style.height = size.h;
                el.style.maxHeight = 'none';
                el.classList.add('has-custom-size');
            } else {
                el.style.width = '';
                el.style.height = '';
                el.classList.remove('has-custom-size');
            }
        });
        // 布局要等浏览器完成一次布局计算，否则 offsetWidth 为 0
        requestAnimationFrame(function () {
            const allOpen = WIDGET_KEYS.filter(widgetIsOpen);
            // 只单独打开一个、且它有记住的位置时，尊重用户之前拖到的地方，
            // 不做自动排布；否则统一平铺，保证不会互相盖住。
            const honorSaved = allOpen.length === 1
                && opened.length === 1
                && !!widgetSavedPos[opened[0]];
            if (allOpen.length && !honorSaved) autoLayout(allOpen);
            opened.forEach(afterWidgetOpen);
            syncPhraseActive();
        });
        if (!opened.length) syncPhraseActive();
    }

    function openWidgets(keys) {
        openWidgetsWanted(keys);
    }

    function closeWidget(key, silent) {
        const el = widgetEls[key];
        if (!el || !el.classList.contains('open')) return;
        // 记录位置，下次唤出还原
        widgetSavedPos[key] = {
            left: parseFloat(el.style.left) || el.getBoundingClientRect().left,
            top: parseFloat(el.style.top) || el.getBoundingClientRect().top,
        };
        el.classList.remove('open');
        el.style.zIndex = '';
        // ---- 安全副作用：关掉即停 ----
        if (key === 'joystick') {
            // 遥控面板一关必须立刻停车，否则摇杆最后一条速度指令
            // 会一直生效（ESP32 有 3 秒无 Twist 保护，但 3 秒足够撞上）
            resetJoystick();
        } else if (key === 'camera') {
            if (cameraActive) stopCamera();
        } else if (key === 'map') {
            stopMappingPoll();
            const panel = document.getElementById('save-panel');
            if (panel) panel.classList.remove('open');
        }
        if (!silent) {
            syncPhraseActive();
            // 关掉一个后，剩下的重新平铺 —— 窄屏是按数量平分高度的，
            // 不重排会留下大片空白（或让下一个组件超出视口）。
            const remain = WIDGET_KEYS.filter(widgetIsOpen);
            if (remain.length) {
                requestAnimationFrame(function () { autoLayout(remain); });
            }
        }
    }

    function closeAllWidgets() {
        WIDGET_KEYS.forEach(function (k) { closeWidget(k, true); });
        syncPhraseActive();
    }

    function toggleAllWidgets() {
        const anyOpen = WIDGET_KEYS.some(widgetIsOpen);
        if (anyOpen) {
            closeAllWidgets();
            toast('已收起全部组件', 'ok');
        } else {
            openWidgets(WIDGET_KEYS);
            toast('已唤出全部组件', 'ok');
        }
    }

    // 顶部安全边距：操作页已经没有 topbar 了，改由右上角的状态胶囊决定。
    // 返回它下沿 + 间距，保证浮层不会盖住状态胶囊。
    function topSafeY() {
        const sf = document.querySelector('.status-float');
        if (sf) {
            const r = sf.getBoundingClientRect();
            if (r.height > 0) return r.bottom + 8;
        }
        return 56;
    }

    // 输入区顶部的 Y 坐标。浮层不能被拖到它下方 ——
    // 否则会盖住输入框和常用语按钮，用户就再也点不到了
    // （实测：把遥控卡片拖到屏幕中间偏下，整个输入区就被遮住了）。
    function composerTopY() {
        const cw = document.querySelector('.composer-wrap');
        if (!cw) return window.innerHeight - 16;
        return cw.getBoundingClientRect().top;
    }

    // 自动排布：宽屏从左到右横排（放不下换行）；窄屏纵向堆叠
    function autoLayout(keys) {
        const gap = 14;
        const topbarH = topSafeY();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const limitBottom = composerTopY();
        const narrow = vw <= 900;

        if (narrow) {
            // 窄屏：占满宽度纵向堆叠。
            // ★ 必须按可用高度平分并设 max-height —— body 是 overflow:hidden，
            //   组件一旦排到视口下方就彻底够不着（既不能滚也不能点）。
            const n = Math.max(1, keys.length);
            const availH = limitBottom - topbarH - 20 - gap * (n - 1);
            const each = Math.max(140, Math.floor(availH / n));
            let y = topbarH + 10;
            keys.forEach(function (k) {
                const el = widgetEls[k];
                el.style.left = '10px';
                el.style.right = 'auto';
                el.style.top = y + 'px';
                if (el.classList.contains('has-custom-size')) {
                    const curH = parseFloat(el.style.height) || el.offsetHeight;
                    el.style.height = Math.min(curH, each) + 'px';
                    el.style.maxHeight = 'none';
                } else {
                    el.style.maxHeight = each + 'px';
                }
                y += each + gap;
            });
            return;
        }

        // 宽屏：尽可能横排
        let x = 24;
        let y = topbarH + 24;
        let rowH = 0;
        keys.forEach(function (k) {
            const el = widgetEls[k];
            el.style.right = 'auto';
            const w = el.offsetWidth;
            const h = el.offsetHeight;
            if (x + w > vw - 24 && x > 24) {
                x = 24;
                y += rowH + gap;
                rowH = 0;
            }
            // 高度上限必须按**本行实际的 y** 来算，不能用全局常量：
            // 用 limitBottom - topbarH - 20 会漏掉 y 起点的偏移（topbarH+24），
            // 实测底部会溢出 4px 压住输入框。
            const capH = Math.max(160, limitBottom - y - 8);
            if (el.classList.contains('has-custom-size')) {
                // 用户缩放过：保留宽度，只把高度收敛回安全范围
                const curH = parseFloat(el.style.height) || h;
                el.style.height = Math.min(curH, capH) + 'px';
                el.style.maxHeight = 'none';
            } else {
                el.style.maxHeight = capH + 'px';
            }
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            const realH = Math.min(h, capH);
            x += w + gap;
            rowH = Math.max(rowH, realH);
        });
    }

    // 打开后的收尾：重算几何、重绘
    function afterWidgetOpen(key) {
        if (key === 'joystick') {
            updateJoystickGeometry();
        } else if (key === 'map') {
            // canvas 之前可能是 display:none，尺寸是 0，必须重算
            resetView();
            startMappingPoll();
        } else if (key === 'camera' && !cameraActive) {
            // 不自动开摄像头，尊重用户的流量/隐私预期
        }
    }

    // 常用语按钮高亮：完全匹配当前打开的组件组合时点亮
    function currentWidgetSignature() {
        return WIDGET_KEYS.filter(widgetIsOpen).join(',');
    }

    // 常用语按钮已改为「手柄轮盘 + 箭头列表」，这里只负责刷新手柄徽标
    function syncPhraseActive() {
        const badge = document.getElementById('joystick-badge');
        if (badge) {
            badge.textContent = widgetIsOpen('joystick')
                ? (isConnected ? '已连接' : '未连接') : '待命';
            badge.className = 'widget-badge' +
                (widgetIsOpen('joystick') && isConnected ? ' live' : '');
        }
    }

    // ============================================================
    // 拖拽（鼠标 / 触屏统一走 pointer 语义）
    // ------------------------------------------------------------
    // 只在标题栏上拖，避免和内部摇杆、地图平移的手势打架 —— 两者都在
    // 卡片内部，全局捕获会导致「想转摇杆结果把卡片拖走了」。
    // ============================================================
    function initWidgetDrag() {
        WIDGET_KEYS.forEach(function (key) {
            const el = widgetEls[key];
            if (!el) return;
            const head = el.querySelector('.widget-head');
            let dragging = false;
            let offX = 0, offY = 0;

            function point(e) {
                return e.touches && e.touches[0] ? e.touches[0] : e;
            }

            function onDown(e) {
                if (e.target.closest('.widget-close')) return;
                const p = point(e);
                const r = el.getBoundingClientRect();
                // 钉成 left/top 定位，之后拖拽才有稳定的参考
                el.style.left = r.left + 'px';
                el.style.top = r.top + 'px';
                el.style.right = 'auto';
                dragging = true;
                offX = p.clientX - r.left;
                offY = p.clientY - r.top;
                el.classList.add('dragging');
                bringToFront(el);
                if (e.cancelable) e.preventDefault();
            }

            function onMove(e) {
                if (!dragging) return;
                const p = point(e);
                const r = el.getBoundingClientRect();
                const topbarH = topSafeY();
                // 允许拖出半张卡片，但不能整个丢出屏幕；
                // 底部用「整张卡片底边不越过输入区」来算 ——
                // 只卡 top 不够：卡片本身很高时照样会盖住输入框。
                const limitBottom = composerTopY();
                const minTop = topbarH - 10;
                const maxTop = Math.max(minTop, limitBottom - r.height);
                let left = p.clientX - offX;
                let top = p.clientY - offY;
                // 左右都要留够：至少让卡片有 120px 留在可视区，
                // 否则真会被拖到只剩一条边、再也抓不回来。
                const minLeft = Math.min(0, 120 - r.width);
                const maxLeft = window.innerWidth - 120;
                left = Math.min(Math.max(left, minLeft), maxLeft);
                top = Math.min(Math.max(top, minTop), maxTop);
                el.style.left = left + 'px';
                el.style.top = top + 'px';
                if (e.cancelable) e.preventDefault();
            }

            function onUp() {
                if (!dragging) return;
                dragging = false;
                el.classList.remove('dragging');
                widgetSavedPos[key] = {
                    left: parseFloat(el.style.left) || 0,
                    top: parseFloat(el.style.top) || 0,
                };
            }

            head.addEventListener('mousedown', onDown);
            head.addEventListener('touchstart', onDown, { passive: false });
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchend', onUp);
            window.addEventListener('touchcancel', onUp);

            el.addEventListener('mousedown', function () { bringToFront(el); });
            el.addEventListener('touchstart', function () { bringToFront(el); },
                                { passive: true });
        });

        // 窗口尺寸变化时把跑出去的卡片拉回来
        window.addEventListener('resize', function () {
            const limitBottom = composerTopY();
            const topbarH = topSafeY();
            WIDGET_KEYS.forEach(function (k) {
                if (!widgetIsOpen(k)) return;
                const el = widgetEls[k];
                const r = el.getBoundingClientRect();
                const minTop = topbarH - 10;
                let left = Math.min(Math.max(r.left, -r.width * 0.4),
                                    Math.max(0, window.innerWidth - r.width * 0.6));
                let top = Math.min(Math.max(r.top, minTop),
                                   Math.max(minTop, limitBottom - r.height));
                el.style.left = left + 'px';
                el.style.top = top + 'px';
                el.style.right = 'auto';
                // 高度上限跟着新位置走，保证底边不越过输入区
                el.style.maxHeight = Math.max(160, limitBottom - top - 8) + 'px';
            });
            if (widgetIsOpen('map')) resetView();
            if (widgetIsOpen('joystick')) updateJoystickGeometry();
        });
    }

    // ============================================================
    // Toast
    // ============================================================
    function toast(message, type) {
        const host = document.getElementById('toast-host');
        const el = document.createElement('div');
        el.className = 'toast' + (type ? ' ' + type : '');
        el.textContent = message;
        host.appendChild(el);
        setTimeout(function () {
            el.style.transition = 'opacity .25s ease, transform .25s ease';
            el.style.opacity = '0';
            el.style.transform = 'translateY(8px)';
            setTimeout(function () { el.remove(); }, 260);
        }, 2600);
    }

    // ============================================================
    // 建图控制
    // ============================================================
    let mappingPollTimer = null;
    let mappingBusy = false;

    async function apiPost(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body || {}),
        });
        let data;
        try {
            data = await res.json();
        } catch (err) {
            data = {
                status: 'error',
                message: '服务器响应解析失败 (HTTP ' + res.status + ')',
            };
        }
        return data;
    }

    function setMapStatusLine(text, kind) {
        const el = document.getElementById('map-status-line');
        if (!el) return;
        if (!text) {
            el.className = 'map-status-line';
            el.textContent = '';
            return;
        }
        el.className = 'map-status-line show' + (kind ? ' ' + kind : '');
        el.textContent = text;
    }

    // 根据后端状态刷新按钮可用性
    function applyMappingState(st) {
        if (!st) return;
        const isMapping = !!st.is_mapping;
        const saving = st.state === '保存中';
        const btnStart = document.getElementById('btn-map-start');
        const btnCancel = document.getElementById('btn-map-cancel');
        const btnSave = document.getElementById('btn-map-save');
        const badge = document.getElementById('map-badge');

        if (btnStart) btnStart.disabled = isMapping || mappingBusy;
        if (btnCancel) btnCancel.disabled = !isMapping || mappingBusy;
        if (btnSave) btnSave.disabled = !isMapping || saving || mappingBusy;

        if (badge && isMapping) {
            const sec = Math.round(st.elapsed_sec || 0);
            const mm = Math.floor(sec / 60);
            const ss = String(sec % 60).padStart(2, '0');
            badge.textContent = saving ? '保存中' : '建图中 ' + mm + ':' + ss;
            badge.className = 'widget-badge' + (saving ? ' busy' : ' live');
        } else if (badge && !isMapping) {
            const mt = document.getElementById('map-state-text');
            badge.textContent = (mt && mt.textContent !== '未加载')
                ? mt.textContent : '未加载';
            badge.className = 'widget-badge';
        }

        if (isMapping && st.message) {
            setMapStatusLine('🗺️ ' + st.message, 'ok');
        }
        if (st.state === '出错' && st.message) {
            setMapStatusLine('⚠️ ' + st.message, 'err');
        }
    }

    async function refreshMappingState() {
        try {
            const res = await fetch('/mapping/status');
            const data = await res.json();
            if (data.status === 'success') applyMappingState(data.state);
        } catch (err) { /* 轮询失败静默，不要刷屏 */ }
    }

    function startMappingPoll() {
        stopMappingPoll();
        refreshMappingState();
        mappingPollTimer = setInterval(refreshMappingState, 2000);
    }

    function stopMappingPoll() {
        if (mappingPollTimer) {
            clearInterval(mappingPollTimer);
            mappingPollTimer = null;
        }
    }

    async function startMapping() {
        if (mappingBusy) return;
        if (!isConnected) {
            toast('请先连接机器人', 'warn');
            return;
        }
        if (!confirm('开始建图会先停止导航栈（AMCL），再启动 Cartographer。\n' +
                     '雷达、EKF、micro-ROS 会保留，ESP32 不需要断电。\n\n确认开始？')) {
            return;
        }
        mappingBusy = true;
        applyMappingState({ is_mapping: false });
        setMapStatusLine('⏳ 正在停止导航栈并启动 Cartographer…', 'warn');
        addLog('开始建图：先停导航栈', 'info');
        try {
            const data = await apiPost('/mapping/start');
            if (data.status === 'success') {
                toast('建图已启动，可以开始遥控', 'ok');
                addLog('建图已启动', 'success');
                setMapStatusLine('🗺️ ' + data.message, 'ok');
                // 建图时地图靠 Cartographer 的 /map 推过来，需重绘
                if (!widgetIsOpen('map')) openWidgets(['joystick', 'map']);
            } else {
                toast(data.message || '启动失败', 'err');
                addLog('建图启动失败: ' + data.message, 'error');
                setMapStatusLine('❌ ' + (data.message || '启动失败'), 'err');
            }
            if (data.state) applyMappingState(data.state);
        } catch (err) {
            toast('网络错误', 'err');
            setMapStatusLine('❌ 网络错误: ' + err.message, 'err');
        } finally {
            mappingBusy = false;
            refreshMappingState();
        }
    }

    async function cancelMapping() {
        if (mappingBusy) return;
        if (!confirm('取消建图？未保存的建图数据会丢失。')) return;
        mappingBusy = true;
        setMapStatusLine('⏳ 正在停止建图栈…', 'warn');
        try {
            const data = await apiPost('/mapping/stop');
            if (data.status === 'success') {
                toast('建图已取消', 'ok');
                addLog('建图已取消', 'info');
                setMapStatusLine('建图已取消', 'warn');
            } else {
                toast(data.message || '取消失败', 'err');
                setMapStatusLine('❌ ' + (data.message || '取消失败'), 'err');
            }
            if (data.state) applyMappingState(data.state);
        } catch (err) {
            toast('网络错误', 'err');
            setMapStatusLine('❌ 网络错误: ' + err.message, 'err');
        } finally {
            mappingBusy = false;
            refreshMappingState();
        }
    }

    function openSavePanel() {
        const panel = document.getElementById('save-panel');
        const input = document.getElementById('save-name');
        panel.classList.add('open');
        input.focus();
        input.select();
    }

    function closeSavePanel() {
        document.getElementById('save-panel').classList.remove('open');
    }

    async function confirmSaveMapping() {
        if (mappingBusy) return;
        const input = document.getElementById('save-name');
        const name = (input.value || '').trim();
        if (!name) {
            toast('请填写地图名', 'warn');
            input.focus();
            return;
        }
        // 和后端规则保持一致，提前拦掉而不是等 400
        if (name.indexOf('/') >= 0 || name.indexOf('\\') >= 0) {
            toast('地图名不能包含路径分隔符', 'warn');
            return;
        }
        mappingBusy = true;
        closeSavePanel();
        setMapStatusLine('💾 正在保存地图 ' + name + ' …（约需数秒）', 'warn');
        addLog('保存地图: ' + name, 'info');
        try {
            const data = await apiPost('/mapping/save', {
                name: name,
                directory: '',
                overwrite: true,
                save_pbstream: true,
            });
            if (data.status === 'success') {
                toast('地图已保存：' + name, 'ok');
                addLog('地图已保存: ' + data.message, 'success');
                setMapStatusLine('✅ ' + data.message, 'ok');
            } else {
                toast(data.message || '保存失败', 'err');
                addLog('地图保存失败: ' + data.message, 'error');
                setMapStatusLine('❌ ' + (data.message || '保存失败'), 'err');
            }
            if (data.state) applyMappingState(data.state);
        } catch (err) {
            toast('网络错误', 'err');
            setMapStatusLine('❌ 网络错误: ' + err.message, 'err');
        } finally {
            mappingBusy = false;
            refreshMappingState();
        }
    }

    // ============================================================
    // 输入框手势：长按 / 双击 一键唤出或收起全部组件
    // ============================================================
    function initComposerGestures() {
        const input = document.getElementById('chat-input');
        let pressTimer = null;
        let lastFire = 0;

        function fire() {
            const now = Date.now();
            if (now - lastFire < 450) return;   // 长按与双击去重
            lastFire = now;
            toggleAllWidgets();
        }
        function startPress() {
            cancelPress();
            pressTimer = setTimeout(fire, 550);
        }
        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        input.addEventListener('mousedown', startPress);
        input.addEventListener('touchstart', startPress, { passive: true });
        ['mouseup', 'mouseleave', 'touchend', 'touchcancel', 'blur']
            .forEach(function (ev) {
                input.addEventListener(ev, cancelPress);
            });
        input.addEventListener('dblclick', function (e) {
            e.preventDefault();
            fire();
        });
    }

    function bindWidgetButtons() {
        document.querySelectorAll('.widget-close').forEach(function (btn) {
            const key = btn.getAttribute('data-close');
            const h = function (e) {
                e.preventDefault();
                e.stopPropagation();
                closeWidget(key);
            };
            btn.addEventListener('click', h);
            btn.addEventListener('touchstart', h, { passive: false });
        });

        // 常用语 → 唤出指定组件（旧版 UI 已移除，保留空实现仅防意外）
        const bind = function (id, handler) {
            const el = document.getElementById(id);
            if (!el) return;
            const wrapped = function (e) {
                e.preventDefault();
                handler(e);
            };
            el.addEventListener('click', wrapped);
            el.addEventListener('touchstart', wrapped, { passive: false });
        };

        bind('btn-map-start', startMapping);
        bind('btn-map-cancel', cancelMapping);
        bind('btn-map-save', openSavePanel);
        bind('save-confirm', confirmSaveMapping);
        bind('save-cancel', closeSavePanel);
    }

    // ============================================================
    // 3D 场景视差
    // ------------------------------------------------------------
    // 位移写在 SVG 用户坐标里（viewBox 1600x900），所以不同屏幕尺寸下
    // 的相对位移量一致。远近层系数不同 → 产生纵深。
    // ============================================================
    // ============================================================
    // 移动视角（2026-11-01 重做）
    // ------------------------------------------------------------
    // 原来这里有 4 层 .room-layer[data-depth] 的视差：鼠标一动，
    // 不同景深的 SVG 各自平移不同距离。
    //
    // 背景换成"实时算出来的斜二轴测世界"之后，那些图层没了，
    // 这个函数就静默返回了 —— 用户立刻发现"触控移动视角的设计消失了"。
    //
    // 现在的做法：整幅场景包在 <g id="camRoot"> 里，拖动时只平移这一层。
    //   · 墙和地板都已经画到屏幕之外，所以平移永远不会露出边缘；
    //   · 不重算任何世界坐标，碰撞/机器人位置完全不受影响；
    //   · 位移幅度限制在屏宽 3%、屏高 2.2% —— 有"镜头在动"的感觉，
    //     又不至于让人晕。
    // 鼠标和触摸都监听，指针离开后缓慢回正。
    // ============================================================
    function initParallax() {
        // ★ 不能写 window.World：World 是 <script> 顶层的一个 const，
        //   它只生成全局词法绑定，并不会挂到 window 上。
        //   一开始写成 window.World 判断，结果这里每次都提前 return ——
        //   拖动视角看起来"功能消失了"，其实是被自己的守卫挡掉了。
        if (typeof World === 'undefined' || typeof World.setCam !== 'function') return;

        let tx = 0, ty = 0, raf = null;

        function apply() {
            raf = null;
            World.setCam(tx, ty);
        }

        function aim(clientX, clientY) {
            tx = Math.max(-1, Math.min(1, (clientX / window.innerWidth) * 2 - 1));
            ty = Math.max(-1, Math.min(1, (clientY / window.innerHeight) * 2 - 1));
            if (!raf) raf = requestAnimationFrame(apply);
        }

        window.addEventListener('mousemove', function (e) {
            aim(e.clientX, e.clientY);
        }, { passive: true });

        // 触摸：手指拖动时跟随。用 touchmove 而不是 touchstart，
        // 这样轻点按钮不会让画面突然跳一下。
        window.addEventListener('touchmove', function (e) {
            if (e.touches && e.touches[0]) {
                aim(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // 松手 / 指针离开 → 回正
        function recentre() {
            tx = 0; ty = 0;
            if (!raf) raf = requestAnimationFrame(apply);
        }
        window.addEventListener('touchend', recentre, { passive: true });
        window.addEventListener('touchcancel', recentre, { passive: true });
        document.addEventListener('mouseleave', recentre);

        // 手机摇晃（设备方向）：有就用，没有也无所谓
        window.addEventListener('deviceorientation', function (e) {
            if (e.gamma === null || e.beta === null) return;
            tx = Math.max(-1, Math.min(1, e.gamma / 28));
            ty = Math.max(-1, Math.min(1, (e.beta - 45) / 28));
            if (!raf) raf = requestAnimationFrame(apply);
        }, { passive: true });
    }

    // ============================================================
    // 左右两个圆钮 + 轮盘 + 指令列表
    // ------------------------------------------------------------
    // 交互：
    //   单击 / 单点   → 选中（淡黄高亮）
    //   再按一次      → 展开内置选项
    //   长按 380ms    → 直接展开
    //   执行任意选项  → 复位到按钮态
    //   点空白处      → 复位
    // ============================================================
    const orbState = { sel: null, open: null };
    const ORB_LONG_PRESS_MS = 380;

    function refreshOrbVisual() {
        const w = document.getElementById('orbWidgets');
        const c = document.getElementById('orbCmds');
        if (w) {
            w.classList.toggle('is-selected', orbState.sel === 'widgets');
            w.classList.toggle('is-open', orbState.open === 'widgets');
        }
        if (c) {
            c.classList.toggle('is-selected', orbState.sel === 'cmds');
            c.classList.toggle('is-open', orbState.open === 'cmds');
        }
    }

    function highlightRadialSlice(slice) {
        const rad = document.getElementById('radialWidgets');
        const ring = document.getElementById('radialRing');
        if (!rad || !ring) return;
        ring.className = 'radial-ring' + (slice >= 0 ? ' hl-' + slice : '');
        rad.querySelectorAll('.radial-label').forEach(function (l) {
            l.classList.toggle('is-hl',
                parseInt(l.getAttribute('data-slice'), 10) === slice);
        });
    }

    function closeRadial() {
        const rad = document.getElementById('radialWidgets');
        if (rad) rad.classList.remove('is-open');
        highlightRadialSlice(-1);
        if (orbState.open === 'widgets') orbState.open = null;
        refreshOrbVisual();
    }

    function closeCmdList() {
        const list = document.getElementById('cmdList');
        if (list) list.classList.remove('is-open');
        if (orbState.open === 'cmds') orbState.open = null;
        refreshOrbVisual();
    }

    function resetOrb() {
        orbState.sel = null;
        closeRadial();
        closeCmdList();
        refreshOrbVisual();
    }

    function openRadial() {
        const rad = document.getElementById('radialWidgets');
        const btn = document.getElementById('orbWidgets');
        if (!rad || !btn) return;
        orbState.sel = 'widgets';
        orbState.open = 'widgets';
        refreshOrbVisual();

        const r = btn.getBoundingClientRect();
        const box = rad.offsetWidth || 264;      // 布局尺寸（不受 scale 影响）

        // 轮盘尺寸：高度和宽度**两个方向**都要卡。
        // 只看高度的话，窄屏（手机竖屏 390px）下 232px 的轮盘水平方向
        // 会被按钮位置顶到屏幕外（实测 left=-72）。
        const availUp = r.top - 14;
        const availDown = window.innerHeight - r.bottom - 14;
        const roomH = Math.max(availUp, availDown);
        const roomW = window.innerWidth - 16;
        const rs = Math.max(0.45, Math.min(
            1, roomH / (box + 16), roomW / box));
        rad.style.setProperty('--rs', rs.toFixed(3));

        // ★ transform-origin 是 50% 100%（底部中心），所以缩放只会让
        //   视觉顶部下移，视觉底边 == 布局底边。因此定位必须用
        //   布局尺寸 box 来算，用缩放后的尺寸算会少移动一截，实测
        //   轮盘会压住按钮 11px。
        const vis = box * rs;
        const visTopOffset = box - vis;         // 视觉顶部相对布局顶部的下移量

        let top = r.top - 16 - box;             // 视觉底边贴在按钮上方 16px
        let left = r.left + r.width / 2 - box / 2;

        // 上方确实放不下（视觉顶部会出界）→ 翻到按钮下方
        if (top + visTopOffset < 8) {
            top = r.bottom + 16 - visTopOffset;
        }

        // 水平收进视口（按视觉边界算）
        if (left + visTopOffset / 2 < 8) {
            left = 8 - visTopOffset / 2;
        }
        if (left + visTopOffset / 2 + vis > window.innerWidth - 8) {
            left = window.innerWidth - 8 - vis - visTopOffset / 2;
        }

        rad.style.left = left + 'px';
        rad.style.top = Math.max(0, top) + 'px';
        rad.classList.add('is-open');
    }

    function openCmdList() {
        const list = document.getElementById('cmdList');
        const btn = document.getElementById('orbCmds');
        if (!list || !btn) return;
        orbState.sel = 'cmds';
        orbState.open = 'cmds';
        refreshOrbVisual();

        const r = btn.getBoundingClientRect();
        const w = list.offsetWidth || 210;
        let h = list.offsetHeight || 300;
        if (h > window.innerHeight - 24) h = window.innerHeight - 24;
        let left = r.right - w;
        let top = r.top - h - 16;
        left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
        if (top < 8) {
            top = Math.min(window.innerHeight - h - 8, r.bottom + 16);
        }
        list.style.left = left + 'px';
        list.style.top = Math.max(8, top) + 'px';
        list.classList.add('is-open');
    }

    function setupOrb(btn, key, openFn) {
        if (!btn) return;
        let timer = null;
        let longFired = false;

        function down(e) {
            if (typeof e.button === 'number' && e.button > 0) return;
            longFired = false;
            clearTimeout(timer);
            // 捕获指针：手指滑出按钮再松开也能正确收到 pointerup，
            // 否则会卡在「按下未抬起」的中间态。
            try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
            timer = setTimeout(function () {
                longFired = true;
                if (orbState.open && orbState.open !== key) resetOrb();
                openFn();
            }, ORB_LONG_PRESS_MS);
        }

        function up(e) {
            clearTimeout(timer);
            if (longFired) {
                longFired = false;
                return;
            }
            if (orbState.open === key) {
                resetOrb();          // 已展开 → 收起并取消选中
                return;
            }
            if (orbState.sel !== key) {
                orbState.sel = key;  // 第一次按：选中
                refreshOrbVisual();
                return;
            }
            if (orbState.open && orbState.open !== key) resetOrb();
            openFn();                // 第二次按：展开
        }

        function cancel() { clearTimeout(timer); }

        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', cancel);
        btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    }

    function initRadialDrag() {
        const rad = document.getElementById('radialWidgets');
        if (!rad) return;
        let dragging = false;

        function sliceAt(clientX, clientY) {
            const r = rad.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            const dx = clientX - cx;
            const dy = clientY - cy;
            // 中心留白：手指刚按下时抖动不该误选
            if (Math.sqrt(dx * dx + dy * dy) < r.width * 0.15) return -1;
            let deg = Math.atan2(dy, dx) * 180 / Math.PI;
            deg = (deg + 360) % 360;
            if (deg >= 315 || deg < 45) return 0;   // 右 → 看监控
            if (deg < 135) return 1;                // 下 → 建图
            if (deg < 225) return 2;                // 左 → 收起
            return 3;                               // 上 → 遥控
        }

        rad.addEventListener('pointerdown', function (e) {
            dragging = true;
            e.stopPropagation();
            e.preventDefault();
            try { rad.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
            highlightRadialSlice(sliceAt(e.clientX, e.clientY));
        });

        rad.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            e.stopPropagation();
            highlightRadialSlice(sliceAt(e.clientX, e.clientY));
        });

        rad.addEventListener('pointerup', function (e) {
            if (!dragging) return;
            dragging = false;
            const slice = sliceAt(e.clientX, e.clientY);
            highlightRadialSlice(-1);
            if (slice >= 0) runRadialSlice(slice);
            resetOrb();
        });

        rad.addEventListener('pointercancel', function () {
            dragging = false;
            highlightRadialSlice(-1);
        });
    }

    function runRadialSlice(slice) {
        if (slice === 0) {
            openWidgets(['camera']);
            toast('已唤出实时监控', 'ok');
        } else if (slice === 1) {
            openWidgets(['joystick', 'map']);
            toast('已唤出遥控与地图', 'ok');
        } else if (slice === 2) {
            closeAllWidgets();
            toast('已收起全部组件', 'ok');
        } else if (slice === 3) {
            openWidgets(['joystick', 'camera']);
            toast('已唤出遥控与监控', 'ok');
        }
    }

    function runCmdItem(item) {
        const now = Date.now();
        // 长按与 pointerup 会各触发一次，这里去重
        if (now - (runCmdItem._last || 0) < 320) return;
        runCmdItem._last = now;

        const cmd = item.getAttribute('data-cmd');
        if (cmd) {
            const input = document.getElementById('chat-input');
            if (input) input.value = cmd;
            sendChatMessage();
        } else if (item.id === 'clearChatBtn') {
            clearChatMessages();
        }
        resetOrb();
    }

    function initCmdList() {
        const list = document.getElementById('cmdList');
        if (!list) return;

        list.querySelectorAll('.cmd-item').forEach(function (item) {
            let holdTimer = null;
            let fired = false;

            function down(e) {
                e.stopPropagation();
                fired = false;
                item.classList.add('is-hl');
                try { item.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
                clearTimeout(holdTimer);
                // 支持长按直接执行
                holdTimer = setTimeout(function () {
                    fired = true;
                    runCmdItem(item);
                }, 480);
            }

            function up(e) {
                clearTimeout(holdTimer);
                item.classList.remove('is-hl');
                e.stopPropagation();
                if (fired) { fired = false; return; }
                runCmdItem(item);
            }

            function cancel() {
                clearTimeout(holdTimer);
                item.classList.remove('is-hl');
            }

            item.addEventListener('pointerdown', down);
            item.addEventListener('pointerup', up);
            item.addEventListener('pointercancel', cancel);
            item.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        });
    }

    function initOrbSystem() {
        setupOrb(document.getElementById('orbWidgets'), 'widgets', openRadial);
        setupOrb(document.getElementById('orbCmds'), 'cmds', openCmdList);
        initRadialDrag();
        initCmdList();

        // 点空白处复位。用捕获阶段，保证在内部元素处理之前判定。
        document.addEventListener('pointerdown', function (e) {
            const inOrb = e.target.closest('.orb')
                || e.target.closest('.radial')
                || e.target.closest('.cmd-list');
            if (!inOrb && (orbState.sel || orbState.open)) resetOrb();

            if (!e.target.closest('.settings-dock')) {
                const menu = document.getElementById('settingsMenu');
                const fab = document.getElementById('settingsFab');
                if (menu) menu.classList.remove('is-open');
                if (fab) fab.classList.remove('is-open');
            }
        }, true);
    }

    // ============================================================
    // 浮层缩放
    // ------------------------------------------------------------
    // 监听挂在 window 上而不是手柄自身：
    // 手柄只有 26x26，手指一移开就出界；虽然理论上 setPointerCapture
    // 能解决，但实测部分环境（含 VS Code 内置浏览器）里 pointerup
    // 会丢，导致尺寸只改了一点、而且不会记住。
    // ============================================================
    function initWidgetResize() {
        WIDGET_KEYS.forEach(function (key) {
            const el = widgetEls[key];
            if (!el) return;
            const handle = el.querySelector('.widget-resize');
            if (!handle) return;

            let resizing = false;
            let sx = 0, sy = 0, sw = 0, sh = 0;

            function pt(e) {
                return (e.touches && e.touches[0]) ? e.touches[0] : e;
            }

            function down(e) {
                e.preventDefault();
                e.stopPropagation();
                const p = pt(e);
                const r = el.getBoundingClientRect();
                sx = p.clientX;
                sy = p.clientY;
                sw = r.width;
                sh = r.height;
                resizing = true;
                el.classList.add('dragging');
                el.style.left = r.left + 'px';
                el.style.top = r.top + 'px';
                el.style.right = 'auto';
                bringToFront(el);
            }

            function move(e) {
                if (!resizing) return;
                const p = pt(e);
                const limitBottom = composerTopY();
                const top = parseFloat(el.style.top) || 0;
                const left = parseFloat(el.style.left) || 0;
                const minW = 220, minH = 160;
                const maxW = Math.max(minW, window.innerWidth - left - 8);
                const maxH = Math.max(minH, limitBottom - top - 8);
                const w = Math.min(Math.max(sw + (p.clientX - sx), minW), maxW);
                const h = Math.min(Math.max(sh + (p.clientY - sy), minH), maxH);
                el.style.width = w + 'px';
                el.style.height = h + 'px';
                el.style.maxHeight = 'none';
                el.classList.add('has-custom-size');
                if (e.cancelable) e.preventDefault();
            }

            function up() {
                if (!resizing) return;
                resizing = false;
                el.classList.remove('dragging');
                // 记住尺寸，下次唤出还原
                widgetSavedSize[key] = { w: el.style.width, h: el.style.height };
                if (key === 'map') resetView();
                if (key === 'joystick') updateJoystickGeometry();
            }

            handle.addEventListener('mousedown', down);
            handle.addEventListener('touchstart', down, { passive: false });
            window.addEventListener('mousemove', move);
            window.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('mouseup', up);
            window.addEventListener('touchend', up);
            window.addEventListener('touchcancel', up);
            handle.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        });
    }

    // ============================================================
    // 右下角设置抽屉
    // ============================================================
    function initSettingsDock() {
        const fab = document.getElementById('settingsFab');
        const menu = document.getElementById('settingsMenu');
        if (!fab || !menu) return;

        fab.addEventListener('pointerdown', function (e) {
            e.stopPropagation();
            e.preventDefault();
            const open = !menu.classList.contains('is-open');
            menu.classList.toggle('is-open', open);
            fab.classList.toggle('is-open', open);
        });
    }

    // ============================================================
    // 禁用浏览器默认交互
    // ------------------------------------------------------------
    // CSS 已经关掉选择/长按菜单，这里补上事件层的拦截：
    //   1) 右键菜单（输入框放行，方便粘贴）
    //   2) 双击缩放（少数安卓浏览器不认 user-scalable=no）
    //   3) iOS 捏合手势缩放
    // ============================================================
    function initGestureLock() {
        document.addEventListener('contextmenu', function (e) {
            if (e.target.closest('input, textarea')) return;
            e.preventDefault();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300
                    && !e.target.closest('input, textarea, .orb, .cmd-item, button')) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
            document.addEventListener(ev, function (e) { e.preventDefault(); });
        });
    }

    // ============================================================
    // 管家机器人控制器
    // ------------------------------------------------------------
    // 三层结构：
    //   1) 动作层  play(name) —— 切换 is-xxx 类，带时长自动回待机
    //   2) 移动层  walkTo(pct) —— 在房间地板上来回走
    //   3) 说话层  say(text)   —— 头顶聊天气泡
    //
    // 谁来驱动：
    //   * 本地待机轮换（默认，0 成本，不用调 LLM）
    //   * 用户发消息 → 认可 → 思考；收到回复 → 开心
    //   * 后端 AI 主动调 butler_action 工具（socket 推送）→ 覆盖执行
    // ============================================================
    // ============================================================
    // 斜二轴测世界（2026-11-01）
    // ------------------------------------------------------------
    // 【为什么把背景换成「算出来的」而不是「画出来的」】
    //   原来的背景是一张手绘透视 SVG + 4 层视差。问题是：
    //     1) 家具位置只有画面上的像素，程序不知道桌子在哪，
    //        所以做不了碰撞 —— 机器人可以直接从沙发上碾过去；
    //     2) 只有横向位移有意义，前后纵深完全用不上。
    //
    // 【斜二轴测（cabinet / oblique axonometric）投影】
    //   世界坐标 (x, y, z)：
    //       x → 屏幕水平向右
    //       y → 屏幕右上 45°（进深），这是关键：x 与 y 的夹角是 45°，
    //           不是互相垂直
    //       z → 屏幕垂直向上
    //   投影公式（平行投影，无灭点，远近等大）：
    //       sx = ox + (x + y·cos45°)·k
    //       sy = oy − (y·cos45° + z)·k
    //
    //   好处：
    //     · 沿 x 走 = 画面水平平移；沿 y 走 = 沿 45° 斜线平移；
    //       两者叠加 = 任意方向的复合运动，且与背景家具的斜面同构，
    //       永远不会出现「透视对不上」的穿帮。
    //     · 家具用世界坐标 AABB 描述，碰撞检测也在世界坐标里做，
    //       视觉和物理天然一致。
    //
    // 【为什么箱子只画三个面】
    //   进深轴朝右上，所以一个立方体可见的正好是「正面 + 顶面 + 右侧面」，
    //   三个面的投影恰好铺满整个轮廓，不会重叠。
    //   正面用基础色、顶面提亮、右侧面压暗，就有了体积感。
    // ============================================================
    const World = (function () {
        const C45 = Math.SQRT1_2;                  // cos45° = sin45° ≈ .7071

        // 房间尺寸（w / d 会在 layout() 里按预设覆盖，wallH 由 layout 计算）
        const ROOM = { w: 7.2, d: 4.4, wallH: 3.2 };

        // 家具清单
        //   x0 / y0 = 底面「前左角」    w = x 方向宽    d = y 方向进深
        //   h = 高度      z0 = 离地高度（窗户挂在墙上）
        //   layer：0 = 地板贴花（必须先画，否则会盖住站在上面的家具）
        //   soft ：能挡住机器人，但撞上去不触发摔倒（地毯、窗户）
        // ★ 布局原则（被实机验证打回过一次）：
        //   地毯最初放在房间正中央、尺寸 2.64x1.48，加上 0.30 的碰撞半径后
        //   几乎封死了整个中场 —— 机器人出生点就在地毯里，走一步就被挡住，
        //   表现为「完全不动的假死」。
        //   现在把地毯挪到沙发脚下（和沙发共用同一块区域，不额外占地方），
        //   茶几往右后方挪，正面留出一条贯穿左右的空地当"跑道"。
        // ★ 为什么把进深从 4.4 压到 3.0（2026-11-01）
        // ------------------------------------------------------------
        // 用户反馈："家具、背后的墙体、地板要均匀分布，现在地板占了
        //          屏幕的一半"。
        //
        // 斜二轴测里，地板在屏幕上的高度 = d·cos45°·k；
        // 而家具高度 = 实物高 × k。两者相除，k 被约掉：
        //     地板高 / 沙发高 = d·cos45° / 0.8
        // 也就是说「地板有多大、家具就显得多小」**只由进深 d 决定**，
        // 无论怎么调缩放都改变不了这个比例。
        // 想同时做到「地板变小」和「家具变大」，唯一的路就是减小 d。
        // d 从 4.4 降到 3.0 后，这个比值从 3.9 降到 2.65。
        const WIDE_ITEMS = [
            { id: 'rug', kind: 'rug', layer: 0, soft: true,
              x0: -3.30, y0: 1.15, w: 2.50, d: 1.30, h: 0.02,
              c: '#ffd6a6', name: '地毯' },
            { id: 'window', kind: 'window', layer: 1, soft: true,
              x0: -0.70, y0: 2.90, w: 2.45, d: 0.10, h: 1.45, z0: 0.62,
              c: '#fff5dc', name: '窗户' },
            // 沙发：后沿 1.96+0.72 = 2.68，墙 3.00，距 0.32
            // 小双人沙发：宽 1.26（2.35 → 1.70 → 1.38 → 1.26 逐轮收窄）
            // 后沿 1.96+0.70 = 2.66，距后墙 0.34 —— 仍然贴着墙
            { id: 'sofa', kind: 'sofa', layer: 1,
              x0: -3.30, y0: 1.96, w: 1.26, d: 0.70, h: 0.64,
              c: '#f7bc8c', name: '沙发' },
            // 茶几往后挪到 y≥1.55：前方空地加深到 0.83 米，
            // 机器人才有地方来回走
            { id: 'table', kind: 'table', layer: 1,
              x0: 0.20, y0: 1.60, w: 1.15, d: 0.66, h: 0.42,
              c: '#f0d3a8', name: '茶几' },
            // 盆栽：右后角
            { id: 'plant', kind: 'plant', layer: 1,
              x0: 2.90, y0: 2.02, w: 0.58, d: 0.58, h: 0.98,
              c: '#d99566', name: '盆栽' },
        ];

        // 竖屏专用布局（2026-11-01）
        // ------------------------------------------------------------
        // 【为什么手机上要换一套】
        //   斜二轴测里，屏幕能装下的行走宽度 ≈ vw/k，
        //   而行走区域本身的屏幕跨度是 (Δx + Δy·cos45°)·k。
        //   竖屏 vw 很小，若沿用 7.2m 宽的横厅，要么房间缩成一条，
        //   要么机器人走到边上就出画。所以竖屏改成"窄而深"的户型：
        //   宽度收到 4.8，家具沿纵深排布，沙发居中靠后，两侧留出通道。
        // ★ 为什么竖屏要"窄而深"（第三次调整，前两次都留白过多）：
        //   屏幕上"墙 + 前景"的总高度 = vh − d·cos45°·k，是不随 k 变的。
        //   也就是说：地板在屏幕上的高度只取决于 d（进深）和 k。
        //   d = 3.2 时算出来地板只占 39%、墙占 61% —— 手机上半屏全是墙，
        //   这就是"太空"的数学原因。
        //   把进深拉到 5.6 之后，地板占到约六成，墙退到三成多，
        //   再叠上窗户 / 挂画 / 搁板 / 吊灯，画面才真正被填满。
        // ★ 竖屏布局（2026-11-01 第二次调整）
        // ------------------------------------------------------------
        // 上一版为了给机器人留通道，把沙发挪到了房间中段（y=2.55），
        // 结果沙发孤零零悬在屋子中间 —— 用户反馈"违和感强，
        // 没有像电脑端一样靠墙"。
        //
        // 这一版按真实客厅来摆：
        //   · 沙发靠后墙（后沿距墙 0.32，和电脑端完全一致）
        //   · 沙发左端几乎贴着左墙
        //   · 地毯压在沙发前缘下面
        //   · 茶几落在地毯上、沙发正前方
        //   · 盆栽塞右后角，落地灯靠右侧
        // 机器人活动区收缩到"茶几之前"那段起居空地上 —— 真实家庭里
        // 人也不会走到沙发后面去，这样既合理又天然避开了家具。
        // ★ 竖屏布局（2026-11-01 第四次：家具后退，前面留空地）
        // ------------------------------------------------------------
        // 【为什么必须这样排 —— 这是算出来的，不是拍脑袋】
        //   斜二轴测里，屏幕上能装的行走宽度是：
        //         vw/k − Δy·cos45°
        //   Δy 是可行走区的进深。手机 vw/k 只有约 2.9 世界单位，
        //   而 Δy 越大，这一项扣掉的就越多。
        //
        //   上一版边界取 y ∈ [0.42, 2.40]（Δy = 1.98），
        //   扣掉 1.40 之后只剩 1.5 —— 而家具又铺满了整间房，
        //   最终可见的可走区域只有 1.29×0.4 米的一条缝，
        //   机器人一步都迈不开（实测 45 秒零位移）。
        //
        //   这一版把家具全部推到 y ≥ 1.55 之后，
        //   可行走区缩成"客厅前方那片空地" y ∈ [0.42, 1.55]，
        //   Δy = 1.13 → 扣掉 0.80，可走宽度回到约 2.1 世界单位。
        //   在 414px 宽的手机上，这就是 300px 的横向活动范围。
        const TALL_ITEMS = [
            { id: 'rug', kind: 'rug', layer: 0, soft: true,
              x0: -2.00, y0: 1.40, w: 2.40, d: 0.95, h: 0.02,
              c: '#ffd6a6', name: '地毯' },
            // 窗户：挂沙发正上方（唯一的自然光源，必须留在画面里）
            { id: 'window', kind: 'window', layer: 1, soft: true,
              x0: -1.30, y0: 2.90, w: 1.20, d: 0.10, h: 1.45, z0: 0.95,
              c: '#fff5dc', name: '窗户' },
            // 沙发：后沿 2.16+0.72 = 2.88，正好贴后墙
            // 小双人沙发：宽 1.10、进深 0.70、高 0.64
            // 后沿 2.18+0.70 = 2.88，距后墙 0.12 —— 仍然贴着墙
            { id: 'sofa', kind: 'sofa', layer: 1,
              x0: -1.80, y0: 2.18, w: 1.10, d: 0.70, h: 0.64,
              c: '#f7bc8c', name: '沙发' },
            // 茶几：沙发正前方，落在毯子上（y ≥ 1.75，不进可行走区）
            { id: 'table', kind: 'table', layer: 1,
              x0: -1.40, y0: 1.80, w: 0.88, d: 0.58, h: 0.40,
              c: '#f0d3a8', name: '茶几' },
            // 盆栽：沙发右端，靠后
            { id: 'plant', kind: 'plant', layer: 1,
              x0: 0.30, y0: 2.10, w: 0.55, d: 0.55, h: 0.98,
              c: '#d99566', name: '盆栽' },
        ];

        // ============================================================
        // 墙面装饰（不可碰撞，只贴在 y = d 的后墙上）
        // ------------------------------------------------------------
        // ★ 位置和尺寸全部用「比例」而不是绝对世界坐标（2026-11-01）。
        //   原因：墙高 wallH 是 layout() 算出来的，会随视口变化 ——
        //   手机上为了盖住屏幕顶部，墙可以长到 10 个单位以上。
        //   如果画框写死 z=1.95，它就只到墙的 1/5 高度，
        //   上面 4/5 是一大片空墙，正是用户说的"太空"。
        //   改成比例后，无论墙多高，装饰都均匀铺满整个墙面。
        //
        //   xf = 横向位置（占半间房宽的比例，-1 = 左墙）
        //   zf = 高度（占墙高的比例，0 = 地面，1 = 墙顶）
        //   wf / hf = 尺寸（占墙高的比例，保证与 zf 同尺度）
        // ============================================================
        const WIDE_DECOR = [
            { kind: 'frame', xf: 0.70, zf: 0.30, wf: 0.26, hf: 0.20,
              c: '#ffeacd', art: '#f0c79a' },
            { kind: 'frame', xf: -0.20, zf: 0.26, wf: 0.17, hf: 0.13,
              c: '#fff0d8', art: '#e8b98c' },
            { kind: 'sconce', xf: 0.36, zf: 0.34 },
            { kind: 'shelf', xf: 0.10, zf: 0.56, wf: 0.30 },
            { kind: 'frame', xf: -0.62, zf: 0.62, wf: 0.21, hf: 0.16,
              c: '#ffeacd', art: '#e8b98c' },
            // 吊灯：zf 对吊灯来说 = 灯罩底部落在屏幕高度的百分比
            { kind: 'pendant', xf: 0.50, zf: 0.20 },
        ];

        // 竖屏的墙特别高（房间只占下半屏），所以装饰铺得更密，
        // 从上到下五层，让整面墙都有内容。
        const TALL_DECOR = [
            { kind: 'frame', xf: -0.58, zf: 0.13, wf: 0.15, hf: 0.11,
              c: '#ffeacd', art: '#f0c79a' },
            { kind: 'sconce', xf: 0.62, zf: 0.22 },
            { kind: 'frame', xf: 0.14, zf: 0.31, wf: 0.12, hf: 0.09,
              c: '#fff0d8', art: '#e8b98c' },
            { kind: 'shelf', xf: -0.34, zf: 0.43, wf: 0.24 },
            { kind: 'frame', xf: -0.60, zf: 0.58, wf: 0.16, hf: 0.12,
              c: '#ffeacd', art: '#f0c79a' },
            { kind: 'sconce', xf: 0.66, zf: 0.68 },
            { kind: 'shelf', xf: 0.24, zf: 0.78, wf: 0.20 },
            // 吊灯：zf 对吊灯来说 = 灯罩底部落在屏幕高度的百分比
            { kind: 'pendant', xf: 0.50, zf: 0.20 },
        ];

        // 当前生效的预设（由 layout() 覆盖）
        let ITEMS = WIDE_ITEMS;
        let DECOR = WIDE_DECOR;

        // 机器人可达范围（世界坐标）。留出边距，
        // 免得它跑到墙里或者一半身子伸出地板外。
        const BOUNDS = { x0: -3.10, x1: 3.10, y0: 0.45, y1: 3.95 };
        const WIDE_BOUNDS = { x0: -3.10, x1: 3.10, y0: 0.42, y1: 2.40 };
        // 活动区 = 茶几之前那段起居空地（y 上限 3.05，
        // 再往上就会被茶几挡住 —— 这正是想要的效果）
        const TALL_BOUNDS = { x0: -1.65, x1: 1.65, y0: 0.42, y1: 1.55 };

        let k = 100;          // 每个世界单位多少像素
        let viewW = 390, viewH = 844;   // 最近一次取景的视口尺寸
        let camRoot = null;             // 场景根 <g>，拖动视角时平移它
        let camDX = 0, camDY = 0;       // 当前视角偏移（px）
        let ox = 0, oy = 0;   // 世界原点 (0,0,0) 的屏幕位置
        let svgEl = null;
        const obstacles = [];

        // ---------------- 投影与工具 ----------------

        function proj(wx, wy, wz) {
            return {
                x: ox + (wx + wy * C45) * k,
                y: oy - (wy * C45 + (wz || 0)) * k
            };
        }

        // 视口尺寸变了就说明该重新取景。
        // 为什么要轮询而不是只靠 resize 事件：
        //   实测在某些嵌入环境（比如 VS Code 内置浏览器、部分安卓 WebView）
        //   改变窗口尺寸并不会派发 resize，结果整个场景停留在旧尺寸上 ——
        //   画面缩在左上角，右下角一大片空白。每帧比一下宽高，代价可以忽略。
        function needsLayout() {
            return viewW !== (window.innerWidth || 390) ||
                   viewH !== (window.innerHeight || 844);
        }

        // 视角平移：只动场景根节点，不重算任何世界坐标
        function applyCam() {
            if (!camRoot) return;
            camRoot.setAttribute(
                'transform',
                'translate(' + camDX.toFixed(1) + ',' + camDY.toFixed(1) + ')');
        }

        function setCam(dx, dy) {
            // 位移有上限，避免拖太狠把墙的全貌拖出来
            camDX = Math.max(-1, Math.min(1, dx)) * (viewW * 0.030);
            camDY = Math.max(-1, Math.min(1, dy)) * (viewH * 0.022);
            applyCam();
        }

        // 当前视角偏移。管家的 DOM 元素不在 SVG 里，得自己把这个
        // 偏移加上去，否则拖动视角时房间动、机器人不动 —— 一眼就假。
        function camOffset() { return { x: camDX, y: camDY }; }

        // 按比例调亮/调暗一个 #rrggbb 颜色
        function shade(hex, f) {
            const n = parseInt(hex.slice(1), 16);
            const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
            const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
            const b = Math.min(255, Math.round((n & 255) * f));
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        function pts(list) {
            let s = '';
            for (let i = 0; i < list.length; i++) {
                s += list[i].x.toFixed(1) + ',' + list[i].y.toFixed(1) + ' ';
            }
            return s.trim();
        }
