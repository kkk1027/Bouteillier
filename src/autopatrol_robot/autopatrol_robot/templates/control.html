        function poly(list, fill, extra) {
            return '<polygon points="' + pts(list) + '" fill="' + fill + '"' +
                   (extra || '') + '/>';
        }

        // ============================================================
        // 圆角多边形（2026-11-01 重做）
        // ------------------------------------------------------------
        // 【为什么第一版那么丑 —— 根因是"全是硬角"】
        //   第一版每个面都是 <polygon> + 1px 深色描边，所有棱线一根根
        //   全露在外面，看起来像"用积木搭的纸盒"。沙发尤其惨：一张沙发
        //   由 7 个方块拼成，7 个方块 × 3 个面 × 4 个直角 = 84 个尖角。
        //   现实中的家具没有一个是纯直角的，圆角是把"廉价感"去掉的
        //   最关键一步，比换配色、加贴图都有效。
        //
        // 【做法】把每个顶点沿两条邻边各退 r，再用二次贝塞尔连起来。
        //   r 会被夹到「邻边长度的 1/2」，避免小面被圆角整个吃掉。
        // ============================================================
        function roundedPath(P, r) {
            const n = P.length;
            if (n < 3) return '';
            if (!(r > 0.2)) {
                let s = 'M';
                for (let i = 0; i < n; i++) {
                    s += (i ? 'L' : '') + P[i].x.toFixed(1) + ',' + P[i].y.toFixed(1);
                }
                return s + 'Z';
            }
            let d = '';
            for (let i = 0; i < n; i++) {
                const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n];
                const v1x = p0.x - p1.x, v1y = p0.y - p1.y;
                const v2x = p2.x - p1.x, v2y = p2.y - p1.y;
                const l1 = Math.sqrt(v1x * v1x + v1y * v1y) || 1;
                const l2 = Math.sqrt(v2x * v2x + v2y * v2y) || 1;
                const rr = Math.min(r, l1 * 0.5, l2 * 0.5);
                const ax = p1.x + (v1x / l1) * rr, ay = p1.y + (v1y / l1) * rr;
                const bx = p1.x + (v2x / l2) * rr, by = p1.y + (v2y / l2) * rr;
                d += (i === 0 ? 'M' : 'L') + ax.toFixed(1) + ',' + ay.toFixed(1) +
                     'Q' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) +
                     ' ' + bx.toFixed(1) + ',' + by.toFixed(1);
            }
            return d + 'Z';
        }

        // ============================================================
        // 一个"面" = 底色 + 光影覆盖层
        // ------------------------------------------------------------
        // 【为什么要盖一层渐变】
        //   纯平涂色块在轴测图里完全没有体积信息 —— 三个面只要颜色
        //   稍有差别就能看出形状，但看不出一块面内部的明暗过渡，
        //   于是整张图会显得"塑料片"。
        //   覆盖层用 objectBoundingBox 坐标的白/黑半透明渐变，
        //   与底色**无关**，所以同一批渐变可以被所有物体复用，
        //   不必为每个家具单独生成 defs（否则 defs 会爆炸）。
        // ============================================================
        function face(list, color, overlay, r) {
            const rad = (r === undefined) ? k * 0.05 : r;
            const d = roundedPath(list, rad);
            return '<path d="' + d + '" fill="' + color + '"/>' +
                   (overlay ? '<path d="' + d + '" fill="url(#' + overlay + ')"/>' : '');
        }

        // ============================================================
        // 圆角箱体：只画三个面
        // ------------------------------------------------------------
        // 进深轴朝右上，所以一个立方体可见的永远是
        // 「正面 + 右侧面 + 顶面」，三者投影后正好铺满轮廓、互不重叠。
        // 亮度约定（模拟天光自上而下）：
        //   顶面最亮 1.14 → 正面 0.96 → 右侧面 0.78
        // 再沿「顶面-正面」这条棱加一条细高光，物体轮廓立刻"立"起来。
        // ============================================================
        function box(x0, y0, w, d, z0, h, c, opt) {
            if (!(w > 0) || !(d > 0) || !(h > 0)) return '';
            opt = opt || {};
            const rad = (opt.r === undefined ? 0.055 : opt.r) * k;
            const x1 = x0 + w, y1 = y0 + d, z1 = z0 + h;
            const A  = proj(x0, y0, z1), B = proj(x1, y0, z1);
            const C  = proj(x1, y1, z1), D = proj(x0, y1, z1);
            const A2 = proj(x0, y0, z0), B2 = proj(x1, y0, z0);
            const C2 = proj(x1, y1, z0);

            let o = '';
            o += face([A2, B2, B, A], shade(c, 0.96), 'ogFront', rad);   // 正面
            o += face([B2, C2, C, B], shade(c, 0.78), 'ogSide',  rad);   // 右侧面
            o += face([A, B, C, D],   shade(c, 1.14), 'ogTop',   rad);   // 顶面

            // 顶面与正面交界的细高光（opt.edge === false 可关掉）
            if (opt.edge !== false) {
                const ew = Math.max(0.9, k * 0.011);
                o += '<path d="M' + A.x.toFixed(1) + ',' + A.y.toFixed(1) +
                     'L' + B.x.toFixed(1) + ',' + B.y.toFixed(1) +
                     '" fill="none" stroke="rgba(255,255,255,' +
                     (opt.edgeA === undefined ? 0.5 : opt.edgeA) + ')" ' +
                     'stroke-width="' + ew.toFixed(2) + '" stroke-linecap="round"/>';
            }
            return o;
        }

        // ============================================================
        // 落地接触阴影
        // ------------------------------------------------------------
        // 家具和地板之间如果直接"切"在一起，会像贴纸一样浮着。
        // 在物体脚下垫一个比它略大的径向渐变椭圆，物体自身会盖住中间，
        // 只有边缘那一圈透出来 —— 看起来就是环境光遮蔽（AO）。
        // 这是纯 SVG 下模拟"东西真的压在地上"最有效的一招。
        // ============================================================
        function contactShadow(it, strength) {
            const cx = it.x0 + it.w / 2, cy = it.y0 + it.d / 2;
            const p = proj(cx, cy, 0.002);
            const rx = it.w * 0.64 * k;
            const ry = Math.max(3, it.d * 0.64 * k * C45);
            return '<ellipse cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
                   '" rx="' + rx.toFixed(1) + '" ry="' + ry.toFixed(1) +
                   '" fill="url(#softContact)" opacity="' +
                   (strength === undefined ? 1 : strength) + '"/>';
        }

        // ---------------- 各类家具 ----------------

        function drawRug(it) {
            const x0 = it.x0, y0 = it.y0, x1 = x0 + it.w, y1 = y0 + it.d;
            const m = 0.15;
            const rad = k * 0.11;
            return face([proj(x0, y0, 0.010), proj(x1, y0, 0.010),
                         proj(x1, y1, 0.010), proj(x0, y1, 0.010)],
                        '#f3c49d', 'ogFloor', rad) +
                   face([proj(x0 + m, y0 + m, 0.015), proj(x1 - m, y0 + m, 0.015),
                         proj(x1 - m, y1 - m, 0.015), proj(x0 + m, y1 - m, 0.015)],
                        it.c, 'ogFloor', rad * 0.8);
        }

        // ============================================================
        // 沙发（2026-11-01 第四次重做：把扶手加回来）
        // ------------------------------------------------------------
        // 【前几版为什么都不像沙发】
        //   第 1 版 9 个方块 → 27 个面，线条糊成一团；而且靠背两端嵌进
        //     左右扶手的深度是 0.135 与 0.030，差了 4.5 倍 ——
        //     几何左右不对称，这是"透视关系差"的真正原因。
        //   第 2/3 版为了"简化"把扶手整个删掉 → 只剩一个台面加一块板，
        //     结果就是一张**床**。用户两次反馈"像床不像沙发"。
        //
        // 【关键结论】判断"这是不是沙发"，人第一眼看的不是颜色也不是
        //   造型细节，而是**两侧有没有扶手**。床没有扶手，长凳没有扶手，
        //   沙发一定有。所以扶手不能省，能省的是坐垫分块、靠枕、花纹。
        //
        // 【几何：所有部件只在 x 或 y 方向相邻，完全不重叠】
        //     左扶手  x ∈ [x0, x0+armW]       y ∈ [y0, y1]     高 armH
        //     右扶手  x ∈ [x1-armW, x1]       y ∈ [y0, y1]     高 armH
        //     靠背    x ∈ [x0+armW, x1-armW]  y ∈ [y1-backD, y1]  高 backH
        //     坐垫    x ∈ [x0+armW, x1-armW]  y ∈ [y0, y1-backD]
        //   四条边首尾相接，没有任何互相穿插 —— 投影出来是干净的
        //   "凹"字形侧影，一眼就能读成沙发。
        //
        // 【高度关系】（决定辨识度）
        //     坐面 0.40 < 扶手 0.50 < 靠背 0.72
        //   三级台阶越清晰，越像沙发；如果靠背只比坐面高一点点，
        //   就会退化成"一张带挡板的床"。
        //
        // 【朝向】靠背在后沿（y1，靠墙一侧），开口朝前（y0），
        //   正对着镜头和茶几 —— 这是客厅里最自然的摆法，
        //   也和斜二轴测的进深方向一致，不会出现"背对镜头"的别扭感。
        // ============================================================
        function drawSofa(it) {
            const x0 = it.x0, y0 = it.y0, w = it.w, d = it.d;
            const x1 = x0 + w, y1 = y0 + d;

            // ★ 尺寸整体缩一档（2026-11-01）
            //   原来扶手 0.22 宽、跨整个 0.80 进深，投影出来扶手特别厚，
            //   整张沙发显得又宽又重。现在扶手收窄到 0.17，
            //   整体高度压到 0.66，进深用 item 的 0.72。
            const legH  = 0.09;   // 细腿高度（底面透光）
            // 沙发变窄后扶手若仍是 0.17，两侧就吃掉 0.34 ——
            // 宽 1.20 的沙发坐垫只剩 0.86，视觉上"全是大扶手"。
            // 收到 0.13，坐垫保留 0.94，比例更匀称。
            const armW  = 0.13;   // 扶手宽（随整体收窄）
            const armH  = 0.44;   // 扶手顶面离地
            const backD = 0.20;   // 靠背进深（薄板，不臃肿）
            const backH = 0.64;   // 靠背顶离地（与 item.h 一致）
            const seatH = 0.36;   // 坐面离地

            const inX0 = x0 + armW, inX1 = x1 - armW;  // 扶手内侧
            const inY1 = y1 - backD;                   // 坐垫后沿

            // ★ 暖色分层（2026-11-01 用户要"配色偏暖"）
            //   原来几个面都从同一个 it.c 派生，色相几乎一样，靠明度区分，
            //   看起来偏"粉橘"。现在每个面单独给色值，
            //   色相统一压在橙—琥珀这一段（R > G > B 且 B 显著低），
            //   明度仍是"顶亮底暗"，暖调更统一：
            //     坐垫  #f8c79b   扶手  #f6b783（略深，读作"包边"）
            //     靠背  #fbd2ae（最亮，因为背板上沿吃光最多）
            //     底座  #e0a877（压暗，制造台阶）
            //     木腿  #c08b5c（暖棕，与地板同族）
            const cSeat = '#f8c79b';
            const cArm  = '#f6b783';
            const cBack = '#fbd2ae';
            const cBase = '#e0a877';
            const cLeg  = '#c08b5c';

            let o = '';

            // ① 四条细腿（内收 0.09，四条都落在轮廓内可见）
            const leg = 0.06, inset = 0.09;
            const lxs = [x0 + inset, x1 - inset - leg];
            const lys = [y0 + inset, y1 - inset - leg];
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 2; j++) {
                    o += box(lxs[i], lys[j], leg, leg, 0, legH, cLeg,
                             { r: 0.02, edge: false });
                }
            }

            // ② 底座：垫在扶手和坐垫下面（四周内收，露出一圈台阶）
            o += box(x0 + 0.02, y0 + 0.02, w - 0.04, d - 0.04,
                     legH, seatH - legH, cBase,
                     { r: 0.05, edge: false });

            // ③ 靠背（最远，先画）
            o += box(inX0, inY1, inX1 - inX0, backD, legH, backH - legH,
                     cBack, { r: 0.07 });

            // ④ 左右扶手（跨整个进深，是"这是沙发"最关键的一笔）
            o += box(x0, y0, armW, d, legH, armH - legH, cArm, { r: 0.08 });
            o += box(x1 - armW, y0, armW, d, legH, armH - legH, cArm, { r: 0.08 });

            // ⑤ 坐垫（夹在扶手之间、靠背之前；比底座略高一点点，做出层次）
            o += box(inX0 + 0.02, y0 + 0.02,
                     inX1 - inX0 - 0.04, inY1 - y0 - 0.04,
                     seatH - 0.05, 0.05, cSeat, { r: 0.05 });

            return o;
        }

        function drawTable(it) {
            const x0 = it.x0, y0 = it.y0, w = it.w, d = it.d, h = it.h;
            const topH = 0.09, t = 0.085;
            let o = '';
            // 四条细腿
            const lx = [x0 + 0.11, x0 + w - 0.11 - t];
            const ly = [y0 + 0.11, y0 + d - 0.11 - t];
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 2; j++) {
                    o += box(lx[i], ly[j], t, t, 0, h - topH, '#dcb086',
                             { r: 0.032, edge: false });
                }
            }
            // 桌面
            o += box(x0, y0, w, d, h - topH, topH, it.c, { r: 0.09 });
            // 桌上的小杯子，让"这是桌子"一眼可辨
            o += box(x0 + w * 0.28, y0 + d * 0.32, 0.15, 0.15, h, 0.13,
                     '#fff8ec', { r: 0.05 });
            return o;
        }

        function drawPlant(it) {
            const cx = it.x0 + it.w / 2, cy = it.y0 + it.d / 2;
            const potH = it.h * 0.33;
            let o = '';
            // 花盆（下窄上宽用两层叠出来）
            o += box(it.x0 + 0.06, it.y0 + 0.06, it.w - 0.12, it.d - 0.12,
                     0, potH * 0.92, shade(it.c, 0.94), { r: 0.07 });
            o += box(it.x0 + 0.03, it.y0 + 0.03, it.w - 0.06, it.d - 0.06,
                     potH * 0.86, potH * 0.16, it.c, { r: 0.07 });
            // 叶子：由深到浅、由后到前
            function leaf(dx, dy, zz, rx, ry, rot, col) {
                const p = proj(cx + dx, cy + dy, zz);
                return '<ellipse cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
                       '" rx="' + (rx * k).toFixed(1) + '" ry="' + (ry * k).toFixed(1) +
                       '" fill="' + col + '" transform="rotate(' + rot + ' ' +
                       p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')"/>';
            }
            o += leaf(-0.12, 0.04, it.h * 0.58, 0.16, 0.28, -26, '#7cb066');
            o += leaf( 0.14, 0.08, it.h * 0.54, 0.13, 0.23,  34, '#8ec078');
            o += leaf( 0.01, -0.09, it.h * 0.78, 0.12, 0.21,  -5, '#a2cd8c');
            o += leaf(-0.06, 0.01, it.h * 0.92, 0.10, 0.17,  -9, '#b9dca5');
            return o;
        }

        function drawWindow(it) {
            const x0 = it.x0, x1 = x0 + it.w;
            const yy = it.y0 + it.d;                 // 贴在最后面的墙面上
            const z0 = it.z0 || 0.6, z1 = z0 + it.h;
            // ★ 后墙是「y = 常数」的平面，在这上面 x 映射到水平、z 映射到垂直，
            //   所以矩形投影后仍然是矩形（不会被剪切）—— 直接算两个对角点即可。
            const tl = proj(x0, yy, z1);
            const br = proj(x1, yy, z0);
            const wpx = br.x - tl.x, hpx = br.y - tl.y;
            const mid = proj((x0 + x1) / 2, yy, (z0 + z1) / 2);
            const rad = Math.max(3, wpx * 0.07);

            let o = '';
            // 窗外透进来的光（房间变亮的主要来源）
            o += '<ellipse cx="' + mid.x.toFixed(1) + '" cy="' + mid.y.toFixed(1) +
                 '" rx="' + (it.w * k * 0.78).toFixed(1) +
                 '" ry="' + (it.h * k * 0.72).toFixed(1) +
                 '" fill="url(#winGlow)"/>';

            // 玻璃（圆角）
            const gd = roundedPath([
                { x: tl.x, y: tl.y },
                { x: tl.x + wpx, y: tl.y },
                { x: tl.x + wpx, y: tl.y + hpx },
                { x: tl.x, y: tl.y + hpx }
            ], rad);
            o += '<path d="' + gd + '" fill="' + it.c + '"/>';
            o += '<path d="' + gd + '" fill="url(#ogTop)"/>';

            // 窗外：太阳 + 云
            o += '<circle cx="' + (tl.x + wpx * 0.63).toFixed(1) +
                 '" cy="' + (tl.y + hpx * 0.29).toFixed(1) +
                 '" r="' + (wpx * 0.085).toFixed(1) + '" fill="#ffdf85" opacity=".9"/>';
            o += '<g fill="#fffaf1" opacity=".9">' +
                 '<ellipse cx="' + (tl.x + wpx * 0.27).toFixed(1) + '" cy="' + (tl.y + hpx * 0.35).toFixed(1) + '" rx="' + (wpx * 0.105).toFixed(1) + '" ry="' + (hpx * 0.05).toFixed(1) + '"/>' +
                 '<ellipse cx="' + (tl.x + wpx * 0.36).toFixed(1) + '" cy="' + (tl.y + hpx * 0.29).toFixed(1) + '" rx="' + (wpx * 0.07).toFixed(1) + '" ry="' + (hpx * 0.042).toFixed(1) + '"/>' +
                 '</g>';

            // 窗棂
            const mw = Math.max(2, k * 0.026);
            o += '<path d="M' + (tl.x + wpx / 2).toFixed(1) + ',' + tl.y.toFixed(1) +
                 'L' + (tl.x + wpx / 2).toFixed(1) + ',' + (tl.y + hpx).toFixed(1) +
                 'M' + tl.x.toFixed(1) + ',' + (tl.y + hpx / 2).toFixed(1) +
                 'L' + (tl.x + wpx).toFixed(1) + ',' + (tl.y + hpx / 2).toFixed(1) +
                 '" fill="none" stroke="#eedcc2" stroke-width="' + mw.toFixed(1) + '"/>';

            // 窗框（圆角，比玻璃略大一圈）
            const fw = Math.max(2.5, k * 0.032);
            o += '<path d="' + gd + '" fill="none" stroke="#efdcc0" ' +
                 'stroke-width="' + (fw * 2).toFixed(1) + '"/>';

            // 窗台
            o += '<rect x="' + (tl.x - wpx * 0.04).toFixed(1) +
                 '" y="' + (tl.y + hpx).toFixed(1) +
                 '" width="' + (wpx * 1.08).toFixed(1) +
                 '" height="' + Math.max(4, k * 0.045).toFixed(1) +
                 '" rx="' + (Math.max(2, k * 0.02)).toFixed(1) + '" fill="#f0dcbd"/>';
            return o;
        }

        // ---------------- 房间本体 ----------------

        // ============================================================
        // 把墙 / 地板画得比视口大（2026-11-01）
        // ------------------------------------------------------------
        // 用户反馈："电脑端的场景没有覆盖整个页面，墙体没有继续延伸"。
        //
        // 成因：房间是一个有限长的盒子。桌面宽屏时 k 被高度约束住，
        //   地板在屏幕上只占约 85% 宽，左右两侧就漏出背景色；
        //   墙只有 2.75 高，屏幕上墙面到顶就没了，上面同样漏。
        //
        // 对策：不再把房间当成"看得见的盒子"，而是当成"一直延伸出去"的
        //   空间 —— 地板往前（y 负方向）延伸出屏幕，后墙往右延伸出屏幕，
        //   墙往上长到屏幕之外。SVG 会自动裁掉视口外的部分，
        //   所以只需要保证"延伸得足够远"，视觉上就是无缝的。
        //
        //   ★ 左墙不能跟着地板往左延伸：它是 x = -HW 的平面，
        //     地面若越过 x = -HW，那面墙会变成一块立在房间中间的隔断。
        //     所以地板左边界严格等于 -HW，并靠 layout() 保证 -HW 在屏幕外。
        // ============================================================
        function drawRoom() {
            const HW = ROOM.w / 2, D = ROOM.d, WH = ROOM.wallH;
            const vw = viewW, vh = viewH;

            // 往右、往前、往上各延伸多少世界单位才算够
            const EXT_X = (vw / k) * 1.2 + 2;
            const EXT_Y = (vh / (C45 * k)) * 1.2 + 2;
            const xR = HW + EXT_X;          // 地板 / 后墙的右边界
            const yF = -EXT_Y;              // 地板的前边界

            let o = '';
            // 背景兜底（正常情况会被下面的几何完全盖住）
            o += '<rect x="0" y="0" width="100%" height="100%" fill="url(#wallGrad)"/>';

            // 后墙：y = D 的平面。先画，因为左墙在它前面，要压住它。
            o += face([proj(-HW, D, 0), proj(xR, D, 0),
                       proj(xR, D, WH), proj(-HW, D, WH)],
                      '#fbf2e6', 'ogFront', 0);

            // 左墙：x = -HW 的平面。往前往上延伸（y 到 yF、z 到 WH），
            // 这样它左边和上边都跑到屏幕外，不会露边。
            o += face([proj(-HW, yF, 0), proj(-HW, D, 0),
                       proj(-HW, D, WH), proj(-HW, yF, WH)],
                      '#f2e0c6', 'ogSide', 0);

            // 地板：左边界固定 -HW（与左墙贴合），右/前均延伸出屏幕
            o += face([proj(-HW, yF, 0), proj(xR, yF, 0),
                       proj(xR, D, 0), proj(-HW, D, 0)],
                      '#f7e6cb', 'ogTop', 0);

            // 地板缝：等 y 的线（平行于 x 轴）+ 等 x 的线（沿 45° 进深轴）
            // ★ 透明度按进深递减（模拟远处雾化），越靠后越淡，
            //   地板看起来才是"延伸出去"的，而不是一张网格纸。
            let g = '<g stroke="#e3c8a2" stroke-width="1" fill="none">';
            for (let y = 0; y < D; y += 0.8) {
                const a = (0.32 * (1 - (y / D) * 0.7)).toFixed(2);
                g += '<line opacity="' + a + '" x1="' + proj(-HW, y, 0).x.toFixed(1) +
                     '" y1="' + proj(-HW, y, 0).y.toFixed(1) +
                     '" x2="' + proj(xR, y, 0).x.toFixed(1) +
                     '" y2="' + proj(xR, y, 0).y.toFixed(1) + '"/>';
            }
            for (let x = -HW; x < xR; x += 0.9) {
                const a = (0.28 * (1 - (Math.abs(x) / Math.max(HW, 1)) * 0.45)).toFixed(2);
                if (parseFloat(a) <= 0) continue;
                g += '<line opacity="' + a + '" x1="' + proj(x, 0, 0).x.toFixed(1) +
                     '" y1="' + proj(x, 0, 0).y.toFixed(1) +
                     '" x2="' + proj(x, D, 0).x.toFixed(1) +
                     '" y2="' + proj(x, D, 0).y.toFixed(1) + '"/>';
            }
            g += '</g>';
            o += g;

            // ============================================================
            // 窗户投在地板上的光斑
            // ------------------------------------------------------------
            //   一整面墙都是同一个亮度，谁也不信这屋里开了盏灯。
            //   从窗户往房间里投一块梯形光斑（越远越淡），
            //   观众立刻就能读出"光从这个窗口进来"，立体感立刻就有了。
            //   成本只是一条渐变多边形，比加任何贴图都便宜。
            // ============================================================
            const win = ITEMS.filter(function (x) { return x.kind === 'window'; })[0];
            if (win) {
                const wx0 = win.x0 - 0.35, wx1 = win.x0 + win.w + 0.35;
                const yBack = win.y0, yFront = 0.55;
                o += face([proj(wx0, yFront, 0.004), proj(wx1, yFront, 0.004),
                           proj(wx1 - 0.25, yBack, 0.004),
                           proj(wx0 + 0.25, yBack, 0.004)],
                          '#fff3cd', 'ogSun', 0);
            }

            // 墙面装饰（画框 / 壁灯）
            o += drawDecor();

            // 后墙 + 左墙的踢脚线
            o += face([proj(-HW, D, 0), proj(xR, D, 0),
                       proj(xR, D, 0.13), proj(-HW, D, 0.13)], '#ecdcc0', 'ogFront', 0);
            o += face([proj(-HW, yF, 0), proj(-HW, D, 0),
                       proj(-HW, D, 0.13), proj(-HW, yF, 0.13)], '#e6d3b4', 'ogSide', 0);
            return o;
        }

        // ============================================================
        // 墙面装饰（2026-11-01）
        // ------------------------------------------------------------
        // 手机竖屏时房间只占屏幕下半部分，上半部分全是墙。
        // 光是空的墙会显得"场景太空"，所以挂两幅画 + 壁灯，
        // 让墙面也有内容。它们不可碰撞，纯装饰。
        // 后墙是 y = D 的平面，在这上面 x→水平、z→垂直，不剪切，
        // 所以直接按矩形算两个对角点即可。
        // ============================================================
        function drawDecor() {
            const D = ROOM.d;
            // ★ 把「比例」换算成世界坐标（2026-11-01）
            //   装饰定义里用的是 xf / zf / wf / hf（占半房宽 / 占墙高的比例），
            //   而墙高 wallH 每次 layout() 都会重算，所以必须在绘制时
            //   才换算 —— 提前算好存进 ITEMS 的话，换视口就过期了。
            const HW = ROOM.w / 2;

            // ★★ 关键：装饰要按「看得见的那段墙」定位，不是按 wallH。
            // ------------------------------------------------------------
            // wallH 是故意算大的（让墙顶跑到屏幕上方之外，避免露边），
            // 所以 z ∈ [0, wallH] 里只有下面一小段在屏幕上。
            // 装饰若按 wallH 的比例摆，2/3 都会在屏幕外面 —— 实测
            // zf=0.78 的画框落在了 y = -187px，完全看不见。
            //
            // 后墙上「看得见的高度」是：
            //   墙顶屏幕 y = oy − (d·cos45° + z)·k  ≥ 0
            //   ⇒  z ≤ oy/k − d·cos45°
            // 就拿这个值当 1.0 来摆装饰，无论视口多大都铺满可见墙。
            const wallVisible = Math.max(
                1.2,
                oy / k - ROOM.d * C45 - 0.15     // 再留 0.15 给踢脚线
            );

            let o = '';
            for (let i = 0; i < DECOR.length; i++) {
                const raw = DECOR[i];
                const d = {
                    kind: raw.kind,
                    x: (raw.xf === undefined ? 0 : raw.xf) * HW,
                    z: (raw.zf === undefined ? 0.3 : raw.zf) * wallVisible,
                    w: (raw.wf === undefined ? 0.16 : raw.wf) * wallVisible * 1.35,
                    h: (raw.hf === undefined ? 0.12 : raw.hf) * wallVisible * 1.35,
                    c: raw.c, art: raw.art
                };
                if (d.kind === 'frame') {
                    const tl = proj(d.x - d.w / 2, D, d.z + d.h / 2);
                    const br = proj(d.x + d.w / 2, D, d.z - d.h / 2);
                    const w = br.x - tl.x, h = br.y - tl.y;
                    const rad = Math.max(2, w * 0.06);
                    const outer = roundedPath([
                        { x: tl.x, y: tl.y }, { x: tl.x + w, y: tl.y },
                        { x: tl.x + w, y: tl.y + h }, { x: tl.x, y: tl.y + h }
                    ], rad);
                    o += '<path d="' + outer + '" fill="#f6e6cf" ' +
                         'filter="url(#softShadow)"/>';
                    const iw = w * 0.82, ih = h * 0.80;
                    const ix = tl.x + (w - iw) / 2, iy = tl.y + (h - ih) / 2;
                    const inner = roundedPath([
                        { x: ix, y: iy }, { x: ix + iw, y: iy },
                        { x: ix + iw, y: iy + ih }, { x: ix, y: iy + ih }
                    ], rad * 0.6);
                    o += '<path d="' + inner + '" fill="' + d.c + '"/>';
                    o += '<path d="M' + ix.toFixed(1) + ',' + (iy + ih * 0.82).toFixed(1) +
                         'L' + (ix + iw * 0.34).toFixed(1) + ',' + (iy + ih * 0.40).toFixed(1) +
                         'L' + (ix + iw * 0.56).toFixed(1) + ',' + (iy + ih * 0.62).toFixed(1) +
                         'L' + (ix + iw * 0.78).toFixed(1) + ',' + (iy + ih * 0.34).toFixed(1) +
                         'L' + (ix + iw).toFixed(1) + ',' + (iy + ih * 0.82).toFixed(1) +
                         'Z" fill="' + d.art + '"/>';
                    o += '<circle cx="' + (ix + iw * 0.72).toFixed(1) + '" cy="' +
                         (iy + ih * 0.26).toFixed(1) + '" r="' + (iw * 0.06).toFixed(1) +
                         '" fill="#ffcf7a"/>';
                } else if (d.kind === 'pendant') {
                    // ============================================================
                    // 吊灯（2026-11-01 重做）
                    // ------------------------------------------------------------
                    // 【问题】用户反馈"手机端的吊灯太矮了"。
                    //   原来 zf 表示「占可见墙高的比例」，0.46 就往墙的中部挂，
                    //   灯罩悬在半空 —— 但吊灯本来就该从天花板垂下来。
                    //   而且墙高 wallH 是随视口变的，用比例算出来的绝对高度
                    //   在手机上只有 1.4 米，站在地上都够得着。
                    //
                    // 【改法】对吊灯来说 zf 的含义改为「灯罩底部落在屏幕高度的
                    //   百分之几」（0 = 屏幕顶，1 = 屏幕底）。这是唯一与墙高
                    //   无关、在任意视口下都成立的定位方式：吊灯永远从画面顶部
                    //   垂下来，视觉上就是"挂在很高的天花板上"。
                    //
                    // 【尺寸】灯罩用真实物理尺寸（直径 0.52m / 高 0.30m），
                    //   不再跟着 wallVisible 比例放大缩小，否则手机会得到一个
                    //   一米多高的巨型灯罩。
                    // ============================================================
                    const py = D * 0.46;                       // 挂点在房间进深上
                    const shY = viewH * (raw.zf === undefined ? 0.22 : raw.zf);
                    // 由「想让它出现在屏幕 shY 处」反解出世界高度
                    const zShade = Math.max(
                        1.2, (oy - shY) / k - py * C45);

                    const wBot = 0.52, wTop = 0.16, hh = 0.30;
                    const top = proj(d.x, py, ROOM.wallH);      // 吊线起点（屏幕外）
                    const bot = proj(d.x, py, zShade);          // 灯罩底口

                    // 吊线
                    o += '<line x1="' + top.x.toFixed(1) + '" y1="' + top.y.toFixed(1) +
                         '" x2="' + bot.x.toFixed(1) + '" y2="' + bot.y.toFixed(1) +
                         '" stroke="#d9b48f" stroke-width="' +
                         Math.max(1, k * 0.010).toFixed(1) + '"/>';

                    // 灯罩下方的光晕（房间里主要的暖光源之一）
                    o += '<ellipse cx="' + bot.x.toFixed(1) +
                         '" cy="' + (bot.y + k * 0.16).toFixed(1) +
                         '" rx="' + (k * 0.72).toFixed(1) +
                         '" ry="' + (k * 0.72 * C45).toFixed(1) +
                         '" fill="url(#winGlow)" opacity=".85"/>';

                    // 灯罩：上窄下宽的梯形
                    const q1 = proj(d.x - wBot / 2, py, zShade);
                    const q2 = proj(d.x + wBot / 2, py, zShade);
                    const q3 = proj(d.x + wTop / 2, py, zShade + hh);
                    const q4 = proj(d.x - wTop / 2, py, zShade + hh);
                    const shade = roundedPath([q1, q2, q3, q4], Math.max(2, k * 0.022));
                    o += '<path d="' + shade + '" fill="#ffe0b0" ' +
                         'filter="url(#softShadow)"/>';
                    o += '<path d="' + shade + '" fill="url(#ogTop)"/>';
                    // 底口一圈亮边，把"发光"这件事画实
                    o += '<path d="M' + q1.x.toFixed(1) + ',' + q1.y.toFixed(1) +
                         'L' + q2.x.toFixed(1) + ',' + q2.y.toFixed(1) +
                         '" fill="none" stroke="#fff3d0" stroke-width="' +
                         Math.max(1.2, k * 0.016).toFixed(1) +
                         '" stroke-linecap="round"/>';
                } else if (d.kind === 'shelf') {
                    // 墙上的搁板 + 几件小物，用来填中段以上的空墙
                    // ★ 尺寸跟随 d.w / d.h，不再写死 —— 换视口时比例才对
                    const bw = d.w, bh = Math.max(0.06, d.h * 0.5);
                    const tl = proj(d.x - bw / 2, D, d.z + bh / 2);
                    const br = proj(d.x + bw / 2, D, d.z - bh / 2);
                    const w = br.x - tl.x, hh = br.y - tl.y;
                    o += '<rect x="' + tl.x.toFixed(1) + '" y="' + tl.y.toFixed(1) +
                         '" width="' + w.toFixed(1) + '" height="' + hh.toFixed(1) +
                         '" rx="' + (hh * 0.4).toFixed(1) + '" fill="#efdcbf" ' +
                         'filter="url(#softShadow)"/>';
                    // 搁板上的物件：两个小方块 + 一个小瓶子
                    const items = [
                        { dx: -0.38, dw: 0.13, dh: 0.24, c: '#e8705f' },
                        { dx: -0.20, dw: 0.11, dh: 0.20, c: '#7fbf7f' },
                        { dx: 0.10, dw: 0.10, dh: 0.30, c: '#f5b942' },
                        { dx: 0.34, dw: 0.16, dh: 0.16, c: '#c9d8ea' }
                    ];
                    for (let q = 0; q < items.length; q++) {
                        const it2 = items[q];
                        const bx0 = d.x + it2.dx - it2.dw / 2;
                        const p1 = proj(bx0, D, d.z + bh / 2 + it2.dh);
                        const p2 = proj(bx0 + it2.dw, D, d.z + bh / 2);
                        o += '<rect x="' + p1.x.toFixed(1) + '" y="' + p1.y.toFixed(1) +
                             '" width="' + (p2.x - p1.x).toFixed(1) +
                             '" height="' + (p2.y - p1.y).toFixed(1) +
                             '" rx="' + Math.max(1, (p2.x - p1.x) * 0.15).toFixed(1) +
                             '" fill="' + it2.c + '"/>';
                    }
                } else if (d.kind === 'sconce') {
                    const p = proj(d.x, D, d.z);
                    const r = k * 0.55;
                    o += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
                         '" r="' + r.toFixed(1) + '" fill="url(#winGlow)" opacity=".7"/>';
                    const sw = Math.max(5, k * 0.10), sh = Math.max(9, k * 0.18);
                    o += '<rect x="' + (p.x - sw / 2).toFixed(1) +
                         '" y="' + (p.y - sh * 0.35).toFixed(1) +
                         '" width="' + sw.toFixed(1) + '" height="' + sh.toFixed(1) +
                         '" rx="' + (sw * 0.4).toFixed(1) + '" fill="#f0d3a8"/>';
                }
            }
            return o;
        }

        // ---------------- 组装 ----------------

        function rebuild() {
            if (!svgEl) svgEl = document.getElementById('roomSvg');
            if (!svgEl) return;

            // 碰撞盒（世界坐标）：直接由家具的世界 AABB 得来，
            // 和画面完全一致，不会出现「看着没碰到却撞了」。
            obstacles.length = 0;
            for (let i = 0; i < ITEMS.length; i++) {
                const it = ITEMS[i];
                // ★ 地毯是铺在地上的贴花，实物机器人是直接碾过去的，
                //   把它当成障碍物纯属建模失误 —— 早期版本就因为地毯
                //   占了小半个房间，把机器人堵在出生点动弹不得。
                if (it.kind === 'rug') continue;
                obstacles.push({
                    x0: it.x0, x1: it.x0 + it.w,
                    y0: it.y0, y1: it.y0 + it.d,
                    soft: !!it.soft, name: it.name
                });
            }

            // 绘制顺序 = 画家算法：地板贴花最先，其余按进深 y 从大到小
            // （y 越大越远，先画才不会被近处物体盖住）
            const order = ITEMS.slice().sort(function (a, b) {
                const la = (a.layer === undefined ? 1 : a.layer);
                const lb = (b.layer === undefined ? 1 : b.layer);
                if (la !== lb) return la - lb;
                return b.y0 - a.y0;
            });

            let body = '';
            for (let i = 0; i < order.length; i++) {
                const it = order[i];
                let art = '';
                if (it.kind === 'rug') art = drawRug(it);
                else if (it.kind === 'sofa') art = drawSofa(it);
                else if (it.kind === 'table') art = drawTable(it);
                else if (it.kind === 'plant') art = drawPlant(it);
                else if (it.kind === 'window') art = drawWindow(it);
                if (!art) continue;

                // 地毯贴在地板上、窗户嵌在墙里 —— 这两样不加投影，
                // 加了会显得“飘在房间外面”。
                if (it.kind !== 'rug' && it.kind !== 'window') {
                    body += contactShadow(it, it.kind === 'plant' ? 0.85 : 1);
                    body += '<g filter="url(#softShadow)">' + art + '</g>';
                } else {
                    body += art;
                }
            }

            const defs =
                '<defs>' +
                  /* 墙面环境光：整体从顶部亮到底部略暖 */
                  '<radialGradient id="wallGrad" cx="50%" cy="8%" r="96%">' +
                    '<stop offset="0%" stop-color="#fffcf7"/>' +
                    '<stop offset="100%" stop-color="#f2e0c8"/>' +
                  '</radialGradient>' +
                  /* 窗户漏进来的光（椭圆光晕） */
                  '<radialGradient id="winGlow" cx="50%" cy="50%" r="50%">' +
                    '<stop offset="0%" stop-color="#ffe9b0" stop-opacity=".8"/>' +
                    '<stop offset="55%" stop-color="#ffe9b0" stop-opacity=".28"/>' +
                    '<stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>' +
                  '</radialGradient>' +
                  /* 接触阴影：物体脚下的 AO，中间深、边缘渐隐 */
                  '<radialGradient id="softContact" cx="50%" cy="50%" r="50%">' +
                    '<stop offset="0%" stop-color="#8a5f39" stop-opacity=".30"/>' +
                    '<stop offset="58%" stop-color="#8a5f39" stop-opacity=".13"/>' +
                    '<stop offset="100%" stop-color="#8a5f39" stop-opacity="0"/>' +
                  '</radialGradient>' +
                  /* ---- 面光影：用 objectBoundingBox，与底色无关，可全局复用 ---- */
                  '<linearGradient id="ogTop" x1="0" y1="0" x2=".55" y2="1">' +
                    '<stop offset="0%" stop-color="#fff" stop-opacity=".52"/>' +
                    '<stop offset="100%" stop-color="#fff" stop-opacity="0"/>' +
                  '</linearGradient>' +
                  '<linearGradient id="ogFront" x1="0" y1="0" x2="0" y2="1">' +
                    '<stop offset="0%" stop-color="#fff" stop-opacity=".26"/>' +
                    '<stop offset="42%" stop-color="#fff" stop-opacity="0"/>' +
                    '<stop offset="100%" stop-color="#000" stop-opacity=".10"/>' +
                  '</linearGradient>' +
                  '<linearGradient id="ogSide" x1="0" y1="0" x2="1" y2=".35">' +
                    '<stop offset="0%" stop-color="#000" stop-opacity=".17"/>' +
                    '<stop offset="100%" stop-color="#000" stop-opacity="0"/>' +
                  '</linearGradient>' +
                  '<linearGradient id="ogFloor" x1="0" y1="0" x2=".4" y2="1">' +
                    '<stop offset="0%" stop-color="#fff" stop-opacity=".20"/>' +
                    '<stop offset="100%" stop-color="#fff" stop-opacity="0"/>' +
                  '</linearGradient>' +
                  /* 窗户投在地板上的光斑：从窗口往房间内渐隐 */
                  '<linearGradient id="ogSun" x1="0" y1="0" x2=".12" y2="1">' +
                    '<stop offset="0%" stop-color="#fff3cd" stop-opacity=".62"/>' +
                    '<stop offset="45%" stop-color="#fff3cd" stop-opacity=".28"/>' +
                    '<stop offset="100%" stop-color="#fff3cd" stop-opacity="0"/>' +
                  '</linearGradient>' +
                  /* 整件家具的软投影（比逐个面画阴影便宜得多，且不会互相叠加变脏） */
                  '<filter id="softShadow" x="-45%" y="-45%" width="190%" height="190%">' +
                    '<feDropShadow dx="0" dy="' + (k * 0.045).toFixed(1) + '" ' +
                                   'stdDeviation="' + (k * 0.05).toFixed(1) + '" ' +
                                   'flood-color="#8a5f39" flood-opacity="0.15"/>' +
                  '</filter>' +
                '</defs>';

            // ★ 整幅场景包在一个 <g> 里：拖动视角时只平移这一层，
            //   不必重算任何坐标（墙和地板都已经画到屏幕外，平移不会露边）。
            svgEl.innerHTML = defs + '<g id="camRoot">' +
                             drawRoom() + body + '</g>';
            camRoot = svgEl.querySelector('#camRoot');
            if (camRoot && camDX) applyCam();
        }

        // ============================================================
        // 取景（2026-11-01 重写）
        // ------------------------------------------------------------
        // 三个目标同时满足：
        //   1) 整个可行走区域必须留在屏幕内（机器人不能走出画面）；
        //   2) 竖屏不许留大片空白；
        //   3) 墙要一直延伸到屏幕外（否则宽屏两侧会露背景）。
        //
        // 关键约束（斜二轴测特有）：
        //   行走区域的屏幕跨度 = (Δx + Δy·cos45°)·k
        //   因为沿进深走时，屏幕上同时往右也往上 —— 房间越深，
        //   要装下它需要的横向像素就越多。这是竖屏取景的真正瓶颈。
        //   所以先从这条约束反推 k 的上限，再和"想放多大"取小。
        // ============================================================
        function layout() {
            const vw = window.innerWidth || 390;
            const vh = window.innerHeight || 844;
            viewW = vw;
            viewH = vh;

            // ---- 1. 选布局 ----
            // 竖屏（含方屏）用紧凑户型，横屏用宽厅。
            const portrait = vh > vw * 1.04;
            const preset = portrait
                ? { w: 4.4, d: 3.0, items: TALL_ITEMS, decor: TALL_DECOR, b: TALL_BOUNDS }
                : { w: 7.2, d: 3.0, items: WIDE_ITEMS, decor: WIDE_DECOR, b: WIDE_BOUNDS };

            ROOM.w = preset.w;
            ROOM.d = preset.d;
            ITEMS = preset.items;
            DECOR = preset.decor;
            BOUNDS.x0 = preset.b.x0; BOUNDS.x1 = preset.b.x1;
            BOUNDS.y0 = preset.b.y0; BOUNDS.y1 = preset.b.y1;

            const spanW = ROOM.w + ROOM.d * C45;
            const spanH = ROOM.d * C45;

            // ============================================================
            // 2. 由「目标构图比例」反推缩放 k（2026-11-01 重写）
            // ------------------------------------------------------------
            // 用户要求："家具、背后的墙体、地板要均匀分布"。
            //
            // 旧做法是用一堆试出来的倍数（1.45 / 1.62 / 2.35…），
            // 每换一个视口比例就崩一次，只能反复手调。现在直接解方程：
            //
            //   屏幕上，从「后墙脚那条线」到屏幕底部，全是地板：
            //       地板高 = d·cos45°·k + (H − oy)
            //   令它恰好等于 F_FLOOR·H，反解出 k：
            //       k = (F_FLOOR − (1 − oyFrac)) · H / (d·cos45°)
            //
            //   k 一旦定死，家具大小也就定了（家具高 = 实物高 × k）。
            //   所以这个式子同时钉住了「地板占比」和「家具大小」，
            //   换任何视口都自动保持同一套构图。
            //
            //   ★ 但要注意：地板大小 与 家具大小 的**比例**只由进深 d 决定
            //     （地板高/家具高 = d·cos45°/实物高，k 会被约掉）。
            //     想两者都满意，只能连 d 一起改 —— 这就是为什么
            //     家具清单里的进深从 4.4 压到了 3.0。
            // ============================================================
            const F_FLOOR = 0.42;      // 地板目标占屏高
            const oyFrac  = 0.965;     // 地板前沿落在屏幕 96.5% 处
            const kFloor = (F_FLOOR - (1 - oyFrac)) * vh / (ROOM.d * C45);

            // ---- 3. 上限：放大到还能走得动为止 ----
            //   屏幕上能装下的行走宽度 = vw/k − Δy·cos45°
            //   于是"至少留 MIN_WALK"给出 k 的上限：
            //     k ≤ vw / (MIN_WALK + Δy·cos45°)
            const MIN_WALK = 1.20;
            const dy = BOUNDS.y1 - BOUNDS.y0;
            const kMaxWalk = vw / (MIN_WALK + dy * C45);

            // ---- 3b. 内容自适应：家具不要被裁得太狠 ----
            // 上面两个约束只管"地板占比"和"走得动"，都没管**家具总宽度**。
            // 竖屏放大到 k=159 时，家具横向跨度 4.23 世界单位 →
            // 屏幕上要 674px，而屏幕只有 414px：盆栽只剩 13% 可见，
            // 等于白摆。所以再加一道上限：
            //     k ≤ vw / (内容跨度 × 0.80)
            // 0.80 表示允许两侧合计约 20% 的溢出（用户明确允许裁减），
            // 但保证每件家具至少能看到大半。
            let uSpanMin = Infinity, uSpanMax = -Infinity;
            for (let i = 0; i < ITEMS.length; i++) {
                const it = ITEMS[i];
                const a0 = it.x0 + it.y0 * C45;
                const a1 = (it.x0 + it.w) + (it.y0 + it.d) * C45;
                if (a0 < uSpanMin) uSpanMin = a0;
                if (a1 > uSpanMax) uSpanMax = a1;
            }
            const uSpan = Math.max(1, uSpanMax - uSpanMin);
            const kFitContent = vw / (uSpan * 0.80);

            k = Math.max(26, Math.min(kFloor, kMaxWalk, kFitContent, 340));
            // 兜底：房间总宽至少要铺满屏幕（墙会延伸，不会露边，
            // 但太窄会让整个房间缩在中间）
            if (spanW * k < vw * 1.02) k = Math.max(k, (vw * 1.02) / spanW);

            // ---- 4. 取景原点：按「家具内容」居中 ----
            // ★ 为什么不再用"地板中心"或"行走区中点"（都被实测打回过）：
            //   · 按地板中心 → 进深把画面往右推，机器人能走的那块偏到右边；
            //   · 按行走区中点 → 放得大时后墙那排家具整体被推出屏幕右侧，
            //     连墙都看不见，沙发看着像悬空。
            //   现在直接算所有家具在屏幕上的横向范围，把它居中。
            //   这样无论怎么缩放，看得见的一定是"有东西的那部分"。
            let uMin = Infinity, uMax = -Infinity;
            for (let i = 0; i < ITEMS.length; i++) {
                const it = ITEMS[i];
                const u0 = it.x0 + it.y0 * C45;
                const u1 = (it.x0 + it.w) + (it.y0 + it.d) * C45;
                if (u0 < uMin) uMin = u0;
                if (u1 > uMax) uMax = u1;
            }
            // ★ 只按家具居中，不把行走区算进来。
            //   行走区的 u 跨度比家具还宽（前左角到后右角），
            //   把它算进去会把整幅画面推偏，结果两边各裁掉一大块。
            //   行走区由下面第 4b 步钳进可见范围即可。
            ox = vw * 0.5 - ((uMin + uMax) * 0.5) * k;

            // 兜一道：左墙 x=-HW 必须落在屏幕左边界之外，
            // 否则会露出"房间外面"的一条空白。
            const leftWallX = ox - (ROOM.w / 2) * k;
            if (leftWallX > 0) ox -= leftWallX + 2;

            // oy：地板前沿（y=0）落在屏幕 96.5% 处。
            // 留 3.5% 是因为地板往后（屏幕上往下）还继续延伸，
            // 前沿贴着底边即可，不用留大片空白。
            oy = vh * oyFrac;

            // ---- 4b. 把可行走范围收进真正看得到的区域 ----
            // 屏幕可视的世界 x 区间随 y 变化（进深越大越偏右），
            // 所以取"最靠前的下界"和"最靠后的上界"的交集。
            const vxMin = -ox / k - BOUNDS.y0 * C45;
            const vxMax = (vw - ox) / k - BOUNDS.y1 * C45;
            const pad = 0.12;
            const nx0 = Math.max(BOUNDS.x0, vxMin + pad);
            const nx1 = Math.min(BOUNDS.x1, vxMax - pad);
            if (nx1 - nx0 > 0.5) { BOUNDS.x0 = nx0; BOUNDS.x1 = nx1; }

            // ---- 5. 墙高自适应：保证墙顶跑出屏幕上边缘 ----
            // ★ 这里踩过一次坑：墙在屏幕上是平行四边形，它的"顶边"是
            //   一条从左下到右上的斜线。要让整条斜线都在屏幕上方，
            //   约束的是**近端**那个角（x = -HW, y = 0），不是远端角：
            //     近端角屏幕 y = oy − wallH·k  ≤ 0  →  wallH ≥ oy/k
            //   一开始按远端角算（oy/k − d·cos45°），结果远端的墙确实
            //   顶到屏幕外了，但左上角仍露出一块背景 —— 正是用户反馈的
            //   "墙体没有继续延伸"。
            const needWH = oy / k;
            ROOM.wallH = Math.max(2.75, needWH + 0.6);

            rebuild();
        }

        // 机器人基准图 120x172，折成世界高度约 1.45 单位
        function botScale() {
            const s = (1.45 * k) / 172;
            return Math.max(0.40, Math.min(s, 1.0));
        }

        return {
            proj: proj,
            layout: layout,
            botScale: botScale,
            setCam: setCam,
            camOffset: camOffset,
            needsLayout: needsLayout,
            obstacles: obstacles,
            bounds: BOUNDS,
            room: ROOM,
            getItems: function () { return ITEMS; }
        };
    })();

    // ============================================================
    // 管家机器人（纯 CSS 部件 + 动作系统）
    // ------------------------------------------------------------
    // 职责分三层：
    //   1) 移动层  —— 世界坐标 (x, y) + 每帧投影到屏幕
    //   2) 动作层  —— play(name) 给 .butler-unit 加 is-xxx 类
    //   3) 说话层  —— say(text) 头顶气泡
    //
    // 谁来驱动：
    //   * 本地待机轮换（默认，0 成本，不调 LLM）
    //   * 用户发消息 → 认可 → 思考；收到回复 → 开心
    //   * 后端 AI 主动调 butler_action 工具（socket 推送）→ 覆盖执行
    //   * 撞到家具 → 偶尔摔倒；电量 < 10% → 散架
    // ============================================================
    const Butler = (function () {
        const ACTIONS = [
            'idle', 'happy', 'approve', 'deny', 'think', 'scratch',
            'wave', 'listen', 'fall', 'bump', 'wine',
        ];
        // 待机时可以随机抽到的动作（idle 除外）
        const IDLE_POOL = ['happy', 'think', 'scratch', 'deny', 'wave', 'listen', 'wine'];

        const BOT_W = 120;        // 基准图宽
        const BOT_H = 172;        // 基准图高
        const SPEED = 0.95;       // 每秒走多少世界单位
        const RADIUS = 0.30;      // 机器人碰撞半径
        const LOW_BATTERY = 10;   // 低于这个电量就散架

        let stage = null, unit = null, bubble = null, ouch = null;
        let scaleEl = null;
        let ready = false;

        let actionTimer = null;
        let bubbleTimer = null;
        let idleTimer = null;
        let ouchTimer = null;
        let busyUntil = 0;

        // ---- 世界状态 ----
        // ★ 出生点不再写死坐标（2026-11-01 已被打回两次）
        //   写死 (0, 1.15) 时，只要家具一挪位置，这个点就可能落进
        //   某件家具的碰撞盒 —— 机器人一出生就卡住，表现为"完全不动"。
        //   （实际发生过：茶几挪到 y0=1.30 后，其碰撞范围扩到 y≥1.00，
        //     正好把 (0,1.15) 圈了进去。）
        //   现在改成：在可行走范围里从前往后扫，取第一个空位。
        let bx = null, by = null;
        let tgtX = bx, tgtY = by;     // 目标世界坐标
        let walking = false;
        let rafId = null, lastTs = 0;
        let ghostTick = 0;

        // ---- 摔倒节流：撞 3~5 次才摔 1 次 ----
        let hitsSinceFall = 0;
        let fallEvery = 3 + Math.floor(Math.random() * 3);

        // ---- 电量 ----
        let broken = false;           // 散架后不再做任何待机动作

        const OUCH_LINES = [
            '哎哟！', '别打啦！', '我做错什么了…', '疼疼疼！',
            '抗议暴力！', '再打我要涨价了', '呜…', '手下留情！',
        ];

        const FALL_LINES = [
            '哎——呀！', '撞到啦…', '我的腰！', '这桌子怎么在这儿…',
            '扶我一把…', '眼冒金星…',
        ];

        const GREETINGS = [
            '需要我做什么吗？',
            '我在呢～',
            '随时听候差遣',
            '要四处看看吗？',
            '房间已经就绪啦',
        ];

        function $(id) { return document.getElementById(id); }

        // ---------------- 初始化 ----------------

        function init() {
            stage = $('butlerStage');
            unit = $('butlerUnit');
            bubble = $('butlerBubble');
            ouch = $('butlerOuch');
            if (!stage || !unit) return false;
            scaleEl = stage.querySelector('.butler-scale');
            ready = true;

            window.addEventListener('resize', function () {
                World.layout();
                render();
            });

            // 点机器人 = 打它一下
            unit.addEventListener('pointerdown', function (e) {
                e.stopPropagation();
                hit();
            });
            unit.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });

            BatteryBus.subs.push(onBattery);

            render();
            startLoop();
            return true;
        }

        // ---------------- 位置与投影 ----------------

        function render() {
            if (!stage) return;
            // 首次渲染 / 换户型后还没有合法坐标 → 先安置到一个空位
            if (bx === null || by === null) {
                const sp = findFreeSpot();
                bx = sp.x; by = sp.y;
                tgtX = bx; tgtY = by;
                walking = false;
            }
            // ★ 取景变化（旋转屏幕 / 改窗口大小）时会重算可行走范围，
            //   机器人可能正好落在新范围之外。此时 firstHit 会把四周
            //   都判成"墙"，它一步也走不动 —— 表现为卡死在原地。
            //   这里每帧软钳一下，越界就拉回最近的有效位置。
            const BB = World.bounds;
            if (bx < BB.x0 || bx > BB.x1 || by < BB.y0 || by > BB.y1) {
                bx = Math.max(BB.x0, Math.min(BB.x1, bx));
                by = Math.max(BB.y0, Math.min(BB.y1, by));
                walking = false;
            }
            // ★ 卡在家具里就挪到最近的空位（2026-11-01）
            //   横竖屏切换会换一整套户型（家具位置全变），机器人还停在
            //   旧户型的坐标上 —— 那个点在新户型里可能正好在茶几内部。
            //   firstHit 对它恒为真，于是每一帧都是"撞到 → 停住"，
            //   表现为疯狂撞墙、一步也走不动。这里主动把它挪出来。
            if (firstHit(bx, by)) {
                let moved = false;
                for (let r = 0.15; r <= 3.2 && !moved; r += 0.15) {
                    for (let a = 0; a < 16; a++) {
                        const th = a / 16 * Math.PI * 2;
                        const nx = bx + Math.cos(th) * r;
                        const ny = by + Math.sin(th) * r;
                        if (!firstHit(nx, ny)) {
                            bx = nx; by = ny;
                            walking = false;
                            tgtX = nx; tgtY = ny;
                            moved = true;
                            break;
                        }
                    }
                }
                if (!moved) {
                    const sp = findFreeSpot();
                    bx = sp.x; by = sp.y; walking = false;
                    tgtX = bx; tgtY = by;
                }
            }
            const sc = World.botScale();
            const feet = World.proj(bx, by, 0);
            // ★ 必须叠加视角偏移（2026-11-01）
            //   场景是 SVG 里的 <g id="camRoot">，随视角平移；
            //   而机器人的 .butler-stage 是 SVG 之外的 DOM 元素，
            //   坐标是屏幕绝对坐标 —— 不补上这个偏移，拖动视角时
            //   就会出现"房间在动、机器人钉在原地"的穿帮。
            //   两者用的是同一份 camDX/camDY，所以永远严格同步。
            const cam = World.camOffset();
            // 缩放原点在 50% 100%（脚底中心），所以缩放不会移动这个点
            stage.style.transform =
                'translate3d(' + (feet.x - BOT_W / 2 + cam.x).toFixed(1) + 'px,' +
                                 (feet.y - BOT_H + cam.y).toFixed(1) + 'px,0)';
            if (scaleEl) {
                scaleEl.style.transform = 'scale(' + sc.toFixed(3) + ')';
            }
        }

        function startLoop() {
            if (rafId !== null) return;
            lastTs = 0;
            rafId = requestAnimationFrame(loop);
        }

        function stopLoop() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        function loop(ts) {
            rafId = requestAnimationFrame(loop);
            if (!lastTs) lastTs = ts;
            let dt = (ts - lastTs) / 1000;
            lastTs = ts;
            // 标签页切回来时 dt 会很大，夹住避免"瞬移穿过家具"
            if (dt > 0.10) dt = 0.10;
            if (dt <= 0) return;

            // 视口尺寸变了就立刻重新取景（见 World.needsLayout 的说明）
            if (World.needsLayout()) {
                World.layout();
                render();
            }

            if (walking && !broken) stepMove(dt);
            render();

            // 遮挡检测比较贵，每 6 帧做一次（约 10Hz）足够
            if (++ghostTick % 6 === 0) updateGhost();
        }

        // 返回该世界坐标点上的碰撞体；没有则返回 null
        function firstHit(x, y) {
            const B = World.bounds;
            if (x < B.x0 || x > B.x1 || y < B.y0 || y > B.y1) {
                return { name: '墙', soft: false };
            }
            const obs = World.obstacles;
            for (let i = 0; i < obs.length; i++) {
                const o = obs[i];
                if (x > o.x0 - RADIUS && x < o.x1 + RADIUS &&
                    y > o.y0 - RADIUS && y < o.y1 + RADIUS) {
                    return o;
                }
            }
            return null;
        }

        function stepMove(dt) {
            const dx = tgtX - bx, dy = tgtY - by;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 0.035) { stopWalk(); return; }

            const v = Math.min(SPEED * dt, dist);
            // 复合运动：x 与 y 同时推进，屏幕上就是一条任意方向的斜线
            const nx = bx + (dx / dist) * v;
            const ny = by + (dy / dist) * v;

            const hit = firstHit(nx, ny);
            if (hit) {
                // 物理隔离：撞到就停住，不再前进
                stopWalk();
                onCollide(hit);
                return;
            }
            bx = nx;
            by = ny;
        }

        function stopWalk() {
            walking = false;
            if (unit) {
                unit.classList.remove('is-walking');
                unit.classList.remove('walk-right');
            }
        }

        // ---------------- 动作 ----------------

        function play(name, holdMs) {
            if (!ready) return;
            if (broken && name !== 'idle') return;   // 散架了不响应任何动作
            if (ACTIONS.indexOf(name) < 0) name = 'idle';
            clearTimeout(actionTimer);
            // 一次只留一个动作类，避免「点头 + 挥手」这种矛盾叠加
            ACTIONS.forEach(function (a) {
                if (a !== 'idle') unit.classList.remove('is-' + a);
            });
            if (name !== 'idle') {
                // 重新触发同一个动画：先摘掉类、强制重排、再加回来
                void unit.offsetWidth;
                unit.classList.add('is-' + name);
            }
            const dur = holdMs || 1800;
            busyUntil = Date.now() + dur;
            actionTimer = setTimeout(function () {
                if (!ready) return;
                ACTIONS.forEach(function (a) {
                    if (a !== 'idle') unit.classList.remove('is-' + a);
                });
            }, dur);
        }

        function say(text, holdMs) {
            if (!ready || !bubble) return;
            clearTimeout(bubbleTimer);
            if (!text) {
                bubble.classList.remove('is-show');
                return;
            }
            bubble.textContent = text;
            bubble.classList.add('is-show');
            bubbleTimer = setTimeout(function () {
                if (bubble) bubble.classList.remove('is-show');
            }, holdMs || 4200);
        }

        // ---------------- 走动 ----------------

        // 找一个确定的空位当出生点：先从最靠前的一条带子里找，
        // 找不到再逐层往后推。比随机搜索更可靠（随机搜可能返回 null）。
        function findFreeSpot() {
            const B = World.bounds;
            // 从前往后（y 从小到大）、从左往右扫一遍
            for (let yy = B.y0 + 0.05; yy <= B.y1; yy += 0.12) {
                for (let xx = B.x0 + 0.05; xx <= B.x1; xx += 0.12) {
                    if (!firstHit(xx, yy)) return { x: xx, y: yy };
                }
            }
            // 理论上到不了这里；退一步给个中点，由 render() 的自愈兜底
            return { x: (B.x0 + B.x1) / 2, y: (B.y0 + B.y1) / 2 };
        }

        // 在可达范围里随机找一个不撞家具的点
        // ------------------------------------------------------------
        // ★ 为什么要有「故意挑一条会被挡住的路线」：
        //   如果每次都只挑直线走得通的点，机器人永远撞不到任何家具，
        //   「撞到 → 摔倒」这套动作就再也不会被看到 —— 功能等于没做。
        //   所以留 30% 的概率故意选一条半路会被挡住的路线：
        //   走过去、被挡停、触发一次轻撞（bump），累计 3~5 次才摔一次。
        function pickTarget() {
            const B = World.bounds;
            const wantBump = Math.random() < 0.30;
            let clearPick = null, blockedPick = null;

            for (let i = 0; i < 40; i++) {
                const x = B.x0 + Math.random() * (B.x1 - B.x0);
                const y = B.y0 + Math.random() * (B.y1 - B.y0);
                if (firstHit(x, y)) continue;              // 目标点本身在家具里
                if (pathClear(x, y)) {
                    if (!clearPick) clearPick = { x: x, y: y };
                    if (!wantBump) return { x: x, y: y };  // 想走顺路，立刻采用
                } else if (!blockedPick) {
                    blockedPick = { x: x, y: y };
                }
            }
            if (wantBump) return blockedPick || clearPick;
            return clearPick || blockedPick;
        }

        // 沿直线采样，检查从当前位置走到 (x1,y1) 中途是否会被家具挡住
        function pathClear(x1, y1) {
            const dx = x1 - bx, dy = y1 - by;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const steps = Math.max(2, Math.ceil(dist / 0.10));
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                if (firstHit(bx + dx * t, by + dy * t)) return false;
            }
            return true;
        }

        function walkOnce() {
            if (!ready || document.hidden || broken) return;
            const t = pickTarget();
            if (!t) return;
            if (Math.abs(t.x - bx) + Math.abs(t.y - by) < 0.55) return;  // 太近不值得走

            // 屏幕上的水平方向决定速度线朝向
            const screenDx = (t.x - bx) + (t.y - by) * Math.SQRT1_2;
            unit.classList.toggle('walk-right', screenDx > 0);
            unit.classList.add('is-walking');
            tgtX = t.x;
            tgtY = t.y;
            walking = true;
            // ★ 这里不要设 busyUntil：走路是否结束由 walking 标志决定。
            //   设了反而会在被中途挡停后留下一个很远的"忙"时间戳，
            //   把后面一串待机动作全部压掉。
        }

        // ---------------- 碰撞 → 摔倒 ----------------

        function onCollide(o) {
            busyUntil = Date.now() + 1500;
            // 地毯、窗户是软障碍：能挡住但不算"撞疼了"
            if (o && o.soft) { play('bump', 620); return; }

            hitsSinceFall++;
            if (hitsSinceFall >= fallEvery) {
                hitsSinceFall = 0;
                fallEvery = 3 + Math.floor(Math.random() * 3);
                doFall();
            } else {
                play('bump', 620);
            }
        }

        function doFall() {
            play('fall', 2100);
            busyUntil = Date.now() + 2500;
            say(FALL_LINES[Math.floor(Math.random() * FALL_LINES.length)], 2300);
        }

        // 点一下 = 打它（夸张动画 + 吐槽台词）
        function hit() {
            if (!ready || broken) return;
            unit.classList.remove('is-hit');
            void unit.offsetWidth;
            unit.classList.add('is-hit');

            if (ouch) {
                clearTimeout(ouchTimer);
                ouch.textContent = OUCH_LINES[
                    Math.floor(Math.random() * OUCH_LINES.length)];
                ouch.classList.add('is-show');
                ouchTimer = setTimeout(function () {
                    if (ouch) ouch.classList.remove('is-show');
                }, 1500);
            }

            busyUntil = Date.now() + 1000;
            clearTimeout(actionTimer);
            actionTimer = setTimeout(function () {
                if (!ready) return;
                unit.classList.remove('is-hit');
            }, 980);
        }

        // ---------------- 遮挡保护 ----------------

        // 机器人 z-index 高于对话（否则点不到），所以走动时可能盖住气泡。
        // 一旦重叠就整体降到 34% 不透明度 + 轻微模糊，气泡内容仍清晰可读。
        function updateGhost() {
            if (!stage || !unit || !ready) return;
            const r = unit.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) return;

            let overlap = false;
            const nodes = document.querySelectorAll('.msg-bubble');
            for (let i = 0; i < nodes.length; i++) {
                const b = nodes[i].getBoundingClientRect();
                if (b.width === 0 || b.height === 0) continue;
                if (b.bottom < 0 || b.top > window.innerHeight) continue;
                if (r.left < b.right && r.right > b.left &&
                    r.top < b.bottom && r.bottom > b.top) {
                    overlap = true;
                    break;
                }
            }
            stage.classList.toggle('is-ghost', overlap);
        }

        // ---------------- 低电量散架 ----------------

        function onBattery(pct) {
            if (pct === null || pct === undefined) return;
            const p = Number(pct);
            if (!isFinite(p)) return;
            if (p < LOW_BATTERY && !broken) collapse();
            else if (p >= LOW_BATTERY && broken) recover();
        }

        function collapse() {
            broken = true;
            stopWalk();
            clearTimeout(idleTimer);
            clearTimeout(actionTimer);
            if (bubble) bubble.classList.remove('is-show');
            ACTIONS.forEach(function (a) {
                if (a !== 'idle') unit.classList.remove('is-' + a);
            });
            void unit.offsetWidth;
            unit.classList.add('is-collapse');
            setTimeout(function () {
                if (!unit) return;
                unit.classList.remove('is-collapse');
                unit.classList.add('is-broken');
            }, 1150);
            busyUntil = Date.now() + 3600000;   // 无限期不做事
            say('没电了…我先散一会儿…', 4600);
        }

        function recover() {
            if (!broken) return;
            broken = false;
            unit.classList.remove('is-broken', 'is-collapse');
            void unit.offsetWidth;
            busyUntil = Date.now() + 1400;
            unit.classList.add('is-approve');
            setTimeout(function () {
                if (unit) unit.classList.remove('is-approve');
            }, 1300);
            say('电量回来了，组装完成！', 3600);
            scheduleIdle();
        }

        // ---------------- 待机轮换 ----------------

        function scheduleIdle() {
            clearTimeout(idleTimer);
            // 2026-11-01 用户要求「略微提高待机动作的执行频率」：
            // 原来是 5.2~10.4s，现在 3.6~6.8s，观感更"活"但不至于手忙脚乱。
            const delay = 3600 + Math.random() * 3200;
            idleTimer = setTimeout(function () {
                if (!ready || document.hidden) { scheduleIdle(); return; }
                if (broken) { scheduleIdle(); return; }
                if (walking) { scheduleIdle(); return; }        // 别打断走路
                if (Date.now() < busyUntil) { scheduleIdle(); return; }

                const roll = Math.random();
                if (roll < 0.40) {
                    walkOnce();
                } else if (roll < 0.93) {
                    const act = IDLE_POOL[Math.floor(Math.random() * IDLE_POOL.length)];
                    // 倒红酒是个长动作（取出→倒→摇→放回），停留要久一点
                    play(act, act === 'wine' ? 4700 : 1500 + Math.random() * 700);
                } else {
                    play('wave', 2200);
                    say(GREETINGS[Math.floor(Math.random() * GREETINGS.length)], 3800);
                }
                scheduleIdle();
            }, delay);
        }

        function start() {
            if (!ready) return;
            stop();
            // 上一轮可能留下一个很远的"忙"时间戳（比如散架时设了 1 小时），
            // 不清掉的话 start() 之后所有待机动作都会被压掉。
            if (!broken) busyUntil = 0;
            render();
            scheduleIdle();
            setTimeout(function () {
                if (!ready || broken) return;
                play('wave', 2400);
                say('我是管家 Bouteiller', 3800);
            }, 900);
        }

        function stop() {
            clearTimeout(idleTimer);
            clearTimeout(actionTimer);
            clearTimeout(bubbleTimer);
            clearTimeout(ouchTimer);
            idleTimer = actionTimer = bubbleTimer = ouchTimer = null;
            stopWalk();
            if (bubble) bubble.classList.remove('is-show');
            if (ouch) ouch.classList.remove('is-show');
            if (unit) {
                ACTIONS.forEach(function (a) {
                    if (a !== 'idle') unit.classList.remove('is-' + a);
                });
                unit.classList.remove('is-walking');
                unit.classList.remove('walk-right');
                unit.classList.remove('is-hit');
            }
        }

        // ---- 对话联动：用户说话 → 认可 → 思考；得到回复 → 开心 ----
        function onUserSpeak() {
            if (!ready || broken) return;
            play('approve', 700);
            setTimeout(function () {
                // 700ms 后已经点头完了，接着摆出思考姿势等回复
                if (ready && !broken) play('think', 12000);
            }, 720);
            say('', 0);
        }

        function onBotReply(text) {
            if (!ready || broken) return;
            play('happy', 1500);
            // 从回复里挑一句短话当气泡，太长就不显示（避免遮住对话区）
            const t = (text || '').replace(/\s+/g, ' ').trim();
            if (t && t.length <= 22) say(t, 4200);
            else say('', 0);
        }

        function onBotError() {
            if (!ready || broken) return;
            play('deny', 1600);
            say('好像不太顺利…', 3600);
        }

        // ---- 供后端 AI 工具调用 ----
        function remote(action, text) {
            if (!ready) return;
            // AI 显式要求时，即使散架也允许它"被修好"再表演
            if (broken && action && action !== 'idle') recover();
            play(action || 'idle', 2200);
            if (text) say(text, 4600);
        }

        return {
            init: init, start: start, stop: stop,
            play: play, say: say, hit: hit,
            onUserSpeak: onUserSpeak,
            onBotReply: onBotReply,
            onBotError: onBotError,
            remote: remote,
            setBattery: onBattery,
            isBroken: function () { return broken; },
        };
    })();

    // ==================== 初始化 ====================
    function init() {
        initJoystick();
        
        linearSpeedSlider.addEventListener('input', () => {
            maxLinearSpeed = parseFloat(linearSpeedSlider.value);
            linearValue.textContent = maxLinearSpeed.toFixed(2);
        });
        angularSpeedSlider.addEventListener('input', () => {
            angularValue.textContent = parseFloat(angularSpeedSlider.value).toFixed(2);
        });
        
        // 统一绑定按钮事件（click + touchstart 防重复）
        const bindButton = (id, handler) => {
            const el = document.getElementById(id);
            if (!el) return;
            const wrapped = (e) => {
                e.preventDefault();
                handler(e);
            };
            el.addEventListener('click', wrapped);
            el.addEventListener('touchstart', wrapped, { passive: false });
        };
        
        // 主页入口（连接成功后才进入操作页）
        bindButton('btnStart', connectRobot);
        // 设置抽屉里的两个动作
        bindButton('force-cleanup', forceCleanup);
        bindButton('soft-reboot', softReboot);

        bindButton('load-map', loadMap);
        bindButton('close-map', closeMap);
        bindButton('toggleCameraBtn', () => cameraActive ? stopCamera() : startCamera());
        bindButton('sendChatBtn', sendChatMessage);

        // 注意：清空对话与快捷指令改由 initCmdList() 的 pointer 事件统一处理，
        // 这里不能再 bind，否则同一次点击会执行两遍。
        
        // 输入框特殊处理：确保获得焦点
        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            // 延迟 focus 确保键盘弹出
            setTimeout(() => chatInput.focus(), 10);
        }, { passive: false });
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        // ---- 浮层组件 ----
        initWidgetDrag();
        bindWidgetButtons();
        initComposerGestures();
        syncPhraseActive();

        // ---- 新交互模块 ----
        initParallax();
        initOrbSystem();
        initWidgetResize();
        initSettingsDock();
        initGestureLock();

        // ★ 2026-11-01：先把斜二轴测世界算出来，机器人才能知道
        //   桌子/沙发在哪、自己该站在哪。顺序不能反 —— Butler.init()
        //   里会立刻投影一次自己的初始位置。
        World.layout();
        Butler.init();

        // 定位条默认先显示「定位未启动」，不用等 /localization_status
        renderLocStatus(null);

        // 窗口尺寸变化：房间要重新按新的 k/原点生成，
        // 否则地板会跟机器人脱节（机器人按旧 k 算、背景按新 k 画）。
        window.addEventListener('resize', function () {
            World.layout();
        });

        // ★ 2026-11-01：原来这里有一个每秒刷新右上角实时时钟的 setInterval。
        //   用户要求把时钟换成电池百分比 —— 时钟对巡检场景没有信息量，
        //   电量才是"现在还能不能干活"的关键指标。电池的渲染由
        //   renderBattery() 负责（socket 事件 + 首屏一次 fetch），
        //   纯推送式，不需要任何轮询，所以这个定时器整个删掉了。

        // 地图拖动
        canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStartX = e.clientX - offsetX; dragStartY = e.clientY - offsetY; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { offsetX = e.clientX - dragStartX; offsetY = e.clientY - dragStartY; drawMap(); } });
        window.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            let my = (e.clientY - rect.top) * (canvas.height / rect.height);
            let mapX = (mx - offsetX) / scale;
            let mapY = (my - offsetY) / scale;
            let delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.min(Math.max(scale * delta, 0.05), 5);
            offsetX = mx - mapX * scale;
            offsetY = my - mapY * scale;
            drawMap();
        });
        
        addLog('系统就绪，请连接机器人', 'info');
    }
    
    window.onload = init;
</script>
</body>
</html>
