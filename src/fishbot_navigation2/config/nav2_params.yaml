amcl:
  ros__parameters:
    # 真实硬件，非仿真
    use_sim_time: False

    # ==========================================================
    # 里程计运动模型噪声参数（alpha）
    # ----------------------------------------------------------
    # 语义要说清楚，避免方向搞反：
    #   alpha 越大 = 认为这一步的轮式里程计越**不可信**
    #              = 粒子云散步越宽
    #              = 最终位姿越依赖激光匹配来收敛
    #   也就是说，**alpha 大就是「雷达占更大权重」**，不是相反。
    #
    # 本车实际值 vs 参考实现（wheeltec_robot_nav2 的同型号车）：
    #              本车    wheeltec   倍数
    #   alpha1     0.8      0.05      16x
    #   alpha2     0.5      0.05      10x
    #   alpha3     0.4      0.05       8x
    #   alpha4     1.0      0.05      20x
    # 所以「照搬了另一台车的 odom 权重导致雷达权重偏低」这个推断
    # 不成立——本车参数已经是刻意把 odom 权重压得很低了。
    #
    # 那为什么定位仍然差？因为问题不在权重，而在**odom 本身在静止时
    # 就在漂**（固件 Kinematics.cpp 的积分没有死区，±1 tick 量化噪声
    # 被积分成 0.025~0.05 rad/s）。给一个正在漂的输入再高的 alpha，
    # 也只能让粒子跟着漂。根治办法是在固件里加死区（2026-10-31 已改）。
    #
    # 也不建议把 alpha 继续调大：过大时粒子云过度发散，KLD 采样收敛
    # 变慢、甚至收敛到错误位置。当前值已处于偏差可容忍的上限。
    # ==========================================================
    alpha1: 0.8      # 旋转引起的角度噪声 (rad²/s²)
    alpha2: 0.5      # 平移引起的角度噪声 (rad²/m)
    alpha3: 0.4      # 平移引起的位置噪声 (m²/m)
    alpha4: 1.0      # 旋转引起的位置噪声 (m²/rad²)
    alpha5: 0.2      # 平移噪声相关系数

    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1

    # ==========================================================
    # 🔧【关键】激光似然场最大匹配距离
    # ----------------------------------------------------------
    # 2026-10-31 实测后从 5.0 降到 3.0。原因：
    #   本车地图 room1 只有 2.2% 像素是障碍物（墙壁），14.3% 空闲，
    #   83.5% 是未知区域。似然场只在靠近障碍物处有梯度，未知区域是
    #   平坦的——粒子落在那里得分都差不多，无法淘汰。
    #   原值 5.0m 而房间只有 12.5x11.5m，等于整个房间都有梯度，
    #   进一步稀释区分度，导致静止时收敛极慢且容易「假收敛」
    #   （全部粒子聚到一个错误位置、σ 很小但位置错）。
    #
    #   降到 3.0 后，只有真正靠近墙壁的粒子才能拿高分，
    #   区分度提高，收敛更快也更不容易收敛到错处。
    #
    #   不能降太小（如 <2.0）：一旦建图误差较大，正确位置也可能
    #   拿不到高分，反而收敛不了。3.0 是兼顾两者的折中值。
    # ==========================================================
    laser_likelihood_max_dist: 3.0

    # ★ laser_max_range 必须收紧到 lidar 真正可靠的距离。
    #   ydlidar 上报 range_max=64，但实际可靠量程约 8~10m（建图时也是
    #   按 8m 截断的）。原值 100.0 会让 AMCL 把大量远距离噪声点也当作
    #   有效观测去和地图匹配，直接拉低匹配质量。
    #   收到 10m 以内既保留房间墙壁信息，又过滤掉穿透门窗的虚假远点。
    laser_max_range: 10.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"

    # 每秒采样的激光束数。60 束对 12.5x11.5m 的房间偏少，
    # 提高到 90 后每帧激光提供更多约束，粒子权重的区分度更高
    # （= 激光话语权更大）。CPU 开销仍有剩余（粒子主体在 500~2000）。
    max_beams: 90

    # ==========================================================
    # 🔧【关键】粒子数（自动全局定位必须足够多）
    # 全局定位时粒子要撒满整张地图的可行区域，粒子太少会导致
    # 分辨率不足、收敛到错误位置甚至永远不收敛。
    # 参考 wheeltec_robot_nav2 的 param_four_wheel_diff.yaml（2000/500）。
    # 收敛后不会自动减少，嫌 CPU 高可调低到 1500/400。
    # ==========================================================
    max_particles: 2000      # 全局定位上限（原 500，全局散布不够用）
    min_particles: 500       # KLD 采样下限（原 200）
    odom_frame_id: "odom"
    pf_err: 0.05             # KLD 误差容限（原 0.10，收窄以便正确收敛）
    pf_z: 0.99

    # ==========================================================
    # 🔧【关键】启用粒子恢复
    # 当粒子退化时自动注入随机粒子，防止定位丢失
    # ==========================================================
    # ★ 2026-10-31 静止塌缩复盘后收紧（实测 127s 内 2 次塌缩、24 次跳变）：
    #   alpha_slow 0.01 太激进。静止时一旦粒子方差被压到物理下限，
    #   随机恢复粒子只要平均权重略高就会**成批注入并直接接管**，
    #   实测导致位姿瞬移 1.46~1.89m。回到接近默认的 0.002，
    #   让恢复只在真正被绑架时缓慢生效，而不是每 40 秒来一次。
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.002

    # ★ 原来 1 = 每次激光更新都重采样。车静止时运动模型不产生噪声，
    #   重采样副本彼此完全重合 → 方差单调塌缩 → 塌缩到 5mm 后
    #   滤波器失去全部备选假设。改成 2，重采样频率减半，
    #   方差下降速度同步减半（配合 update_min_* 收紧，实测足够）。
    resample_interval: 2
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5

    # ★ sigma_hit：激光命中地图障碍物的期望误差（米）。
    #   减小后似然场更"尖锐"——离障碍物近的粒子得到远高于远粒子的权重，
    #   滤波器的裁决更果决，相当于提高激光话语权。
    #   nav2 默认 0.2，本车用 0.15（lidar 精度尚可，但不宜再低以免过拟合
    #   到建图误差上）。
    sigma_hit: 0.15
    tf_broadcast: true

    # ==========================================================
    # 🔧【关键】TF 容忍时间（2026-10-31 回起点复盘后从 0.2 放宽到 1.0）
    # ----------------------------------------------------------
    # 曾经改成 0.2 是出于「减小 TF 滞后」的误解。transform_tolerance
    # 不是让 TF 更新更快，而是**在查不到当前时刻的变换时，允许拿多旧的
    # 数据凑合**。设小 = 更容易报错，不是更准。
    #
    # 实测故障（2026-10-31 21:45 回起点）：
    #   Exception in transformPose: Lookup would require extrapolation
    #   into the future. Requested 1793454305.734 but latest data is at
    #   1793454304.859785          ← map→odom 只新到 0.87s 前
    #   Unable to transform robot pose into global plan's frame
    #   Controller patience exceeded → [follow_path] Aborting handle
    # 一轮导航里出现 5 次，其中一次直接打断跟出。
    #
    # 为什么会滞后 0.87s：AMCL 只在处理激光帧时才重发 map→odom，
    # 而本项目雷达经 WiFi 传输，有效帧率仅 0.86Hz（还偶有丢帧）。
    # 用 nav2 默认的 1.0 即可留出足够余量。
    # ==========================================================
    transform_tolerance: 1.0

    # ==========================================================
    # 🔧【关键】静止更新阈值（2026-10-31 塌缩复盘后上调）
    # ----------------------------------------------------------
    # 曾经为了「更频繁用激光修正位姿」把阈值压到 0.05m / 0.05rad，
    # 结果是**静止时 EKF 的微小抖动就能不断触发 AMCL 更新**：
    #   IMU 噪声 + 编码器量化 → odom→base 抖动 > 5cm/2.9° → 更新
    #   → resample_interval=1 立即重采样 → 副本重合 → 方差塌缩
    # 实测 σ_xy 从 0.0446 一路压到 0.0010m，随后 AMCL 内置 recovery
    # 注入随机粒子，位姿瞬移 1.46~1.89m。
    #
    # 0.15m / 0.15rad 约等于 3 个地图栅格（0.05m），静态抖动无法触发，
    # 真正移动时照样每 15cm 就修正一次——精度完全够用。
    # ==========================================================
    update_min_a: 0.15     # ~8.6°
    update_min_d: 0.15     # 15cm（≈3 个栅格）

    # ==========================================================
    # 🔧【关键】激光模型信任度
    # z_hit: 激光命中地图的权重（越大越信任激光）
    # z_rand: 激光随机噪声的权重（应很小）
    # 原来 z_hit:0.5 / z_rand:0.5 意味着50%激光被当作噪声丢弃！
    # ==========================================================
    z_hit: 0.9        # 信任激光，原来 0.5
    z_max: 0.05
    z_rand: 0.05      # 降低随机噪声假设，原来 0.5
    z_short: 0.0      # 无遮挡物时不用短距分量

    scan_topic: scan

    # ==========================================================
    # 🔧【关键】初始位姿：不写死在地图原点
    # set_initial_pose=True 会让 AMCL 启动即用 (0,0,0) 初始化，
    # 也就是「固定把机器人当地图原点」——当车实际不在原点时，
    # AMCL 会用一个错误的先验开始，靠 recovery 慢慢挣扎。
    # 这里显式关闭，改由 fishbot_navigation2/auto_localizer 节点
    # 在启动后调用 /reinitialize_global_localization，让粒子云
    # 均匀撒满地图，随小车移动自动收敛到真实位姿。
    # （参考 wheeltec_robot_nav2：set_initial_pose: False）
    # ==========================================================
    set_initial_pose: False
    always_reset_initial_pose: False
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    max_recovery_attempts: 2
    recovery_timeout: 10.0
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 12.0
    
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      max_linear_vel: 0.2
      min_linear_vel: 0.05
      lookahead_dist: 0.8
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      max_allowed_time_to_collision: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      use_approach_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 8.0
      regulate_via_feasible_check: true
      transform_tolerance: 0.2
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      use_collision_detection: True
      collision_distance: 0.25
      simulate_ahead_time: 0.3
      
      # 差速机器人专用参数
      holonomic_robot: false
      max_angular_vel: 1.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      desired_angular_vel: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0     # 0.2m/s机器人，5Hz=每4cm更新，足够且稳定
      publish_frequency: 2.0     # 降低DDS流量，避免网络拥塞导致跳变
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3                   # 小车0.2m/s，3m窗口足够（原来 5）
      height: 3                  # 计算量减半（原来 5）
      resolution: 0.05
      robot_radius: 0.272
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
          obstacle_max_range: 2.5
          obstacle_min_range: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.272
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.30
          obstacle_max_range: 4.0
          obstacle_min_range: 0.35
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      smooth_path: true
      cost_travel_multiplier: 1.0
      analytic_expansion_max_length: 3.0
      motion_model_for_search: "MOORE"
      # 差速机器人专用参数
      minimum_turning_radius: 0.2
      cache_obstacle_heuristic: true
      reverse_penalty: 1.5
      change_penalty: 0.15
      non_straight_penalty: 1.2
      
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup","drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_vel: 0.6
      spin_angle: 3.14159
      max_rotational_vel: 0.6
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.2
      max_rotation_time: 8.0
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_vel: -0.15
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: True
    feedback: "CLOSED_LOOP"
    max_velocity: [0.25, 0.0, 0.8]    
    min_velocity: [-0.18, 0.0, -0.6]  
    max_accel: [0.6, 0.0, 1.2]      
    max_decel: [-0.6, 0.0, -1.2]    
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
