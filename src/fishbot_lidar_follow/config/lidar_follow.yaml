# ============================================================
# 雷达跟随参数
# ------------------------------------------------------------
# 用法：
#   ros2 launch autopatrol_robot lidar_follow.launch.py
#   ros2 launch autopatrol_robot lidar_follow.launch.py \
#       lidar_follow_params:=/path/to/your.yaml
#
# 所有距离单位均为米，速度单位 m/s、rad/s。
# ============================================================
lidar_follow_node:
  ros__parameters:

    # ---------- 输入 ----------
    scan_topic: /scan
    # 雷达安装高度很低（laser_link 在 base_link 上方 0.075m），
    # 地面/地毯可能被扫到。低于这个高度的就算噪声也照样进数据，
    # 所以这里只能靠距离和角度过滤，不能靠高度。
    cmd_vel_topic: /cmd_vel
    control_rate: 20.0          # 控制循环频率（Hz）。雷达只有 5Hz，
                                # 但控制要跑得更勤，才能用卡尔曼预测补上延迟

    # ---------- 目标识别 ----------
    # 首次锁定的距离门槛。
    # ★ 实机标定（2026-10-31）：雷达装在车体**正中心**，
    #   用户量的"前方40cm"如果从车头算，雷达读数会多出车体半径。
    #   实测物体在 0.44m 时点云 24~28 点、单簇、读数极稳，
    #   但旧值 0.40 差 4cm 锁不上。
    #   调到 0.50 后：覆盖 0.44m，且不超过 retreat_enter(0.50)，
    #   锁定后不会立刻触发后退。
    #   注意：再往上调就会和 retreat_enter 冲突（锁定即后退）。
    lock_max_range: 0.50
    # 锁定之后放宽的范围。目标往后退也能继续跟，否则没法"前进追赶"。
    track_max_range: 1.20
    # 雷达 range_min=0.30，所以实际下限是 0.30。
    sector_half_angle_deg: 30.0

    # 聚类：相邻点如果角度差和距离差都小于阈值，算同一个物体
    cluster_angle_gap_deg: 2.5
    cluster_range_gap: 0.15

    # 点数少于这个值的簇直接忽略。
    # ★ 实测必须开：真实雷达里 1~3 个点的簇几乎都是噪声
    #   （柜子边缘、家具反光），但它们的距离可能只有 0.8m，
    #   不滤掉就会被当成目标「追过去」。
    # ⚠ 注意：这条只作用于**单簇**目标。
    #   人腿只有 1~4 个点，靠下面的「双腿配对」单独认定，
    #   不受这条门槛限制，否则人会永远锁不上。
    min_cluster_points: 5

    # 已锁定时，新目标距离与当前目标相差超过此值 → 判为换了物体，
    # 当作本帧没有目标（交给丢帧逻辑），而不是立刻切过去。
    # ★ 实测必须开：目标被推到 30cm 内（雷达 range_min 下限）时
    #   近处点全部消失，剩下的远簇只差 0.54m，
    #   不拦住就会切换目标并开始前进。
    max_target_jump: 0.30

    # ============================================================
    # 双腿成对锁定（2026-10-31 实机问题的根因修复）
    # ------------------------------------------------------------
    # 现象：车能跟着人动，但「锁定」不稳定、来回抖。
    #
    # 原因：雷达装在车体下沿（约 10cm 高），扫不到人躯干，
    #       只有两条小腿。两条腿在极坐标里是**互不相连的两个小簇**，
    #       每条腿只有 1~4 个点，被 min_cluster_points=5 当成噪声
    #       整簇丢掉 → 永远进不了候选。
    #       即使偶尔某条腿凑够点数，目标也会在两条腿之间来回跳，
    #       角度瞬抖 ±10°，车跟着抽。
    #
    # 办法：找「相邻的两个小簇」，把**两点中点**当目标。
    #       中点≈人体中心线，既不左右跳，也正是「保持 50cm」
    #       应当量到的位置。锁定后交给卡尔曼持续预测。
    # ============================================================
    pair_enable: true
    # 两个点各自的距离上限（用户要求：不超过 1m）
    pair_lock_max_range: 1.00
    pair_track_max_range: 1.20
    # 两点的直线距离必须落在这个区间
    # 上限 0.60m = 用户要求；下限 0.05m 是为了排除
    # 「同一个物体被聚类切成两半」的情况
    pair_max_sep: 0.60
    pair_min_sep: 0.05
    # 两条腿基本在同一深度。一近一远的是「腿 + 墙」，不是一双腿。
    # 0.22m ≈ 一步的步幅，人走路时前后腿的最大深度差也超不过它。
    pair_max_dist_diff: 0.22
    # 两个簇点数之和的下限。人腿太细，1+1=2 也要认
    pair_min_points: 2
    # 人腿角度很窄（几度），墙/柜子几十度 —— 用它把墙排除掉
    pair_max_span_deg: 45.0
    # 两点的**横向**间距（垂直于视线）上限。横向就是「腿距」，
    # 真人约 0.22m，极少超过 0.5m。
    # ★ 专治「帧间随机跳动的噪声点凑成一对」：
    #   仿真里曾出现间距 0.56m、角度差 49° 的假双腿，
    #   只靠直线间距 60cm 拦不住，横向分量能拦住。
    pair_max_lateral_sep: 0.50
    # 两点的**纵向**错位上限（沿视线）。
    # 并排站时两腿几乎前后对齐；侧身站时也会前后重叠。
    # 真正一前一后差 30cm 以上的，只能是两个不相关的物体。
    pair_max_along_sep: 0.25

    # ---- 单腿兜底 ----
    # 人走路时两条腿会互相遮挡，经常只有一条腿可见。
    # 这时双腿对不成立，但目标不能丢 —— 用单腿的**距离**继续跟。
    # 角度不能用：单腿偏离身体中心 ±10° 左右，
    # 直接拿它反角度会让车左右抽，所以角度交给卡尔曼预测。
    leg_fallback_enable: true
    # 只认小簇。5 点以上属于实体目标，走正常单簇路径
    leg_max_points: 4
    # 与预测距离的容差。超过就认为不是同一个人，宁可丢
    leg_max_dist_diff: 0.35

    # 未锁定时的搜索扇区半角。75° 即总计 150°，
    # 站在车侧面的人也能被认出来。
    # 锁定后扇区会自动跟随目标方位放宽，不需要改这里。
    lock_sector_half_angle_deg: 75.0

    # 已锁定时允许的角度跳变。距离相近但角度差太多的不是同一目标
    max_angle_jump_deg: 25.0

    # 刚锁定后的稳定观察期（秒）。这段时间内只观察、不动作。
    # 即使锁上的是噪声，几帧内它也会跳走并触发丢失/跳变保护。
    # 正常使用无感知：人站好 → 锁定 → 本就应该等人开始走才动。
    lock_settle_time: 1.0

    # ---- 首次锁定的时间确认 ----
    # 连续确认到第 N 帧才承认锁定（雷达 5Hz，5 帧 = 1.0s）。
    # 噪声点一闪而过，人站在那里是持续的 —— 用时间换可靠性，
    # 比单纯堆点数门槛靠谱。
    #
    # ★ 5 帧不是拍脑袋定的：纯逻辑层反复跑 800 次统计
    #   （每帧 3 个完全随机的散点，模拟最坏情况）：
    #     帧数  tol=0.15m/8°   tol=0.10m/6°
    #      3         9.1%          2.5%
    #      4         0.6%          0.1%
    #      5         0.0%          0.0%
    #   真人双腿（腿距 0.22m±2cm、距离 0.62m±3cm）在所有配置下
    #   都是 100% 锁定成功。所以取 5 帧 + 0.10m/6°，
    #   代价只是站好之后多等 1 秒。
    lock_confirm_frames: 5
    # 确认期间允许多少帧「整帧看不到目标」（可能被挡住了）
    lock_confirm_miss: 2
    lock_confirm_tol_dist: 0.10
    lock_confirm_tol_angle_deg: 6.0
    # 确认期间还要求「两腿间距」稳定。
    # ★ 真实人的腿距几乎不变（不随距离变），噪声两点却每帧都变。
    #   这条比中点容差更能拦住「随机点凑巧凑成一对」。
    lock_confirm_tol_sep: 0.20

    # ---------- 距离死区（三态滞回）----------
    #        <0.50        0.55        0.65        >
    #   RETREAT ─┤   HOLD   ├─ APPROACH
    #            ↑          ↑
    #      后退到这里停   前进到这里停
    #
    # 进入和退出用不同阈值，形成 10cm 滞回带，
    # 避免目标在 50cm 附近微动时状态反复翻转。
    approach_enter: 0.65        # d > 此值 → 开始前进
    approach_exit: 0.55         # 前进到 d < 此值 → 停止前进（进入 HOLD）
    retreat_enter: 0.50         # d < 此值 → 开始后退
    retreat_exit: 0.55          # 后退到 d > 此值 → 停止后退（进入 HOLD）

    # 距离误差死区：目标距离与期望距离之差小于此值就当 0
    # 期望距离取 0.575（0.55 和 0.60 的中点），只在 APPROACH 内用于速度调节
    desired_distance: 0.575
    distance_deadband: 0.02

    # ---------- 角度控制 ----------
    angle_deadband_deg: 2.0     # 方位角误差 < 2° 视为对准，不转向
    # 目标偏离超过这个角度时先原地转向、不前进
    # （否则会一边前进一边大角度转弯，描出弧线冲过去）
    align_before_move_deg: 15.0

    # ---------- 速度 ----------
    max_linear: 0.22            # 前进最大速度
    max_reverse: 0.12           # 后退最大速度（比前进慢，安全）
    max_angular: 0.80           # 最大角速度

    # PD 增益。距离环和角度环分开。
    kp_linear: 1.10             # 距离误差 → 线速度
    kd_linear: 0.18             # 距离误差变化率 → 线速度
    kp_angular: 1.60            # 角度误差 → 角速度
    kd_angular: 0.12            # 角度误差变化率 → 角速度

    # 输出死区：算出来的速度小于此值直接归零，避免电机嗡嗡响
    cmd_linear_deadband: 0.015
    cmd_angular_deadband: 0.020

    # 速度变化限幅（m/s²、rad/s²），让动作平滑不抖动
    linear_accel_limit: 0.80
    angular_accel_limit: 2.50

    # ---------- 卡尔曼滤波 ----------
    # 对 (距离 d, 方位角 θ) 各用一个匀速模型卡尔曼。
    # 状态 [位置, 速度]，测量只有位置。
    # 雷达 5Hz 有 200ms 延迟，靠这里的速度估计做预测补偿。
    kf_process_noise_pos: 0.0015
    kf_process_noise_vel: 0.060
    kf_measure_noise_dist: 0.010    # 测距噪声（m）
    kf_measure_noise_angle: 0.012   # 测角噪声（rad）

    # 卡尔曼估出的径向速度超过这个值 → 目标不可信，停车。
    # 这是拦「帧间随机跳动的杂散点」的最后一道阀：
    # 几何判据堆到极限也拦不住所有巧合，但噪声有一个绕不过去的
    # 特征 —— 位置突变会让速度估计爆表。
    # 真人快走也就 1.0m/s，再算上本车 0.22m/s 的相对速度，
    # 1.5m/s 已经留足余量。
    max_target_speed: 1.50

    # ---------- 安全 ----------
    # 后退前检查后方，有障碍就不退（防止撞到从背后靠近的人或墙）
    rear_check_range: 0.40
    rear_sector_half_angle_deg: 40.0

    # 前方防撞：正常前进时也看一眼，比目标更近的东西要刹车
    front_guard_range: 0.32

    # 超过这么久没收到有效 scan → 判定雷达故障，停车
    scan_timeout: 0.60
    # 丢失目标后立即停车（用户选定的策略）
    # 但允许「短暂丢帧」——连续丢帧超过这个次数才真正判丢失，
    # 因为单线雷达偶尔会漏一两个点
    lost_frame_threshold: 3

    # ---------- 与导航互斥 ----------
    # 跟随运行时占一个锁文件（路径固定在 mutual_exclusion.py 里），
    # 导航工具看到锁就拒绝执行

    # 启动时自动停掉正在运行的导航
    stop_nav_on_start: true

    # ---------- 调试 ----------
    # true 时把目标点、聚类结果发到 debug 话题，方便 rviz 看
    publish_debug: true
    debug_topic: /lidar_follow/debug
    state_topic: /lidar_follow/state
