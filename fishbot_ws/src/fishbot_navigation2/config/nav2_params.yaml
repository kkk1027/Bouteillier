amcl:
  ros__parameters:
    # 真实硬件，非仿真
    use_sim_time: False

    # ==========================================================
    # 🔧【关键】里程计运动模型噪声参数
    # 增大这些值 = AMCL 不信任轮式里程计精度
    #          = 粒子更分散 = 更依赖激光扫描匹配来修正位姿
    # 真实机器人有轮子打滑、地面不平、编码器误差
    # 仿真中这些值设 0.1 是因为 gazebo 里程计完美
    # ==========================================================
    alpha1: 0.8      # 旋转引起的角度噪声 (rad²/s²)
    alpha2: 0.5      # 平移引起的角度噪声 (rad²/m)
    alpha3: 0.4      # 平移引起的位置噪声 (m²/m)
    alpha4: 1.0      # 旋转引起的位置噪声 (m²/rad²)
    alpha5: 0.2      # 平移噪声相关系数

    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1

    # ==========================================================
    # 🔧【关键】激光似然场最大匹配距离
    # 增大 = 更远的激光点参与地图匹配 = 匹配更准
    # YDLIDAR 有效量程约 8m，设 5.0 充分利用
    # ==========================================================
    laser_likelihood_max_dist: 5.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 500       # 定位稳定后降低以节省CPU（原来 1000）
    min_particles: 200       # KLD采样下限（原来 500）
    odom_frame_id: "odom"
    pf_err: 0.10             # KLD误差容限放宽（原来 0.05）
    pf_z: 0.99

    # ==========================================================
    # 🔧【关键】启用粒子恢复
    # 当粒子退化时自动注入随机粒子，防止定位丢失
    # ==========================================================
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.01    # 加速慢恢复，被绑架后更快重新定位（原来 0.001）

    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true

    # ==========================================================
    # 🔧【关键】减小 TF 容忍时间
    # 1.0 秒太大会导致 TF 滞后，影响激光匹配精度
    # ==========================================================
    transform_tolerance: 0.2

    # ==========================================================
    # 🔧【关键】降低更新阈值
    # 原来 0.25m / 0.2rad 才更新粒子滤波
    # 减小后：更频繁地用激光修正位姿
    # ⚠️ 粒子数已减半（500→200），可以进一步降阈值而不卡
    # ==========================================================
    update_min_a: 0.05     # ~2.9°，更频繁用激光修正角度（原来 0.1）
    update_min_d: 0.05     # 5cm，更频繁用激光修正位置（原来 0.1）

    # ==========================================================
    # 🔧【关键】激光模型信任度
    # z_hit: 激光命中地图的权重（越大越信任激光）
    # z_rand: 激光随机噪声的权重（应很小）
    # 原来 z_hit:0.5 / z_rand:0.5 意味着50%激光被当作噪声丢弃！
    # ==========================================================
    z_hit: 0.9        # 信任激光，原来 0.5
    z_max: 0.05
    z_rand: 0.05      # 降低随机噪声假设，原来 0.5
    z_short: 0.0      # 无遮挡物时不用短距分量

    scan_topic: scan

